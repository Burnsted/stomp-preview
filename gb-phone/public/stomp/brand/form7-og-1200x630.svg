<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="STOMP">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  <!-- subtle vignette -->
  <defs>
    <radialGradient id="v" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#v)"/>
  <!-- Form #7 lockup centered: mark + wordmark -->
  <g transform="translate(286, 251)">
    <!-- mark: white rounded square, black S -->
    <rect width="128" height="128" rx="28" fill="#FFFFFF"/>
    <text x="64" y="92" text-anchor="middle"
      font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
      font-size="88" font-weight="900" fill="#0A0A0A">S</text>
    <!-- wordmark -->
    <text x="152" y="98"
      font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
      font-size="96" font-weight="900" letter-spacing="0.06em" fill="#FFFFFF">STOMP</text>
  </g>
</svg>
