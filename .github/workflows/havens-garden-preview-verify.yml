# Cheap Playwright verify for Haven's Garden birthday preview only.
# No secrets. No deploy.
name: havens-garden-preview-verify

on:
  pull_request:
    paths:
      - "arcade/havens-garden-birthday-preview/**"
      - ".github/workflows/havens-garden-preview-verify.yml"

jobs:
  preview-tests:
    name: birthday-preview playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arcade/havens-garden-birthday-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: arcade/havens-garden-birthday-preview/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havens-garden-test-evidence
          path: arcade/havens-garden-birthday-preview/test-evidence/
          if-no-files-found: ignore
