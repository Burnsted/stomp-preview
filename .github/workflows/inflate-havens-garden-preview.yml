name: inflate-havens-garden-preview
on:
  push:
    paths:
      - 'arcade/havens-garden-preview/.packed/**'
      - '.github/workflows/inflate-havens-garden-preview.yml'
  workflow_dispatch:
jobs:
  inflate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download and unpack preview zip
        run: |
          set -euo pipefail
          PAGE_URL=$(tr -d '[:space:]' < arcade/havens-garden-preview/.packed/download-page-url.txt)
          echo "Fetching page $PAGE_URL"
          curl -fsSL --max-time 60 "$PAGE_URL" -o /tmp/hgp-page.html
          DL_URL=$(python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('/tmp/hgp-page.html').read_text()
          m = re.search(r'href="(https://tmpfiles\.org/dl/[^"]+havens-garden-preview\.zip)"', html)
          if not m:
              raise SystemExit('download link not found on tmpfiles page')
          print(m.group(1))
          PY
          )
          echo "Downloading $DL_URL"
          curl -fsSL --max-time 180 "$DL_URL" -o /tmp/havens-garden-preview.zip
          python3 - <<'PY'
          import pathlib, shutil, zipfile
          root = pathlib.Path('arcade/havens-garden-preview')
          packed = root / '.packed'
          with zipfile.ZipFile('/tmp/havens-garden-preview.zip') as zf:
              names = zf.namelist()
              print('zip entries', len(names))
              for child in list(root.iterdir()):
                  if child.name == '.packed':
                      continue
                  if child.is_dir():
                      shutil.rmtree(child)
                  else:
                      child.unlink()
              zf.extractall('/tmp/hgp-extract')
          extracted = pathlib.Path('/tmp/hgp-extract/havens-garden-preview')
          if not extracted.is_dir():
              extracted = pathlib.Path('/tmp/hgp-extract')
          for child in extracted.iterdir():
              dest = root / child.name
              if dest.exists():
                  if dest.is_dir():
                      shutil.rmtree(dest)
                  else:
                      dest.unlink()
              shutil.move(str(child), str(dest))
          index = (root / 'index.html').read_text(encoding='utf-8')
          assert '<!DOCTYPE html' in index or '<!doctype html' in index.lower()
          sw = (root / 'sw.js').read_text(encoding='utf-8')
          assert 'havens-garden-preview-v1-franz-batch1' in sw
          assert (root / 'assets/icon/app-icon.png').is_file()
          game = (root / 'js/game.js').read_text(encoding='utf-8')
          assert 'havensGarden.v1' in game
          for p in packed.glob('chunk*.b64'):
              p.unlink()
          for p in [packed / '.agent-push-test.txt', packed / 'manifest.json']:
              if p.exists():
                  p.unlink()
          print('ok files', sum(1 for _ in root.rglob('*') if _.is_file()))
          PY
      - name: Commit inflated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A arcade/havens-garden-preview
          git diff --cached --quiet || git commit -m "feat(arcade): inflate havens-garden-preview Franz batch-1 phone draft"
          git push
