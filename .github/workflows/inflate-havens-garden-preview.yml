name: inflate-havens-garden-preview
on:
  push:
    paths:
      - 'arcade/havens-garden-preview/.packed/**'
      - '.github/workflows/inflate-havens-garden-preview.yml'
  workflow_dispatch:
jobs:
  inflate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inflate havens-garden-preview tree
        run: |
          python3 - <<'PY'
          import base64, json, pathlib, shutil, tarfile, tempfile, zlib
          root = pathlib.Path('arcade/havens-garden-preview')
          packed = root / '.packed'
          manifest = json.loads((packed / 'manifest.json').read_text())
          n = int(manifest['chunks'])
          parts = []
          for i in range(n):
              p = packed / f'chunk{i:03d}.b64'
              parts.append(p.read_text().strip())
          b64 = ''.join(parts)
          raw = zlib.decompress(base64.b64decode(b64))
          print('inflated tar bytes', len(raw))
          with tempfile.TemporaryDirectory() as td:
              tar_path = pathlib.Path(td) / 'game.tar'
              tar_path.write_bytes(raw)
              extract_dir = pathlib.Path(td) / 'out'
              extract_dir.mkdir()
              with tarfile.open(tar_path, 'r') as tf:
                  tf.extractall(extract_dir)
              for child in list(root.iterdir()):
                  if child.name == '.packed':
                      continue
                  if child.is_dir():
                      shutil.rmtree(child)
                  else:
                      child.unlink()
              for child in extract_dir.iterdir():
                  dest = root / child.name
                  if child.is_dir():
                      shutil.copytree(child, dest)
                  else:
                      shutil.copy2(child, dest)
          index = (root / 'index.html').read_text(encoding='utf-8')
          assert '<!DOCTYPE html' in index or '<!doctype html' in index.lower()
          sw = (root / 'sw.js').read_text(encoding='utf-8')
          assert 'havens-garden-preview-v1-franz-batch1' in sw
          assert (root / 'assets/icon/app-icon.png').is_file()
          assert (root / 'js/game.js').is_file()
          game = (root / 'js/game.js').read_text(encoding='utf-8')
          assert "havensGarden.v1" in game
          print('ok files', sum(1 for _ in root.rglob('*') if _.is_file()))
          PY
      - name: Commit inflated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arcade/havens-garden-preview
          git diff --cached --quiet || git commit -m "feat(arcade): inflate havens-garden-preview Franz batch-1 [skip ci]"
          git push
