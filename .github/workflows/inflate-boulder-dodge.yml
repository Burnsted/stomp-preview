name: inflate-boulder-dodge
on:
  push:
    paths:
      - 'arcade/boulder-dodge/.packed/**'
      - '.github/workflows/inflate-boulder-dodge.yml'
  workflow_dispatch:
jobs:
  inflate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inflate index.html
        run: |
          python3 - <<'PY'
          import base64, zlib, pathlib
          parts = [pathlib.Path(f'arcade/boulder-dodge/.packed/chunk{i}.b64').read_text().strip() for i in range(4)]
          b64 = ''.join(parts)
          raw = zlib.decompress(base64.b64decode(b64))
          pathlib.Path('arcade/boulder-dodge/index.html').write_bytes(raw)
          text = raw.decode('utf-8')
          assert text.startswith('<!DOCTYPE html')
          assert "version:'0.7.7'" in text
          assert 'TAB_DK' in text
          assert 'POST_LIP' in text
          assert 'holdSet' in text
          assert 'SPD_PER_2LV' in text
          assert 'SPD_AFTER_L4' in text
          assert 'AIR_TAP_MUL' in text
          assert 'KICK_A' in text
          assert 'jumpBoing' in text
          assert 'doubleJump' in text
          assert 'legendPlay' in text
          assert 'Black Diamond' in text
          print('bytes', len(raw))
          PY
      - name: Commit inflated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arcade/boulder-dodge/index.html
          git diff --cached --quiet || git commit -m "feat: boulder-dodge v0.7.7 GD curve legend double-tap [skip ci]"
          git push
