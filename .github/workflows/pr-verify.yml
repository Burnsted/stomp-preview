# Batch 1 — typecheck + unit tests only.
# No secrets. No deploy. No GitHub Pages publish.
name: pr-verify

on:
  pull_request:
    paths:
      - "batch1/**"
      - ".github/workflows/pr-verify.yml"
      - "docs/batch-1/**"

jobs:
  batch1-verify:
    name: batch1 typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: batch1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: batch1/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
