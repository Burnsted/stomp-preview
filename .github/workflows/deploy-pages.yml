# Build gb-phone (Vite SPA) and publish to GitHub Pages.
# Live URL: https://burnsted.github.io/stomp-preview/
#
# Durable path: actions/deploy-pages (GitHub Actions as Pages source).
# Legacy fallback: git-sync static site onto main root so "Deploy from
# branch: main /" keeps serving the Vite app without wiping gb-phone/ history.
# (peaceiris cannot publish main→main; we rsync + commit instead.)
name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - "gb-phone/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    name: build gb-phone pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gb-phone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gb-phone/package-lock.json
      - run: npm ci
      - name: Verify locked Invite/greet.tsx
        run: |
          expected=0811babf8c7139a86738e2bd677db8544f09672b83a8fad345075f8bfb996fc2
          actual=$(sha256sum src/components/stomp/greet.tsx | awk '{print $1}')
          echo "greet.tsx sha256=$actual"
          test "$actual" = "$expected"
      - run: npm run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-pages
      - name: Upload legacy-root sync bundle
        uses: actions/upload-artifact@v4
        with:
          name: site-pages-legacy
          path: site-pages

  deploy-github-pages:
    name: deploy (Actions Pages)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prefer Actions as Pages source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT "repos/${{ github.repository }}/pages" \
            -f build_type=workflow || true
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

  deploy-legacy-main-root:
    name: sync site onto main root (legacy Pages)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: site-pages-legacy
          path: site-pages
      - name: Copy Vite site into repo root (keep gb-phone / docs / history)
        run: |
          set -euo pipefail
          # Replace only published site paths; never touch gb-phone/, docs/, batch1/, flutter-holding/.
          rm -rf assets __grok stomp
          cp -a site-pages/index.html site-pages/404.html site-pages/.nojekyll ./
          cp -a site-pages/favicon.svg site-pages/og.jpg ./
          cp -a site-pages/assets site-pages/__grok site-pages/stomp ./
          rm -rf site-pages
          test -f index.html
          grep -q '/stomp-preview/assets/' index.html
          ! grep -qi flutter_bootstrap index.html
      - name: Commit and push root site if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            index.html 404.html .nojekyll favicon.svg og.jpg \
            assets __grok stomp
          if git diff --cached --quiet; then
            echo "No root site changes to publish."
            exit 0
          fi
          git commit -m "deploy(pages): gb-phone Vite static site [skip ci]"
          git push origin HEAD:main
