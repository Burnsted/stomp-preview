<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390" />
  <title>t1244u mock 01 — Spot feed (static)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 390px;
      height: 844px;
      overflow: hidden;
      font-family: Outfit, system-ui, sans-serif;
      color: #f4f6f8;
      background: #070b14;
    }
    .phone {
      position: relative;
      width: 390px;
      height: 844px;
      overflow: hidden;
      background: #05080f;
    }
    /* Full-bleed original illustration — kicker / feature (not a photo) */
    .bleed {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(80% 50% at 50% 20%, rgba(255,255,255,0.08), transparent 55%),
        linear-gradient(180deg, #1a2740 0%, #0c1424 45%, #070b14 100%);
    }
    .bleed svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    .veil {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,11,20,0.35) 0%, transparent 28%, transparent 55%, rgba(7,11,20,0.92) 100%);
      pointer-events: none;
    }
    /* Form #7 monochrome header */
    .header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 18px 16px 10px;
    }
    .mark {
      width: 28px; height: 28px;
      border-radius: 7px;
      background: #fff;
      color: #0a0a0a;
      font: 900 20px/28px "Arial Black", Arial, sans-serif;
      text-align: center;
    }
    .word {
      font-family: Anton, sans-serif;
      font-size: 26px;
      letter-spacing: 0.04em;
      font-weight: 400;
    }
    /* Max ~3 rider-facing elements: name, one tag, one CTA */
    .chrome {
      position: absolute;
      left: 16px; right: 72px;
      bottom: 108px;
      z-index: 4;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-start;
    }
    .name {
      font-family: Anton, sans-serif;
      font-size: 36px;
      letter-spacing: 0.02em;
      line-height: 1;
      text-shadow: 0 2px 16px rgba(0,0,0,0.55);
    }
    .tag {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #f4f6f8;
      opacity: 0.92;
    }
    .cta {
      margin-top: 4px;
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      background: #f4f6f8;
      color: #0a0a0a;
      font: 700 14px Outfit, sans-serif;
    }
    /* Tiny info tap — hides founder/keeper/expiry/etc. */
    .info {
      position: absolute;
      top: 56px; right: 16px;
      z-index: 5;
      width: 32px; height: 32px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(11,18,32,0.45);
      color: #f4f6f8;
      font: 700 14px Outfit, sans-serif;
      display: grid;
      place-items: center;
    }
    /* Single bottom-right Sesh FAB */
    .fab-wrap {
      position: absolute;
      right: 14px;
      bottom: 88px;
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .fab-cap {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      opacity: 0.75;
    }
    .fab {
      width: 52px; height: 52px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      background: #0b1220;
      color: #f4f6f8;
      display: grid;
      place-items: center;
    }
    .tabs {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 64px;
      z-index: 5;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 10px;
      background: linear-gradient(180deg, transparent, rgba(7,11,20,0.95));
      font-size: 10px;
      font-weight: 600;
      color: rgba(244,246,248,0.55);
    }
    .tabs span:nth-child(2) { color: #f4f6f8; }
    .badge {
      position: absolute;
      top: 14px; right: 14px;
      z-index: 8;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: rgba(244,246,248,0.45);
    }
  </style>
</head>
<body>
  <div class="phone" data-mock="t1244u-01-spot-feed">
    <p class="badge">STATIC MOCK · NOT APP</p>
    <div class="bleed" aria-hidden="true">
      <!-- Original generic kicker illustration -->
      <svg class="scene" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2a3d5c"/>
            <stop offset="100%" stop-color="#0b1220"/>
          </linearGradient>
          <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#dfe6f0"/>
            <stop offset="100%" stop-color="#8b95a8"/>
          </linearGradient>
        </defs>
        <rect width="390" height="844" fill="url(#sky)"/>
        <!-- distant ridge -->
        <path d="M0 420 L90 310 L160 380 L240 280 L320 360 L390 300 L390 844 L0 844 Z" fill="#152033"/>
        <!-- snow slope -->
        <path d="M0 520 C120 480 200 560 390 500 L390 844 L0 844 Z" fill="url(#snow)" opacity="0.35"/>
        <!-- kicker -->
        <path d="M70 620 L210 560 L250 600 L110 680 Z" fill="#c8d0dc"/>
        <path d="M210 560 L250 600 L270 590 L230 548 Z" fill="#9aa6b8"/>
        <!-- rider silhouette in air -->
        <g transform="translate(268 470)" fill="none" stroke="#f4f6f8" stroke-width="3.2" stroke-linecap="round">
          <circle cx="0" cy="-28" r="9"/>
          <path d="M0 -18 L0 8"/>
          <path d="M-14 -2 L0 4 L16 -10"/>
          <path d="M0 8 L-12 28"/>
          <path d="M0 8 L14 24"/>
          <path d="M-22 34 C-4 26 10 26 28 36" stroke-width="4"/>
        </g>
        <!-- trees -->
        <path d="M40 700 L55 640 L70 700 Z" fill="#1c283c"/>
        <path d="M320 720 L340 650 L360 720 Z" fill="#1c283c"/>
        <path d="M350 740 L365 680 L380 740 Z" fill="#152033"/>
      </svg>
    </div>
    <div class="veil"></div>

    <header class="header">
      <div class="mark" aria-hidden="true">S</div>
      <div class="word">STOMP</div>
    </header>

    <button class="info" type="button" title="More info" aria-label="Spot info">i</button>

    <div class="chrome">
      <h1 class="name">Little Launcher</h1>
      <p class="tag">#kicker</p>
      <button class="cta" type="button">Add clip</button>
    </div>

    <div class="fab-wrap">
      <span class="fab-cap">HEY SESH</span>
      <div class="fab" aria-label="Hey Sesh">
        <svg width="26" height="26" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M8 34c6-3 12-4 16-4s10 1 16 4"/>
          <circle cx="24" cy="16" r="4"/>
          <path d="M24 20v8M18 24l6 2 6-4M24 28l-4 6M24 28l5 5"/>
        </svg>
      </div>
    </div>

    <nav class="tabs" aria-hidden="true">
      <span>Home</span><span>Map</span><span>Music</span><span>Stats</span><span>Crew</span>
    </nav>
  </div>
</body>
</html>
