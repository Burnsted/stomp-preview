<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2a1458"><title>Halfpipe Jam</title>
<style>
html,body{margin:0;height:100%;background:#2a1458;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh}
.btn{position:fixed;top:10px;width:44px;height:44px;border-radius:10px;border:2px solid #fff8;background:#0006;color:#fff;font:bold 16px system-ui,sans-serif;z-index:2}
#pause{right:10px}#mute{right:62px}#menuB{right:114px}
#actB{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:2;width:96px;height:96px;border-radius:50%;border:4px solid #fff;font:800 18px/1.05 system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:0;background:#3ecf9a;color:#140828;box-shadow:0 6px 0 #1a6b4a,0 10px 24px #0008}
#actB.mode-air{background:#ff2d55;color:#fff;box-shadow:0 6px 0 #8b1028,0 10px 24px #0008}
#actB.mode-retry,#actB.mode-next{background:#ffb84a;color:#14213d;box-shadow:0 6px 0 #9a7a10,0 10px 24px #0008;font-size:17px}
#actB:active{transform:scale(.92)}
@media (prefers-reduced-motion:reduce){#actB{transition:none}}
#hint{position:fixed;left:50%;bottom:max(126px,calc(env(safe-area-inset-bottom)+118px));transform:translateX(-50%);z-index:2;background:#000c;color:#fff;border:2px solid #ffb84a;border-radius:12px;padding:10px 14px;font:bold 14px system-ui,sans-serif;pointer-events:none;display:none;max-width:min(92vw,480px);text-align:center;box-shadow:0 4px 16px #0008}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
#resumeOv{position:fixed;inset:0;z-index:4;background:#1a0a30d8;display:none;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
#resumeB{width:min(420px,100%);min-height:88px;border-radius:18px;border:4px solid #fff;background:#3ecf9a;color:#140828;font:800 28px/1.1 system-ui,sans-serif;box-shadow:0 8px 0 #1a6b4a;touch-action:manipulation}
#menu{position:fixed;inset:0;z-index:3;background:#1a0a30ee;color:#fff;font:15px system-ui,sans-serif;overflow:auto;display:none;padding:14px;box-sizing:border-box;text-align:center;word-break:break-word}
#menu h1{margin:4px 0 2px;font-size:26px;letter-spacing:1px}
#menu h2{font-size:14px;margin:14px 0 6px;color:#d4b0ff;letter-spacing:.06em;text-transform:uppercase}
.grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:720px;margin:0 auto}
.lv,.bd{min-width:150px;min-height:48px;border-radius:10px;border:2px solid #fff5;background:#3a2068;color:#fff;font:bold 14px system-ui,sans-serif;padding:6px 8px}
.lv[disabled],.bd[disabled]{opacity:.4}
.lv.done{border-color:#3ecf9a}.bd.sel{border-color:#ffb84a;background:#3a2a14}
.lv small,.bd small{display:block;font-weight:normal;font-size:12px;opacity:.9;margin-top:2px}
.lv{text-align:left;display:flex;align-items:center;gap:10px}
.lv b.n{flex:none;width:34px;height:34px;border-radius:50%;background:#1a0a30;display:flex;align-items:center;justify-content:center;font-size:16px}
.lv.done b.n{background:#3ecf9a;color:#1a0a30}
.lv span.t{flex:1}.bd{display:flex;align-items:center;gap:10px;text-align:left}
.boards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:720px;margin:0 auto}
.boards .bd{min-width:0;min-height:40px;padding:4px 8px;font-size:12px}
.sw{flex:none;width:64px;height:14px;border-radius:7px;border:2px solid #1a0a30;box-shadow:0 2px 0 #0006}
.lk{max-width:720px;margin:8px auto;padding:8px;border:2px solid #ffb84a;border-radius:10px;background:#2a1800;text-align:left}
.lk .lkrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.lk .card{flex:1 1 130px;padding:6px 8px;border-radius:8px;border:2px solid #fff3;background:#221040}
.lk .card.lock{opacity:.55;border-style:dashed}
.lk .card .sw{display:block;width:100%;height:12px;border-radius:6px;margin:4px 0;border:2px solid #1a0a30}
.lk .lab{font:800 10px system-ui,sans-serif;color:#d4b0ff;letter-spacing:.06em}
.lk .card b{display:block;font-size:13px}.lk .card small{display:block;opacity:.9;font:12px system-ui,sans-serif}
.lk .goal{margin-top:6px;font:12px/1.35 system-ui,sans-serif;color:#ffb84a;text-align:center}
#close{position:sticky;top:0;float:right;width:44px;height:44px;border-radius:10px;border:2px solid #fff8;background:#0006;color:#fff;font:bold 18px sans-serif}
@media (max-width:540px){#actB{width:104px;height:104px}#menu{padding:10px 12px}.grid{flex-direction:column;align-items:stretch}.lv{min-width:0;width:100%;min-height:56px;font-size:16px}#menu h1{font-size:24px}}
</style></head><body>
<canvas id="c"></canvas>
<button class="btn" id="pause" aria-label="Pause">II</button>
<button class="btn" id="mute" aria-label="Sound">Sound</button>
<button class="btn" id="menuB" aria-label="Levels and Board">☰</button>
<button id="actB" type="button" aria-label="Play">PLAY</button>
<div id="hint">Build speed → Launch → Trick → Land</div>
<div id="live" aria-live="polite"></div>
<div id="resumeOv" role="dialog" aria-label="Paused"><button id="resumeB" type="button">RESUME</button></div>
<div id="menu" role="dialog" aria-label="Halfpipe Jam"></div>
<script>
(function(){
"use strict";
/* Halfpipe Jam — Batch A+ Ted feedback
   Family structure like BD/TP: levels, 5 lives, board locker, difficulty row.
   Variety = boards + weather (NOT obstacles). Skill core = pipe momentum / air / grabs / landings. */
// ---- knobs ----
var VH=360,CX=320,CY=248,PIPE_R=148,LIP=1.12;
var GRAVITY=2100,FRICTION=0.0018,PUMP_BOOST=0.42,MAX_OMEGA=3.55;
var LAUNCH_MUL=1.18,AIR_G=1680,MAX_AIR_H=118,SPIN_RATE=7.2;
var LAND_IDEAL=0.42,WIPE_ANGLE=1.55,TIMING_EARLY=-0.22,TIMING_LATE=0.28;
var LIVES_MAX=5,lives=LIVES_MAX,LIFE_PAUSE=1.25,STORY=10,COMBO_DECAY=2.8,SPAM_PEN=0.55;
var VERSION='0.2.0-batchA';

// Difficulty exposed like BD/TP Easy/Normal/Hard row — Halfpipe names Grom/Standard/Advanced
var DIFFS={
  grom:{id:'grom',name:'Grom',spd:0.88,win:1.45,land:1.55,wipe:1.35,wx:0.75,note:'forgiving windows'},
  standard:{id:'standard',name:'Standard',spd:1,win:1,land:1,wipe:1,wx:1,note:'balanced pipe'},
  advanced:{id:'advanced',name:'Advanced',spd:1.12,win:0.72,land:0.78,wipe:0.82,wx:1.2,note:'tight timing'}
};
// Weather = mountain conditions (readable). No obstacle hazards.
var WX={
  clear:{id:'clear',name:'Clear',sky:['#2a1458','#4a2880','#e8c8b0'],flake:0,vis:1,wind:0,fric:1,score:1,hint:'Bluebird'},
  flurry:{id:'flurry',name:'Light Snow',sky:['#241448','#3a2470','#c8b8d8'],flake:0.45,vis:0.92,wind:0.12,fric:1.05,score:1.05,hint:'Soft flakes'},
  haze:{id:'haze',name:'Haze',sky:['#2a1840','#4a3868','#b0a0c0'],flake:0.12,vis:0.62,wind:0,fric:1,score:1.1,hint:'Reduced vis — fair, not unfair'},
  sunset:{id:'sunset',name:'Sunset',sky:['#3a1450','#8a3860','#f0a060'],flake:0.05,vis:0.95,wind:0.05,fric:0.98,score:1.08,hint:'Warm light'},
  gust:{id:'gust',name:'Wind Gusts',sky:['#1a1848','#3a4880','#a8c0d8'],flake:0.2,vis:0.88,wind:0.55,fric:1.02,score:1.12,hint:'Air drift (visible)'},
  storm:{id:'storm',name:'Storm Light',sky:['#120828','#2a2050','#687090'],flake:0.7,vis:0.7,wind:0.35,fric:1.12,score:1.18,hint:'Heavy flake + friction'}
};
var LEVELS=[
  {n:1,name:'First Pipe',sub:'Clear · land 3 airs',wx:'clear',goal:{t:'airs',n:3},len:55},
  {n:2,name:'Soft Flurry',sub:'Light snow · score 700',wx:'flurry',goal:{t:'score',n:700},len:60},
  {n:3,name:'Grab Glow',sub:'Sunset · land a grab',wx:'sunset',goal:{t:'grabs',n:1},len:60},
  {n:4,name:'Spin Ridge',sub:'Clear · land 180+',wx:'clear',goal:{t:'spins',n:1},len:65},
  {n:5,name:'Haze Bowl',sub:'Haze · 3 clean streak',wx:'haze',goal:{t:'streak',n:3},len:70},
  {n:6,name:'Gust Line',sub:'Wind · score 1100',wx:'gust',goal:{t:'score',n:1100},len:70},
  {n:7,name:'Flow Dusk',sub:'Sunset · 5 airs',wx:'sunset',goal:{t:'airs',n:5},len:75},
  {n:8,name:'Storm Warmup',sub:'Storm light · grab+180',wx:'storm',goal:{t:'comboish',n:1},len:75},
  {n:9,name:'Full Pipe',sub:'Gust · streak 4',wx:'gust',goal:{t:'streak',n:4},len:80},
  {n:10,name:'Summit Jam',sub:'Storm · score 1800',wx:'storm',goal:{t:'score',n:1800},len:90}
];
var ENDLESS={n:11,name:'Endless',sub:'Rotating weather · high score',wx:'clear',goal:{t:'score',n:999999},len:Infinity,endless:true};
// Board locker ladder — speed / amplitude / window / forgiveness (like BD spd ladder)
var BOARDS=[
  {id:'grom',name:'Grom Deck',c:'#e85a2a',s:'#ffe8d0',spd:1.00,amp:1.00,win:1.15,land:1.20,need:0,how:'Starter'},
  {id:'carve',name:'Carve Cream',c:'#c9a0ff',s:'#f7f4fb',spd:1.12,amp:1.08,win:1.05,land:1.08,need:2,how:'Clear 2 pipes'},
  {id:'lip',name:'Lip Amber',c:'#ffb84a',s:'#fff4e0',spd:1.24,amp:1.16,win:1.00,land:1.00,need:4,how:'Clear 4 pipes'},
  {id:'gust',name:'Gust Steel',c:'#8a94a4',s:'#e8eef8',spd:1.38,amp:1.24,win:0.92,land:0.95,need:7,how:'Clear 7 pipes'},
  {id:'pro',name:'Pro Pipe',c:'#ff2d55',s:'#ffd84a',spd:1.55,amp:1.35,win:0.85,land:0.88,need:10,how:'Clear all 10'}
];
var TRICKS={straight:{name:'Straight Air',base:80},indy:{name:'Indy',base:140,grab:1},method:{name:'Method',base:160,grab:1},fs180:{name:'FS 180',base:180},bs180:{name:'BS 180',base:180},full360:{name:'360',base:260},combo:{name:'Combo',base:320,grab:1}};

var PK='halfpipeJam.progress',PR;try{PR=JSON.parse(localStorage.getItem(PK))}catch(e){}
PR=PR||{};PR.done=PR.done||[];PR.best=PR.best||{};PR.board=PR.board||'grom';PR.diff=PR.diff||'standard';
// migrate old challenge-only keys harmlessly
if(PR.diff==='easy')PR.diff='grom';if(PR.diff==='normal')PR.diff='standard';if(PR.diff==='hard')PR.diff='advanced';
function saveP(){try{localStorage.setItem(PK,JSON.stringify(PR))}catch(e){}}
var LS='halfpipeJam.pb',pb=+(localStorage.getItem(LS)||0);
var muted=localStorage.getItem('halfpipeJam.mute')==='1';
var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var cv=document.getElementById('c'),cx=cv.getContext('2d');
var W=640,scale=1,OY=0,worldH=360,FIT_H=420;
var actB=document.getElementById('actB'),hint=document.getElementById('hint');
var menu=document.getElementById('menu'),resumeOv=document.getElementById('resumeOv'),live=document.getElementById('live');
var S,LV=LEVELS[0],paused=false,holding=false,holdT=0,menuOpen=false,overAt=0,AC=null,lastBeep=0;

function diffM(){return DIFFS[PR.diff]||DIFFS.standard;}
function wx(){return WX[LV.wx]||WX.clear;}
function clearedN(){return PR.done.filter(function(n){return n>=1&&n<=STORY}).length;}
function unlocked(n){return n===1||PR.done.indexOf(n-1)>=0||(n===ENDLESS.n&&endlessOpen());}
function endlessOpen(){for(var i=1;i<=STORY;i++)if(PR.done.indexOf(i)<0)return false;return true;}
function boardOpen(b){return !b.need||clearedN()>=b.need;}
function board(){var b=BOARDS.filter(function(x){return x.id===PR.board&&boardOpen(x)})[0];return b||BOARDS[0];}
function boardSpd(){return board().spd||1;}
function boardPct(b){return Math.round(((b&&b.spd)||boardSpd())*100);}
function boardTag(b){return 'SPD '+boardPct(b)+'%';}
function boardNext(){var c=board();for(var i=0;i<BOARDS.length-1;i++)if(BOARDS[i].id===c.id)return BOARDS[i+1];return null;}
function boardSw(b,lock){return '<span class="sw" style="background:'+(lock?'#333':'linear-gradient('+b.c+' 0 55%,'+b.s+' 55% 75%,'+b.c+' 75%)')+'"></span>';}
function boardPanelHTML(){
  var cur=board(),nx=boardNext(),h='<div class="lk"><div class="lkrow"><div class="card"><span class="lab">NOW</span>'+boardSw(cur,0)+'<b>'+cur.name+'</b><small>'+boardTag(cur)+' · amp ×'+cur.amp.toFixed(2)+' · win ×'+cur.win.toFixed(2)+'</small></div>';
  if(nx){var o=boardOpen(nx),d=boardPct(nx)-boardPct(cur);
    h+='<div class="card'+(o?'':' lock')+'"><span class="lab">NEXT</span>'+boardSw(nx,!o)+'<b>'+(o?'':'🔒 ')+nx.name+'</b><small>'+boardTag(nx)+(d?' · +'+d:'')+' · amp ×'+nx.amp.toFixed(2)+'</small></div></div>';
    h+='<div class="goal"><b>GOAL</b> '+nx.how+' → <b>REWARD</b> '+boardTag(nx)+(d?' (+'+d+'% speed)':'')+' · wider amp / tuned windows</div>';}
  else h+='</div><div class="goal">Max board · Pro Pipe peaks the ladder</div>';
  return h+'</div>';
}
function livesStr(){var s='',i=0;for(;i<LIVES_MAX;i++)s+=i<lives?'♥':'♡';return s;}
function announce(t){live.textContent=t;}
function beep(f,d,type,g){
  if(muted)return;var now=performance.now();if(now-lastBeep<18)return;lastBeep=now;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    var o=AC.createOscillator(),v=AC.createGain();o.type=type||'square';o.frequency.value=f;v.gain.value=g||0.08;
    o.connect(v);v.connect(AC.destination);o.start();v.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+(d||0.06));o.stop(AC.currentTime+(d||0.06)+0.02);
  }catch(e){}
}
function puff(x,y,n,c,v){for(var i=0;i<n;i++)S.parts.push({x:x,y:y,vx:(Math.random()-.5)*2*v,vy:-Math.random()*v,l:0.35+Math.random()*0.35,c:c,s:2+Math.random()*2.5});}
function pipePoint(th){var a=th/LIP*(Math.PI/2);return {x:CX+Math.sin(a)*PIPE_R,y:CY+Math.cos(a)*PIPE_R,a:a};}
function lipY(){return pipePoint(LIP).y;}
function mulWin(){return diffM().win*board().win*(wx().vis>0.8?1:1.05);} // slight forgiveness in haze (fair)
function mulLand(){return diffM().land*board().land;}
function mulSpd(){return diffM().spd*boardSpd();}
function mulAmp(){return board().amp*(2-wx().fric*0.35);}

function goalLabel(g){
  if(!g)return '';
  if(g.t==='airs')return 'Land '+g.n+' airs';
  if(g.t==='score')return 'Score '+g.n;
  if(g.t==='grabs')return 'Land '+g.n+' grab'+(g.n>1?'s':'');
  if(g.t==='spins')return 'Land '+g.n+'× 180+';
  if(g.t==='streak')return 'Clean streak ×'+g.n;
  if(g.t==='comboish')return 'Grab + 180 in one air';
  return 'Jam';
}
function goalProg(){
  var g=LV.goal;if(!g)return {ok:false,txt:''};
  if(g.t==='airs')return {ok:S.airs>=g.n,txt:S.airs+'/'+g.n+' airs'};
  if(g.t==='score')return {ok:S.score>=g.n,txt:S.score+'/'+g.n};
  if(g.t==='grabs')return {ok:S.grabsLanded>=g.n,txt:S.grabsLanded+'/'+g.n+' grabs'};
  if(g.t==='spins')return {ok:S.spinsLanded>=g.n,txt:S.spinsLanded+'/'+g.n+' spins'};
  if(g.t==='streak')return {ok:S.bestStreak>=g.n,txt:'best ×'+S.bestStreak+' / '+g.n};
  if(g.t==='comboish')return {ok:S.comboish>=g.n,txt:S.comboish?'done':'grab+180'};
  return {ok:false,txt:''};
}

function reset(lv){
  if(lv)LV=lv;
  if(LV.endless){var keys=Object.keys(WX);LV={n:11,name:'Endless',sub:'Weather rotates',wx:keys[Math.floor(Math.random()*keys.length)],goal:{t:'score',n:999999},len:Infinity,endless:true};}
  var w=wx();
  S={mode:'ready',t:0,left:isFinite(LV.len)?LV.len:9999,score:0,combo:0,streak:0,bestStreak:0,
    airs:0,grabsLanded:0,spinsLanded:0,comboish:0,variety:{},lastTrick:null,spam:0,flow:1,
    th:0,om:0.55*mulSpd(),dir:1,onPipe:true,x:CX,y:CY+PIPE_R,vx:0,vy:0,spin:0,boardA:0,
    grab:null,airH:0,peakH:0,timing:'',timingT:0,fb:'',fbT:0,fbCol:'#ffb84a',
    parts:[],pops:[],flakes:[],shake:0,done:false,cleared:false,gameOver:false,autoRetry:false,
    heartFlashT:0,lostHeart:-1,holdSpin:0,windPhase:0,achToast:'',achT:0};
  for(var i=0;i<110;i++)S.flakes.push({x:Math.random()*800,y:Math.random()*VH,r:1.2+Math.random()*2.6,z:Math.random(),vx:(Math.random()-.5)*18});
  var p=pipePoint(S.th);S.x=p.x;S.y=p.y;
}

function setModeUI(){
  document.getElementById('mute').textContent=muted?'Muted':'Sound';
  if(S.mode==='ready'){actB.textContent='PLAY';actB.className='';hint.style.display='block';hint.textContent=LV.name+' · '+wx().name+' · '+goalLabel(LV.goal)+' · '+livesStr();}
  else if(S.mode==='play'){
    actB.className=S.onPipe?'':'mode-air';
    actB.textContent=S.onPipe?(nearLip()?'LAUNCH':'PUMP'):(holding?'SPIN':'GRAB');
    hint.style.display=S.t<3.5?'block':'none';
    if(S.t<3.5)hint.textContent=wx().hint+' · tap lip · hold spin · release land';
  }else if(S.mode==='clear'){actB.textContent=LV.n<STORY?'NEXT':'MENU';actB.className='mode-next';hint.style.display='block';hint.textContent='CLEAR · '+S.score+' · '+livesStr();}
  else if(S.mode==='over'){actB.textContent=S.gameOver?'RETRY L1':'RETRY';actB.className='mode-retry';hint.style.display='block';hint.textContent=(S.gameOver?'Out of lives':'Wipeout')+' · '+livesStr();}
}

function nearLip(){
  if(!S.onPipe)return false;
  return Math.abs(S.th)>0.72;
}
function lipTiming(){
  var crest=S.dir>0?LIP:-LIP,err=S.th-crest;if(S.dir<0)err=-err;
  var w=mulWin();
  if(err<TIMING_EARLY*w)return 'early';
  if(err>TIMING_LATE*w)return 'late';
  return 'ideal';
}

function startPlay(){
  if(S.mode==='over'){
    if(S.gameOver){lives=LIVES_MAX;startLevel(1);S.mode='play';announce('New run · '+livesStr());}
    else{S.autoRetry=false;S.heartFlashT=0;reset(LV);S.mode='play';announce('Retry · '+lives+' left');}
    setModeUI();return;
  }
  if(S.mode==='clear'){
    if(LV.n<STORY)startLevel(LV.n+1,{keepLives:true});
    else{openMenu();}
    return;
  }
  if(S.mode==='ready'){S.mode='play';S.t=0;beep(520,0.05,'square',0.08);setModeUI();announce(LV.name);}
}

function onPress(){
  if(menuOpen||paused)return;
  if(S.mode!=='play'){startPlay();return;}
  holding=true;holdT=0;
  if(S.onPipe){
    if(nearLip()&&Math.abs(S.om)>0.55){var tm=lipTiming();S.timing=tm;S.timingT=0.85;launch(tm);}
    else{
      var pump=PUMP_BOOST*mulAmp()*(Math.abs(S.th)<0.55?1.15:0.65);
      S.om+=S.dir*pump;S.om=Math.max(-MAX_OMEGA,Math.min(MAX_OMEGA,S.om));
      S.fb='PUMP';S.fbT=0.3;S.fbCol='#c9a0ff';beep(240+Math.abs(S.om)*40,0.04,'square',0.06);
      if(!reduceMotion)puff(S.x,S.y+4,4,'#ffffff',70);
    }
  }else if(!S.grab){S.grab=S.holdSpin>0.35?'method':'indy';}
}
function onRelease(){
  if(!holding)return;var held=holdT;holding=false;if(S.mode!=='play')return;
  if(!S.onPipe){
    if(held>=0.22){/* spin charge */}
    else if(!S.grab){S.grab='indy';S.fb='INDY';S.fbT=0.4;S.fbCol='#ffb84a';beep(880,0.04,'triangle',0.07);}
    var twopi=Math.PI*2,rem=((S.spin%twopi)+twopi)%twopi,target=rem<Math.PI?0:twopi;
    if(Math.abs(rem-Math.PI)>=0.9)S.spin+=(target-rem)*0.35;
    S.fb=S.fb||'PREP';S.fbT=Math.max(S.fbT,0.3);S.fbCol='#3ecf9a';
  }
}
function launch(tm){
  var speed=Math.abs(S.om),mul=tm==='ideal'?LAUNCH_MUL:(tm==='early'?0.92:0.78);
  var hBoost=tm==='ideal'?1.12:(tm==='early'?0.95:0.72),p=pipePoint(S.th),a=p.a,tang=S.dir>0?1:-1;

function classifyTrick(){

function scoreLanding(quality,trickId,height,rot){
  var tr=TRICKS[trickId]||TRICKS.straight;
  var qMul=quality==='clean'?1.2:(quality==='ok'?0.85:0.45);
  var hMul=1+Math.min(1.2,height/MAX_AIR_H)*0.85,rMul=1+Math.min(2,rot/Math.PI)*0.35;
  var varMul=1;if(S.variety[trickId]){S.spam++;varMul=Math.max(0.35,1-S.spam*SPAM_PEN*0.25);}else{S.variety[trickId]=1;S.spam=Math.max(0,S.spam-1);varMul=1.25;}
  if(S.lastTrick===trickId)varMul*=0.7;S.lastTrick=trickId;
  var pts=Math.round(tr.base*qMul*hMul*rMul*varMul*(1+Math.min(5,S.streak)*0.12)*(0.85+Math.min(0.4,S.flow*0.08))*wx().score);
  S.score+=pts;S.flow=Math.min(8,S.flow+0.35);
  S.pops.push({x:S.x,y:S.y-40,l:0.9,txt:'+'+pts+' '+tr.name,c:'#ffb84a'});
  if(quality==='clean'){S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);}
  else if(quality==='bail'){S.streak=0;S.flow=1;}else S.streak=Math.max(0,S.streak-1);

function step(dt){
  if(S.mode==='over'&&S.heartFlashT>0)S.heartFlashT=Math.max(0,S.heartFlashT-dt);
  if(S.mode==='over'&&S.autoRetry&&!S.gameOver&&performance.now()-overAt>=LIFE_PAUSE*1000){
    S.autoRetry=false;S.heartFlashT=0;reset(LV);S.mode='play';announce('Retry · '+lives+' left');setModeUI();
  }
  if(S.mode!=='play')return;
  var d=diffM(),w=wx();
  S.t+=dt;if(isFinite(LV.len))S.left=Math.max(0,LV.len-S.t);
  if(isFinite(LV.len)&&S.left<=0&&!S.cleared){ // time out = soft fail life
    S.fb='TIME';S.fbCol='#ffb84a';wipeout();return;
  }
  S.timingT=Math.max(0,S.timingT-dt);S.fbT=Math.max(0,S.fbT-dt);S.achT=Math.max(0,S.achT-dt);
  S.shake*=reduceMotion?0:0.85;S.flow=Math.max(1,S.flow-dt/COMBO_DECAY*0.15);S.windPhase+=dt*(0.8+w.wind);
  if(holding)holdT+=dt;
  for(var q=S.parts.length-1;q>=0;q--){var P=S.parts[q];P.x+=P.vx*dt;P.y+=P.vy*dt;P.vy+=500*dt;P.l-=dt;if(P.l<=0)S.parts.splice(q,1);}
  for(var k=S.pops.length-1;k>=0;k--){S.pops[k].l-=dt;S.pops[k].y-=28*dt;if(S.pops[k].l<=0)S.pops.splice(k,1);}
  // weather flakes
  var nf=Math.floor(18+70*w.flake*d.wx);
  for(var fi=0;fi<nf;fi++){var f=S.flakes[fi];if(!f)continue;f.x+=f.vx*dt+w.wind*55*dt;f.y+=(30+f.z*50+w.flake*40)*dt;if(f.y>worldH||f.x<-20||f.x>W+20){f.y=-4;f.x=Math.random()*W;}}

  if(S.onPipe){
    var a=S.th/LIP*(Math.PI/2);

    S.om*=(1-FRICTION*w.fric*60*dt);

    S.th+=S.om*dt;
    if(S.th>LIP){S.th=LIP;S.om=Math.min(S.om,-Math.abs(S.om)*0.92);S.dir=-1;}
    if(S.th<-LIP){S.th=-LIP;S.om=Math.max(S.om,Math.abs(S.om)*0.92);S.dir=1;}
    if(Math.abs(S.om)>0.25)S.dir=S.om>0?1:-1;

    if(holding){S.holdSpin+=dt;S.spin+=SPIN_RATE*d.spd*dt*(S.dir||1);if(holdT>0.45)S.grab='method';}

  LEVELS.concat([ENDLESS]).forEach(function(L){
    var u=unlocked(L.n)||(L.endless&&endlessOpen()),d=PR.done.indexOf(L.n)>=0,ww=WX[L.wx]||WX.clear;
    h+='<button class="lv'+(d?' done':'')+'" data-l="'+L.n+'"'+(u?'':' disabled')+'><b class="n">'+(u?(d?'✓':(L.endless?'∞':L.n)):'🔒')+'</b><span class="t">'+(L.endless?'Endless':L.n+'. '+L.name)+'<small>'+(u?(L.endless?'Rotating weather · high score':(ww.name+' · '+goalLabel(L.goal)+(PR.best[L.n]?' · Best '+PR.best[L.n]:''))):(L.endless?'Clear 1–'+STORY:'Clear L'+(L.n-1)))+'</small></span></button>';
  });
  h+='</div><h2>Equip board</h2><div class="boards">';
  BOARDS.forEach(function(b){var o=boardOpen(b);h+='<button class="bd'+(PR.board===b.id?' sel':'')+'" data-b="'+b.id+'"'+(o?'':' disabled')+'>'+boardSw(b,!o)+'<span class="t">'+(o?'':'🔒 ')+b.name+'<small>'+boardTag(b)+' · amp ×'+b.amp.toFixed(2)+(o?'':' · '+b.how)+'</small></span></button>';});
  h+='</div><p style="opacity:.7;font-size:12px;margin:14px 0">PB '+pb+' · Offline · prefers-reduced-motion '+(reduceMotion?'ON':'off')+'</p>';
  h+='<button id="resetP" style="min-height:44px;padding:8px 14px;border-radius:10px;border:2px solid #fff5;background:#5a1d1d;color:#fff;font:bold 13px system-ui,sans-serif">Reset progress</button>';
  menu.innerHTML=h;menu.style.display='block';
  document.getElementById('close').onclick=closeMenu;
  document.getElementById('resetP').onclick=function(){if(!confirm('Reset Halfpipe progress?'))return;var keep=PR.diff;PR={done:[],best:{},board:'grom',diff:keep};saveP();pb=0;try{localStorage.removeItem(LS)}catch(e){}lives=LIVES_MAX;openMenu();};
  menu.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){PR.diff=b.getAttribute('data-d');saveP();openMenu();announce('Difficulty '+diffM().name);};});
  menu.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){if(b.disabled)return;startLevel(+b.getAttribute('data-l'));};});
  menu.querySelectorAll('[data-b]').forEach(function(b){b.onclick=function(){if(b.disabled)return;PR.board=b.getAttribute('data-b');saveP();openMenu();};});
}
function closeMenu(){menu.style.display='none';menuOpen=false;paused=false;if(S.mode==='pause'||S.mode==='menu')S.mode='ready';setModeUI();}

actB.addEventListener('pointerdown',function(e){e.preventDefault();onPress();});
actB.addEventListener('pointerup',function(e){e.preventDefault();onRelease();});
actB.addEventListener('pointercancel',onRelease);
cv.addEventListener('pointerdown',function(e){if(menuOpen)return;e.preventDefault();onPress();});
cv.addEventListener('pointerup',function(e){e.preventDefault();onRelease();});
window.addEventListener('keydown',function(e){if(e.repeat)return;if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();onPress();}if(e.code==='KeyP')togglePause();if(e.code==='KeyM')toggleMute();if(e.code==='Escape'){if(menuOpen)closeMenu();else openMenu();}});
window.addEventListener('keyup',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();onRelease();}});
function togglePause(){if(menuOpen||S.mode!=='play')return;paused=!paused;resumeOv.style.display=paused?'flex':'none';}
function toggleMute(){muted=!muted;try{localStorage.setItem('halfpipeJam.mute',muted?'1':'0')}catch(e){}setModeUI();}
document.getElementById('pause').onclick=togglePause;
document.getElementById('resumeB').onclick=function(){paused=false;resumeOv.style.display='none';};
document.getElementById('mute').onclick=toggleMute;
document.getElementById('menuB').onclick=function(){if(menuOpen)closeMenu();else openMenu();};

var last=0,acc=0;
function loop(ts){if(!last)last=ts;var dt=Math.min(0.05,(ts-last)/1000);last=ts;
  if(!paused&&!menuOpen){acc+=dt;while(acc>1/120){step(1/120);acc-=1/120;}}
  frame();requestAnimationFrame(loop);
}
window.addEventListener('resize',resize);resize();reset(LEVELS[0]);setModeUI();requestAnimationFrame(loop);
announce('Halfpipe Jam v'+VERSION+' · '+livesStr());
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js?v=0-2-0',{scope:'./'}).then(function(reg){if(reg.update)reg.update();}).catch(function(){});
}
window.__HPJ={getS:function(){return S;},reset:function(n){reset(n?LEVELS[n-1]:LV);},start:startPlay,launch:launch,startLevel:startLevel,openMenu:openMenu,VERSION:VERSION,DIFFS:DIFFS,BOARDS:BOARDS,LEVELS:LEVELS,WX:WX};
})();
</script>
