<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0c3a42"><title>Terrain Park</title>
<style>
html,body{margin:0;height:100%;background:#0c3a42;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh}
.btn{position:fixed;top:10px;width:44px;height:44px;border-radius:10px;border:2px solid #fff8;background:#0006;color:#fff;font:bold 16px system-ui,sans-serif;z-index:2}
#pause{right:10px}#mute{right:62px}#menuB{right:114px}
#jumpB{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:2;width:92px;height:92px;border-radius:50%;border:4px solid #fff;font:800 20px/1.05 system-ui,sans-serif;letter-spacing:.04em;display:none;align-items:center;justify-content:center;text-align:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:0;transition:background .12s,color .12s,box-shadow .12s,transform .12s}
#jumpB.mode-play{background:#2bd17e;color:#0b1830;box-shadow:0 6px 0 #146b3f,0 10px 24px #0008}
#jumpB.mode-jump{background:#ff2d55;color:#fff;box-shadow:0 6px 0 #8b1028,0 10px 24px #0008;font-size:22px}
#jumpB.mode-retry,#jumpB.mode-next{background:#ffd84a;color:#14213d;box-shadow:0 6px 0 #9a7a10,0 10px 24px #0008;font-size:18px}
#jumpB.pop{animation:btnPop .35s ease-out}
@keyframes btnPop{0%{transform:scale(.86)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#jumpB.pop{animation:none}}
#jumpB:active{transform:scale(.92)}
#hint{position:fixed;left:50%;bottom:max(122px,calc(env(safe-area-inset-bottom)+114px));transform:translateX(-50%);z-index:2;background:#000c;color:#fff;border:2px solid #ffd84a;border-radius:12px;padding:10px 14px;font:bold 15px system-ui,sans-serif;pointer-events:none;display:none;white-space:nowrap;box-shadow:0 4px 16px #0008}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
#resumeOv{position:fixed;inset:0;z-index:4;background:#062e34d8;display:none;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
#resumeB{width:min(420px,100%);min-height:88px;border-radius:18px;border:4px solid #fff;background:#2bd17e;color:#0b1830;font:800 28px/1.1 system-ui,sans-serif;letter-spacing:.06em;box-shadow:0 8px 0 #146b3f,0 14px 32px #000a;touch-action:manipulation}
#resumeB:active{transform:scale(.96)}
#menu{position:fixed;inset:0;z-index:3;background:#062e34ee;color:#fff;font:15px sans-serif;overflow:auto;display:none;padding:14px;box-sizing:border-box;text-align:center}
#menu h1{margin:4px 0 2px;font-size:26px;letter-spacing:1px}#menu h2{font-size:15px;margin:14px 0 6px;color:#7fe0d0}
.grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:720px;margin:0 auto}
.lv,.bd{min-width:150px;min-height:48px;border-radius:10px;border:2px solid #fff5;background:#14505a;color:#fff;font:bold 14px sans-serif;padding:6px 8px}
.lv[disabled],.bd[disabled]{opacity:.4}.lv.done{border-color:#3ecf9a}.bd.sel{border-color:#ffb84a;background:#3a2a14}
.lv small,.bd small{display:block;font-weight:normal;font-size:12px;opacity:.9;margin-top:2px}
.lv{text-align:left;display:flex;align-items:center;gap:10px}.lv b.n{flex:none;width:34px;height:34px;border-radius:50%;background:#062e34;display:flex;align-items:center;justify-content:center;font-size:16px}
.lv.done b.n{background:#3ecf9a;color:#062e34}.lv span.t{flex:1}
.bd{display:flex;align-items:center;gap:10px;text-align:left}
.boards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:720px;margin:0 auto}
.boards .bd{min-width:0;min-height:40px;padding:4px 8px;font-size:12px}
.leg{max-width:640px;margin:8px auto;text-align:left;background:#0a353ccc;border:1px solid #fff2;border-radius:12px;padding:10px 12px;font:13px/1.45 sans-serif}
.leg b{color:#ffb84a}.leg .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.leg .chip{background:#14505a;border:1px solid #fff3;border-radius:8px;padding:4px 8px;font-size:12px}
#close{position:sticky;top:0;float:right;width:44px;height:44px;border-radius:10px;border:2px solid #fff8;background:#0006;color:#fff;font:bold 18px sans-serif}
@media (max-width:540px){#menu{padding:10px 12px}.grid{flex-direction:column;align-items:stretch}.lv{min-width:0;width:100%;min-height:56px;font-size:16px}#menu h1{font-size:24px;margin-top:10px}#jumpB{width:100px;height:100px}}
</style></head><body>
<canvas id="c"></canvas>

<script>
(function(){
"use strict";

 box:{w:110,h:14,ride:1,grind:1,s:'S',lab:'Flat box'},
 rail:{w:96,h:22,ride:0,grind:1,s:'S',lab:'Down rail'},
 rainbow:{w:130,h:36,ride:0,grind:1,arch:28,s:'M',lab:'Rainbow box'},

 gap:{w:0,h:0,terr:1,ap:38,gap:78,ex:52,amp:28,s:'L',lab:'Gap jump'},

var LEVELS=[
 {n:1,name:'Box Park',sub:'Ride-on boxes · first ramps',pool:['box','box','kicker','roller'],base:300,ramp:2.5,max:380,len:5200,gapX:1.18,pick:.32,dense:0.92},

 {n:3,name:'Rainbow Run',sub:'Arched jibs + ramps',pool:['box','rail','rainbow','kicker','kicker'],base:350,ramp:4,max:480,len:7600,gapX:1.0,pick:.36,dense:0.86},
 {n:4,name:'Table Session',sub:'Ramp → tabletop lips',pool:['kicker','table','table','rail','box'],base:370,ramp:5,max:530,len:9000,gapX:.92,pick:.4,dense:0.8},
 {n:5,name:'Gap Commit',sub:'Ramp → gap · miss=fall',pool:['kicker','table','gap','gap','rail'],base:390,ramp:5.5,max:580,len:10200,gapX:.86,pick:.42,dense:0.74},
 {n:6,name:'Hip Line',sub:'Dense hips + kickers',pool:['kicker','table','gap','hip','hip','rail'],base:410,ramp:6,max:620,len:11400,gapX:.8,pick:.44,dense:0.7},
 {n:7,name:'Transition',sub:'QP wallrides · packed line',pool:['kicker','hip','qp','qp','table','gap'],base:430,ramp:7,max:680,len:12600,gapX:.74,pick:.48,dense:0.66},
 {n:8,name:'Full Park',sub:'S→M→L everything denser',pool:['box','rail','rainbow','kicker','table','gap','hip','qp'],base:450,ramp:8,max:740,len:14000,gapX:.68,pick:.52,dense:0.62},
 {n:9,name:'Pro Line',sub:'Late spice · no mercy gaps',pool:['kicker','table','gap','hip','qp','rainbow','rail'],base:470,ramp:9,max:800,len:15500,gapX:.62,pick:.55,dense:0.58}
];
var ENDLESS={n:10,name:'Endless',sub:'Full park forever',pool:LEVELS[8].pool,base:360,ramp:10,max:860,len:Infinity,gapX:.6,pick:.55,dense:0.55,endless:true};
var PK='terrainPark.progress',PR;try{PR=JSON.parse(localStorage.getItem(PK))}catch(e){}

function saveP(){try{localStorage.setItem(PK,JSON.stringify(PR))}catch(e){}}
function unlocked(n){return n===1||PR.done.indexOf(n-1)>=0||(n===10&&endlessOpen())}
function endlessOpen(){for(var i=1;i<=9;i++)if(PR.done.indexOf(i)<0)return false;return true}
function diffM(){return DIFFS[PR.diff]||DIFFS.normal;}
function levelSpd(){return Math.min(SPD_CAP,SPD_BASE+Math.floor((LV.n-1)/2)*SPD_PER_2LV);}
function runSpd(){return levelSpd()*diffM().spd*((S&&S.boostT>0)?COMBO_BOOST:1)*((S&&S.landBad>0)?0.93:1);}
var LV=LEVELS[0];
var cv=document.getElementById('c'),cx=cv.getContext('2d'),W=640,scale=1,OY=0,worldH=VH;
var LS='terrainPark.pb', pb=+(localStorage.getItem(LS)||0);
var muted=localStorage.getItem('terrainPark.mute')==='1';
var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var S;
function mk(s){return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
var rng,rngP,rngB,TER;function seed(s){rng=mk(s);rngP=mk((s^0x85ebca6b)>>>0);rngB=mk((s^0xc2b2ae35)>>>0);

var HILL=[0,10,12,14,16,18,20,22,24,26,26];
function terr(wx){var A=HILL[LV.n]||10;return A*(0.55*Math.sin(wx/420+TER[0])+0.3*Math.sin(wx/190+TER[1])+0.15*Math.sin(wx/96+TER[2]));}

function featH(wx){if(!S||!S.feats)return 0;var h=0;
 for(var i=0;i<S.feats.length;i++){var f=S.feats[i],d=FEAT[f.k];if(!d||!d.terr)continue;
  var dx=wx-f.wx;
  if(f.k==='table'||f.k==='roller'||f.k==='kicker'){var ap=f.ap,dk=f.dk,ex=f.ex,a=f.amp,L=-(ap+dk),R=dk+ex;
   if(dx<=L||dx>=R)continue;var flat=terr(f.wx)-a-terr(wx);
   if(dx<-dk){var t=(dx-L)/ap,e=terr(f.wx)-a-terr(f.wx-dk);h+=e*t;}
   else if(dx<=dk)h+=flat;
   else{var u=1-(dx-dk)/ex,e2=terr(f.wx)-a-terr(f.wx+dk);h+=e2*u;}}
  else if(f.k==='gap'){var apg=f.ap,gw=f.gap,exg=f.ex,ag=f.amp,Lg=-(apg),Rg=gw+exg;
   if(dx<=Lg||dx>=Rg)continue;
   if(dx<0){var tg=(dx-Lg)/apg;h+=(terr(f.wx)-ag-terr(wx))*tg;} // takeoff climb to lip
   else if(dx<gw){h+=90;} // pit under gap (visual + fall if riding through)
   else{var ug=1-(dx-gw)/exg;h+=(terr(f.wx+gw)-ag*0.4-terr(wx))*ug;}} // landing catch
  else if(f.k==='hip'){var aph=f.ap,dkh=f.dk,exh=f.ex,ah=f.amp,Lh=-(aph+dkh),Rh=dkh+exh;
   if(dx<=Lh||dx>=Rh)continue;
   if(dx<-dkh){var th=(dx-Lh)/aph;h+=(terr(f.wx)-ah-terr(wx))*th;}
   else if(dx<=dkh)h+=terr(f.wx)-ah-terr(wx);
   else{var uh=(dx-dkh)/exh;h+=(terr(f.wx)-ah*(1-uh*0.55)-terr(wx))*(1-uh*0.15);}}
  else if(f.k==='qp'){var r=f.r;if(dx<-4||dx>r+8)continue;
   if(dx<=r){var ang=Math.max(0,Math.min(1,dx/r));h+=terr(f.wx)-r*(1-Math.cos(ang*Math.PI/2))-terr(wx);}
   else h+=terr(f.wx)-r-terr(wx);}}

function H(sx){var wx=S.dist+sx-S.p.x;return terr(wx)+featH(wx);}
function gY(sx){return GROUND+H(sx);}
function slopeAt(sx){return Math.atan2(H(sx+6)-H(sx-6),12);}
function inGap(sx){if(!S||!S.feats)return false;var wx=S.dist+sx-S.p.x;
 for(var i=0;i<S.feats.length;i++){var f=S.feats[i];if(f.k!=='gap')continue;var dx=wx-f.wx;if(dx>2&&dx<f.gap-2)return true;}
 return false;}
function grindAt(sx){if(!S||!S.feats)return null;var wx=S.dist+sx-S.p.x,best=null,by=1e9;
 for(var i=0;i<S.feats.length;i++){var f=S.feats[i],d=FEAT[f.k];if(!d||!d.grind)continue;
  var x0=f.wx-f.w/2,x1=f.wx+f.w/2;if(wx<x0-2||wx>x1+2)continue;
  var t=(wx-x0)/Math.max(1,f.w),gy;
  if(f.k==='rainbow'){var arch=f.arch||d.arch;gy=gY(sx)-(f.h||d.h)-Math.sin(t*Math.PI)*arch;}
  else if(f.k==='rail'){gy=gY(sx)-(f.h||d.h)-(t*f.down||0);}
  else gy=gY(sx)-(f.h||d.h);
  if(gy<by){by=gy;best={f:f,y:gy,ride:!!d.ride};}}

function lipNear(){if(!S||!S.feats)return null;var p=S.p;
 for(var i=0;i<S.feats.length;i++){var f=S.feats[i],d=FEAT[f.k];if(!d||!d.terr||f.k==='roller')continue;
  var lipX=f.wx-(f.dk||0);
  if(f.k==='gap'||f.k==='kicker')lipX=f.wx+(f.k==='kicker'?f.dk:0);
  if(f.k==='qp')lipX=f.wx+f.r;

  if(dx>-18&&dx<30)return f;}

function score(){return Math.floor(S.dist/12)+S.grindPts+S.lipPts+S.flipPts+S.starPts+S.comboPts;}
function starsFor(sc,len){if(!isFinite(len))return sc>8000?3:sc>4000?2:sc>1500?1:0;var r=sc/(len/12+200);
 return r>1.35?3:r>0.95?2:r>0.55?1:0;}
function reset(sd,lv){if(lv)LV=lv;seed(sd==null?(LV.endless?(Date.now()>>>0):2000+LV.n):sd);
 var gy0=GROUND+terr(0),m0=levelSpd()*diffM().spd;
 S={feats:[],parts:[],pops:[],flakes:[],pickups:[],pickT:1.8,stars:0,starPts:0,grindPts:0,lipPts:0,flipPts:0,comboPts:0,combo:0,boostT:0,grindT:0,grindOn:null,lipHit:{},flash:0,land:0,landBad:0,hop:0,climbVy:0,mode:'ready',t:0,dist:0,spd:LV.base*m0,p:{x:110,y:gy0,vy:0,on:true},nextX:780,shake:0,done:false,flip:0,holding:false,lastTap:0,playAt:0};
 for(var i=0;i<120;i++)S.flakes.push({x:Math.random()*1000,y:Math.random()*VH,r:1.2+Math.random()*2.4,z:Math.random(),vx:(Math.random()-.5)*16});}
function mkFeat(k,wx){var d=FEAT[k],f={k:k,wx:wx,hit:false,lip:false};
 if(d.grind){f.w=d.w*(0.92+rngB()*0.14);f.h=d.h;if(k==='rainbow')f.arch=d.arch*(0.9+rngB()*0.15);if(k==='rail')f.down=6+rngB()*10;}
 if(d.terr){f.ap=(d.ap||0)*(0.94+rngB()*0.1);f.dk=(d.dk||0)*(0.94+rngB()*0.1);f.ex=(d.ex||0)*(0.94+rngB()*0.1);f.amp=(d.amp||0)*(0.92+rngB()*0.12);f.gap=(d.gap||0)*(0.9+rngB()*0.15)*diffM().gap;f.r=(d.r||0)*(0.94+rngB()*0.1);}
 return f;}
function featSpan(f){var d=FEAT[f.k];if(d.grind)return f.w+40;
 if(f.k==='gap')return f.ap+f.gap+f.ex+30;

function spawn(){
 var ahead=S.nextX-S.p.x,m=runSpd(),dg=diffM().gap,den=LV.dense||1;
 if(S.dist+ahead>LV.len-220){S.nextX+=1e6;return;}
 var pool=LV.pool,k=pool[Math.floor(rng()*pool.length)];
 var vArr=Math.min(LV.max*m,S.spd+LV.ramp*m*ahead/Math.max(1,S.spd));
 // Pair takeoff ramp before tables / gaps / rails / hips (readable pop into air)
 var wantKick=(k==='table'||k==='gap'||k==='rail'||k==='hip'||k==='rainbow')&&rngB()<0.55+(LV.n>4?0.2:0);
 if(wantKick){var rk=mkFeat('kicker',0),rs=featSpan(rk);
  rk.wx=Math.round(S.dist+S.nextX+rs/2-S.p.x);S.feats.push(rk);S.nextX+=rs+vArr*0.12*den;}
 var f=mkFeat(k,0),span=featSpan(f);

}
function jump(){if(S.mode!=='play')return;
 var now=performance.now();
 if(S.p.on||S.grindOn){S.p.vy=JV;S.p.on=false;S.grindOn=null;S.flip=0;S.holding=true;S.lastTap=now;jumpBoing();
  var lf=lipNear();if(lf&&!S.lipHit[lf.wx]){var win=LIP_WIN*diffM().lip,ok=true;S.lipHit[lf.wx]=1;lf.lip=true;

  return;}

function holdSet(v){S.holding=!!v;}

function puff(x,y,n,c,v){var R=Math.random;for(var i=0;i<n;i++)S.parts.push({x:x,y:y,vx:(R()-.5)*2*v,vy:-R()*v,l:0.35+R()*0.3,c:c,s:2+R()*2});}
function step(dt){S.land=Math.max(0,S.land-dt*6);S.flash=Math.max(0,S.flash-dt);S.landBad=Math.max(0,S.landBad-dt);S.boostT=Math.max(0,S.boostT-dt);
 for(var q=S.parts.length-1;q>=0;q--){var P=S.parts[q];P.x+=P.vx*dt;P.y+=P.vy*dt;P.vy+=600*dt;P.l-=dt;if(P.l<=0)S.parts.splice(q,1);}
 if(S.parts.length>120)S.parts.splice(0,S.parts.length-120);
 S.t+=dt;var m=runSpd();S.spd=Math.min(LV.max*m,(LV.base+LV.ramp*S.t)*m);
 var dx=S.spd*dt;S.dist+=dx;S.nextX-=dx;while(S.nextX<2000)spawn();
 var p=S.p,py0=p.y,snow=gY(p.x),surfVy=(snow-py0)/dt,gap=inGap(p.x),gnd=grindAt(p.x);
