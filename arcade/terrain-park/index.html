<script>
(function(){

var TEST=/[?&]test=1/.test(location.search),GOD=false;
// ---- knobs (world units: virtual height 360) ----

var FEAT={
box:{w:110,h:14,ride:1,grind:1,s:'S',lab:'Flat box'},

rainbow:{w:130,h:36,ride:0,grind:1,arch:28,s:'M',lab:'Rainbow box'},
kicker:{w:0,h:0,terr:1,ap:52,dk:16,ex:30,amp:52,s:'S',lab:'Ramp',kick:1},
table:{w:0,h:0,terr:1,ap:48,dk:86,ex:46,amp:30,s:'M',lab:'Tabletop'},
gap:{w:0,h:0,terr:1,ap:38,gap:78,ex:52,amp:28,s:'L',lab:'Gap jump'},
hip:{w:0,h:0,terr:1,ap:32,dk:18,ex:70,amp:32,s:'L',lab:'Hip'},
qp:{w:0,h:0,terr:1,r:58,s:'L',lab:'Quarterpipe'},

grom:{w:22,h:36,ride:0,grind:0,mob:1,vx:55,s:'S',lab:'Grom (slow kid)'}
};
var LEVELS=[
{n:1,name:'Box Park',sub:'Grind a box · dodge groms',pool:['box','box','kicker','roller','grom'],base:290,ramp:2,max:350,len:4800,gapX:1.22,pick:.3,dense:0.95,trick:{t:'grind',n:0.7,lab:'Grind 0.7s'}},
{n:2,name:'Rail Line',sub:'Long rails · dodge rocks',pool:['box','rail','rail','rock','kicker','grom'],base:300,ramp:2.4,max:370,len:5600,gapX:1.16,pick:.32,dense:0.93,trick:{t:'grind',n:1.0,lab:'Grind 1.0s'}},
{n:3,name:'Rainbow Soft',sub:'Easy flip intro',pool:['box','rail','rainbow','kicker','grom'],base:308,ramp:2.7,max:385,len:6200,gapX:1.14,pick:.33,dense:0.92,trick:{t:'flip',n:1,lab:'Hold flip ×1'}},
{n:4,name:'Table Intro',sub:'Soft ramp → table',pool:['box','kicker','table','rail','grom'],base:318,ramp:3.0,max:405,len:7000,gapX:1.1,pick:.34,dense:0.9,trick:{t:'ramp',n:1,lab:'Ramp air ×1'}},
{n:5,name:'Mix Park',sub:'Rails + tables mid',pool:['kicker','table','rail','rock','box','grom'],base:332,ramp:3.4,max:435,len:8000,gapX:1.04,pick:.35,dense:0.88,trick:{t:'grind',n:1.3,lab:'Grind 1.3s'}},
{n:6,name:'Gap Taste',sub:'One gap · stay calm',pool:['kicker','table','gap','rail','grom','fence'],base:348,ramp:3.9,max:470,len:9000,gapX:.98,pick:.37,dense:0.85,trick:{t:'flip',n:1,lab:'Hold flip ×1'}},
{n:7,name:'Hip Warmup',sub:'Corners + kids',pool:['kicker','table','gap','hip','rail','grom'],base:365,ramp:4.4,max:510,len:10000,gapX:.92,pick:.4,dense:0.81,trick:{t:'ramp',n:1,lab:'Ramp air ×1'}},
{n:8,name:'Transition',sub:'QP + combo seed',pool:['kicker','hip','qp','table','gap','grom'],base:385,ramp:5.1,max:565,len:11200,gapX:.86,pick:.43,dense:0.76,trick:{t:'combo',n:1,lab:'COMBO ×1'}},
{n:9,name:'Full Park',sub:'Everything cooking',pool:['box','rail','rock','fence','kicker','table','gap','hip','qp','grom'],base:410,ramp:6.0,max:630,len:12800,gapX:.8,pick:.47,dense:0.7,trick:{t:'grind',n:1.8,lab:'Grind 1.8s'}},
{n:10,name:'Pro Line',sub:'Peak park',pool:['kicker','table','gap','hip','qp','rainbow','rail','rock','fence','grom'],base:440,ramp:7.2,max:720,len:14800,gapX:.72,pick:.52,dense:0.62,trick:{t:'flip',n:2,lab:'Hold flip ×2'}}
];
var ENDLESS={n:11,name:'Endless',sub:'Full park forever',pool:LEVELS[9].pool,base:360,ramp:8,max:780,len:Infinity,gapX:.68,pick:.52,dense:0.58,endless:true,trick:{t:'combo',n:2,lab:'COMBO ×2'}};
var BOARDS=[
{id:'grom',name:'Grom Deck',c:'#e85a2a',s:'#ffe8d0',spd:1.18,need:0,how:'Starter'},
{id:'box',name:'Box Cruiser',c:'#6a9088',s:'#e8f2ee',spd:1.32,need:2,how:'Clear 2 lines'},
{id:'rail',name:'Rail Steel',c:'#8a94a4',s:'#e8eef8',spd:1.46,need:4,how:'Clear 4 lines'},
{id:'kick',name:'Kicker Pop',c:'#e8772e',s:'#f7f4fb',spd:1.60,need:7,how:'Clear 7 lines'},
{id:'pro',name:'Pro Park',c:'#ff2d55',s:'#ffd84a',spd:1.78,need:10,how:'Clear all 10'}
];
var PK='terrainPark.progress',PR;try{PR=JSON.parse(localStorage.getItem(PK))}catch(e){}
PR=PR||{};PR.done=PR.done||[];PR.best=PR.best||{};PR.stars=PR.stars||0;PR.diff=PR.diff||'normal';PR.board=PR.board||'grom';
function saveP(){try{localStorage.setItem(PK,JSON.stringify(PR))}catch(e){}}
function unlocked(n){return n===1||PR.done.indexOf(n-1)>=0||(n===STORY+1&&endlessOpen())}
function endlessOpen(){for(var i=1;i<=STORY;i++)if(PR.done.indexOf(i)<0)return false;return true}
function clearedN(){return PR.done.filter(function(n){return n>=1&&n<=STORY}).length;}
function boardOpen(b){return !b.need||clearedN()>=b.need;}
function board(){var b=BOARDS.filter(function(x){return x.id===PR.board&&boardOpen(x)})[0];return b||BOARDS[0];}
function boardSpd(){return board().spd||1;}
function boardPct(b){return Math.round(((b&&b.spd)||boardSpd())*100);}
function boardTag(b){return 'SPD '+boardPct(b)+'%';}
function boardNext(){var c=board();for(var i=0;i<BOARDS.length-1;i++)if(BOARDS[i].id===c.id)return BOARDS[i+1];return null;}
function boardSw(b,lock){return '<span class="sw" style="background:'+(lock?'#333':'linear-gradient('+b.c+' 0 55%,'+b.s+' 55% 75%,'+b.c+' 75%)')+'"></span>';}
function boardPanelHTML(){var cur=board(),nx=boardNext(),h='<div class="lk"><div class="lkrow"><div class="card"><span class="lab">NOW</span>'+boardSw(cur,0)+'<b>'+cur.name+'</b><small>'+boardTag(cur)+' · start</small></div>';
if(nx){var o=boardOpen(nx),d=boardPct(nx)-boardPct(cur);
h+='<div class="card'+(o?'':' lock')+'"><span class="lab">NEXT</span>'+boardSw(nx,!o)+'<b>'+(o?'':'🔒 ')+nx.name+'</b><small>'+boardTag(nx)+(d?' · +'+d:'')+'</small></div></div><div class="goal"><b>GOAL</b> '+nx.how+' → <b>REWARD</b> '+boardTag(nx)+(d?' (+'+d+'% speed)':'')+'</div>';}
else h+='</div><div class="goal">Max board · Pro Park peaks the speed ladder</div>';
return h+'</div>';}
function diffM(){return DIFFS[PR.diff]||DIFFS.normal;}
function levelSpd(){return Math.min(SPD_CAP,SPD_BASE+Math.floor((Math.min(LV.n,STORY)-1)/2)*SPD_PER_2LV);}
function levelLen(){return isFinite(LV.len)?LV.len*LEN_MUL:LV.len;}
function runSpd(){return boardSpd()*levelSpd()*diffM().spd*((S&&S.boostT>0)?COMBO_BOOST:1)*((S&&S.landBad>0)?0.93:1);}
var LV=LEVELS[0];
var cv=document.getElementById('c'),cx=cv.getContext('2d'),W=640,scale=1,OY=0,worldH=VH;
var LS='terrainPark.pb', pb=+(localStorage.getItem(LS)||0);
var muted=localStorage.getItem('terrainPark.mute')==='1';
var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var S;
function mk(s){return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
var rng,rngP,rngB,TER;function seed(s){rng=mk(s);rngP=mk((s^0x85ebca6b)>>>0);rngB=mk((s^0xc2b2ae35)>>>0);
var rt=mk((s^0x27d4eb2f)>>>0);TER=[rt()*6.283,rt()*6.283,rt()*6.283];}
var HILL=[0,10,12,14,16,18,20,22,24,26,26];
function terr(wx){var A=HILL[LV.n]||10;return A*(0.55*Math.sin(wx/420+TER[0])+0.3*Math.sin(wx/190+TER[1])+0.15*Math.sin(wx/96+TER[2]));}
function featH(wx){if(!S||!S.feats)return 0;var h=0;
for(var i=0;i<S.feats.length;i++){var f=S.feats[i],d=FEAT[f.k];if(!d||!d.terr)continue;
var dx=wx-f.wx;
if(f.k==='table'||f.k==='roller'||f.k==='kicker'){var ap=f.ap,dk=f.dk,ex=f.ex,a=f.amp,L=-(ap+dk),R=dk+ex;
if(dx<=L||dx>=R)continue;var flat=terr(f.wx)-a-terr(wx);
if(dx<-dk){var t=(dx-L)/ap,e=terr(f.wx)-a-terr(f.wx-dk);h+=e*t;}
else if(dx<=dk)h+=flat;
else{var u=1-(dx-dk)/ex,e2=terr(f.wx)-a-terr(f.wx+dk);h+=e2*u;}}
else if(f.k==='gap'){var apg=f.ap,gw=f.gap,exg=f.ex,ag=f.amp,Lg=-(apg),Rg=gw+exg;
if(dx<=Lg||dx>=Rg)continue;
if(dx<0){var tg=(dx-Lg)/apg;h+=(terr(f.wx)-ag-terr(wx))*tg;} // takeoff climb to lip
else if(dx<gw){h+=90;} // pit under gap (visual + fall if riding through)
else{var ug=1-(dx-gw)/exg;h+=(terr(f.wx+gw)-ag*0.4-terr(wx))*ug;}} // landing catch
else if(f.k==='hip'){var aph=f.ap,dkh=f.dk,exh=f.ex,ah=f.amp,Lh=-(aph+dkh),Rh=dkh+exh;
if(dx<=Lh||dx>=Rh)continue;
if(dx<-dkh){var th=(dx-Lh)/aph;h+=(terr(f.wx)-ah-terr(wx))*th;}
else if(dx<=dkh)h+=terr(f.wx)-ah-terr(wx);
else{var uh=(dx-dkh)/exh;h+=(terr(f.wx)-ah*(1-uh*0.55)-terr(wx))*(1-uh*0.15);}}
else if(f.k==='qp'){var r=f.r;if(dx<-4||dx>r+8)continue;
if(dx<=r){var ang=Math.max(0,Math.min(1,dx/r));h+=terr(f.wx)-r*(1-Math.cos(ang*Math.PI/2))-terr(wx);}
else h+=terr(f.wx)-r-terr(wx);}}
return h;}
function H(sx){var wx=S.dist+sx-S.p.x;return terr(wx)+featH(wx);}
function gY(sx){return GROUND+H(sx);}
function slopeAt(sx){return Math.atan2(H(sx+6)-H(sx-6),12);}
function inGap(sx){if(!S||!S.feats)return false;var wx=S.dist+sx-S.p.x;
for(var i=0;i<S.feats.length;i++){var f=S.feats[i];if(f.k!=='gap')continue;var dx=wx-f.wx;if(dx>2&&dx<f.gap-2)return true;}
return false;}
function grindAt(sx){if(!S||!S.feats)return null;var wx=S.dist+sx-S.p.x,best=null,by=1e9;
for(var i=0;i<S.feats.length;i++){var f=S.feats[i],d=FEAT[f.k];if(!d||!d.grind)continue;
var x0=f.wx-f.w/2,x1=f.wx+f.w/2;if(wx<x0-2||wx>x1+2)continue;
var tt=(wx-x0)/Math.max(1,f.w),gy;
if(f.k==='rainbow'){var arch=f.arch||d.arch;gy=gY(sx)-(f.h||d.h)-Math.sin(tt*Math.PI)*arch;}
else if(f.k==='rail'){gy=gY(sx)-(f.h||d.h)-(tt*(f.down||0));}
else gy=gY(sx)-(f.h||d.h);
