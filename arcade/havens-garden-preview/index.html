<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#5ecf7a"/>
  <meta name="description" content="Haven's Garden — a cozy birthday garden game. Pick flowers, plant, water, and watch bees visit."/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="icon" href="assets/icon/app-icon-192.png"/>
  <link rel="apple-touch-icon" href="assets/icon/app-icon-512.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet"/>
  <title>Haven's Garden</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #96cdf0;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      position: fixed;
      inset: 0;
      font-family: Fredoka, system-ui, sans-serif;
    }
    canvas {
      display: block;
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #live {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    #safeProbe {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: env(safe-area-inset-bottom, 0px);
      pointer-events: none;
      visibility: hidden;
    }
    #boot {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(#96cdf0, #cdebfa 45%, #78c35f 45%, #69b455);
      color: #2a2418;
      transition: opacity 0.35s ease;
    }
    #boot.hidden {
      opacity: 0;
      pointer-events: none;
      display: none;
    }
    #boot h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
      font-weight: 700;
    }
    #boot p {
      margin: 0 0 18px;
      color: #4a4450;
      font-weight: 500;
    }
    #bootTrack {
      width: min(240px, 60vw);
      height: 14px;
      background: rgba(255, 250, 240, 0.9);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.08);
    }
    #bootBar {
      height: 100%;
      width: 0%;
      background: #5ecf7a;
      border-radius: 999px;
      transition: width 0.15s linear;
    }
    #boot small {
      margin-top: 14px;
      color: #6a6258;
    }
  </style>
</head>
<body>
  <div id="boot" aria-live="polite">
    <h1>Haven's Garden</h1>
    <p>Getting the meadow ready…</p>
    <div id="bootTrack"><div id="bootBar"></div></div>
    <small>v0.9-birthday-layers</small>
  </div>
  <canvas id="c" aria-label="Haven's Garden game"></canvas>
  <div id="live" aria-live="polite"></div>
  <div id="safeProbe"></div>
  <script src="js/assets.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/systems.js"></script>
  <script src="js/nursery.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
