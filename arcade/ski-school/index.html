<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a4a6a">
<title>Slopestyle / Big Air</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#15202b;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;position:fixed;inset:0}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
#safeProbe{position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="live" aria-live="polite"></div>
<div id="safeProbe" aria-hidden="true"></div>
<script>
'use strict';
/* ============================================================
   Slopestyle / Big Air v0.2.2 — Alto-style swoop tip (no IP/llamas)
   Safe-bottom UI: visualViewport + safe-area-inset + ≥90px pad
   PLAY → RUN (best of 3 vs AI) → LEADERBOARD
   Events: BIG AIR (XL bottom) · LONG JUMP (table) · SLOPESTYLE (S/M/L)
   ============================================================ */

/* ---- knobs (tune feel here) ---- */
const WORLD=4800;
const G=560;
const MAX_VX=560;
const BASE_VX=150;
const LAUNCH_MIN_VX=175;
const SPIN_RATE=4.5;
const LAND_PERF=0.16;
const LAND_GOOD=0.38;
const LAND_IMPACT_P=150;
const LAND_IMPACT_G=250;
const CAM_AIR_ZOOM=0.48;
const DT_CAP=1/30;
const ATTEMPTS=3;

/* Soft Alps dusk palette */
const C={
  sky0:'#1e3a55',sky1:'#3d6f96',sky2:'#8eb8d4',sky3:'#e8c9a0',
  far:'#3a556c',mid:'#4f6f88',near:'#6a879e',
  snow:'#eef5fb',shade:'#d0e0ed',deep:'#b4c8d8',
  ink:'#15202b',panel:'rgba(18,28,38,.90)',white:'#fff',
  gold:'#ffd56a',mint:'#5ec4a0',coral:'#e87a5d',steel:'#9db0c2',tree:'#2c4538'
};

const TIER={
  S:{h:28,span:70,label:'S',col:'#9db0c2'},
  M:{h:48,span:100,label:'M',col:'#5ec4a0'},
  L:{h:72,span:130,label:'L',col:'#ffd56a'},
  XL:{h:118,span:170,label:'XL',col:'#e87a5d'},
  TABLE:{h:36,span:280,label:'TABLE',col:'#4a9fd8',table:1}
};
const EVENTS=[
  {id:'big',name:'BIG AIR',tip:'swoop → XL at bottom',tiers:['XL']},
  {id:'long',name:'LONG JUMP',tip:'swoop → long table',tiers:['TABLE']},
  {id:'slope',name:'SLOPESTYLE',tip:'S · M · L along run',tiers:['S','M','L']}
];

/* Neutral cast — distinct vector looks, not girl-themed */
const RIDERS=[
  {id:'nova',name:'Nova',jacket:'#4a9fd8',pants:'#1e2a36',hair:'#1c2430',skin:'#e8c4a4',helm:'#2a3340'},
  {id:'rex',name:'Rex',jacket:'#e07a3a',pants:'#2a2430',hair:'#2b1c14',skin:'#d4a888',helm:'#3a2a22'},
  {id:'kite',name:'Kite',jacket:'#3d7a5c',pants:'#1a2830',hair:'#3a2a1c',skin:'#c99878',helm:'#2a4038'},
  {id:'jet',name:'Jet',jacket:'#2a3340',pants:'#151a22',hair:'#1a1a22',skin:'#e0b898',helm:'#ffd56a'},
  {id:'ash',name:'Ash',jacket:'#6b7c8c',pants:'#243038',hair:'#243038',skin:'#dcb090',helm:'#5ec4a0'},
  {id:'oro',name:'Oro',jacket:'#c4a35a',pants:'#2a2818',hair:'#3a3018',skin:'#e8c4a4',helm:'#2a3340'}
];

/* Tiered boards — pop / spin / stability; unlock by career pts */
const BOARDS=[
  {id:'stock',name:'STOCK',pop:1.0,spin:1.0,stab:1.0,cost:0,col:'#243040',accent:'#4a9fd8'},
  {id:'swift',name:'SWIFT',pop:1.12,spin:1.05,stab:0.95,cost:400,col:'#3d7a5c',accent:'#5ec4a0'},
  {id:'torque',name:'TORQUE',pop:1.05,spin:1.22,stab:0.9,cost:900,col:'#e07a3a',accent:'#ffd56a'},
  {id:'anchor',name:'ANCHOR',pop:0.95,spin:0.92,stab:1.28,cost:900,col:'#4a5562',accent:'#9db0c2'},
  {id:'apex',name:'APEX',pop:1.2,spin:1.15,stab:1.1,cost:2200,col:'#2a3340',accent:'#e87a5d'},
  {id:'orbit',name:'ORBIT',pop:1.28,spin:1.25,stab:1.05,cost:4000,col:'#1a2430',accent:'#ffd56a'}
];

const PK='skiSchool.ba', MUTE_K='skiSchool.ba.mute';
let PR; try{PR=JSON.parse(localStorage.getItem(PK)||'null');}catch(e){PR=null;}
if(!PR||!PR.boards) PR={rider:'nova',board:'stock',boards:{stock:1},pts:0,stars:0,best:{},mute:0,attempt:0};
function saveP(){try{localStorage.setItem(PK,JSON.stringify(PR));}catch(e){}}
let muted=localStorage.getItem(MUTE_K)==='1'||!!PR.mute;

const cv=document.getElementById('c'),cx=cv.getContext('2d');
const live=document.getElementById('live');
const safeProbe=document.getElementById('safeProbe');
let W=390,H=844,dpr=1,hit={},holding=false;
let padB=90, padT=12; // bottom safe pad (≥90 + inset)

function safeInsetBottom(){
  try{ return safeProbe.getBoundingClientRect().height||0; }catch(e){ return 0; }
}
function viewSize(){
  const vv=window.visualViewport;
  // Prefer visualViewport (mobile Safari bars); fall back to inner*
  let w=vv&&vv.width?vv.width:innerWidth;
  let h=vv&&vv.height?vv.height:innerHeight;
  // Screenshot / QA: ?vvh= shrinks height to mimic browser chrome
  const q=new URLSearchParams(location.search);
  const vvh=parseFloat(q.get('vvh')||'');
  if(vvh>200&&vvh<h) h=vvh;
  return {w:Math.max(280,Math.round(w)), h:Math.max(420,Math.round(h)), ox:vv?vv.offsetLeft||0:0, oy:vv?vv.offsetTop||0:0};
}
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  const vv=viewSize();
  W=vv.w; H=vv.h;
  padB=Math.max(90, 90+safeInsetBottom());
  padT=Math.max(12, 8+(safeProbe?0:0));
  cv.style.left=vv.ox+'px';
  cv.style.top=vv.oy+'px';
  cv.style.width=W+'px';
  cv.style.height=H+'px';
  cv.width=(W*dpr)|0; cv.height=(H*dpr)|0;
  cx.setTransform(dpr,0,0,dpr,0,0);
}
function contentBottom(){ return H-padB; } // tappable UI stays above this
function midThirdY(){ return H*0.34; } // primary CTA band
addEventListener('resize',resize);
if(window.visualViewport){
  visualViewport.addEventListener('resize',resize);
  visualViewport.addEventListener('scroll',resize);
}
resize();
function announce(t){live.textContent=t;}

/* ---- state ---- */
const ST={MENU:'MENU',RIDER:'RIDER',BOARD:'BOARD',RUN:'RUN',BOARD_END:'BOARD_END'};
let state=ST.MENU, eventId='big', attempt=1;
let runPts=0, runFlips=0, runMaxH=0, runGrade=null, slopeSum=0, slopeN=0;
let aiField=[]; // {name,pts,best}
let freezeShot=null;

function rider(){return RIDERS.find(r=>r.id===PR.rider)||RIDERS[0];}
function board(){return BOARDS.find(b=>b.id===PR.board)||BOARDS[0];}
function boardUnlocked(id){return !!PR.boards[id]||(BOARDS.find(b=>b.id===id)||{}).cost===0;}
function tryUnlockBoards(){
  BOARDS.forEach(b=>{ if(PR.pts>=b.cost) PR.boards[b.id]=1; });
  saveP();
}

/* ---- Web Audio ---- */
let ac=null;
function ensureAC(){try{ac=ac||new (AudioContext||webkitAudioContext)(); if(ac.state==='suspended')ac.resume();}catch(e){} return ac;}
function beep(f,d,type,v){
  if(muted||!ensureAC())return;
  try{
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(v||0.1,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+d);
  }catch(e){}
}
function whoosh(){
  if(muted||!ensureAC())return;
  try{
    const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(420,t+0.18);
    g.gain.setValueAtTime(0.001,t); g.gain.exponentialRampToValueAtTime(0.12,t+0.04); g.gain.exponentialRampToValueAtTime(0.001,t+0.28);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+0.3);
  }catch(e){}
}
function landSfx(grade){
  if(grade==='PERFECT'){beep(660,0.12,'square',0.1); setTimeout(()=>beep(880,0.14,'square',0.1),90);}
  else if(grade==='GOOD') beep(520,0.14,'triangle',0.12);
  else if(grade==='SKETCHY') beep(220,0.2,'sawtooth',0.1);
  else beep(90,0.35,'sawtooth',0.16);
}
function uiBeep(){beep(480,0.07,'triangle',0.08);}

/* ---- terrain ---- */
function baseSwoop(x){
  const t=x/WORLD;
  return 120+t*t*620+Math.sin(x*0.008)*18+Math.sin(x*0.019+0.7)*12+Math.sin(x*0.041)*6;
}
function jumpsForEvent(){
  if(eventId==='long') return [{x:3600,tier:'TABLE'}];
  if(eventId==='slope') return [{x:1400,tier:'S'},{x:2300,tier:'M'},{x:3200,tier:'L'}];
  return [{x:3800,tier:'XL'}];
}
function bumpAt(x,j){
  const T=TIER[j.tier], dx=x-j.x;
  if(T.table){
    if(dx<-T.span*0.15) return 0;
    if(dx<0){const u=(dx+T.span*0.15)/(T.span*0.15); return -T.h*u*u;}
    if(dx<T.span*0.7) return -T.h;
    if(dx<T.span){const u=(dx-T.span*0.7)/(T.span*0.3); return -T.h*(1-u);}
    return 0;
  }
  if(Math.abs(dx)>T.span) return 0;
  if(dx<0){const a=1-Math.pow(dx/(T.span*0.55),2); return a>0?-T.h*a*0.95:0;}
  return -T.h*Math.exp(-Math.pow(dx/(T.span*0.35),2))*0.35;
}
function terrainY(x){ let y=baseSwoop(x); jumpsForEvent().forEach(j=>{y+=bumpAt(x,j);}); return y; }
function terrainSlope(x){const e=3; return (terrainY(x+e)-terrainY(x-e))/(2*e);}
function terrainAngle(x){return Math.atan(terrainSlope(x));}
function nearLip(x){
  let best=null,bd=1e9;
  jumpsForEvent().forEach(j=>{
    const d=j.x-x;
    if(d>-20&&d<TIER[j.tier].span*0.2&&Math.abs(d)<bd){bd=Math.abs(d);best=j;}
  });
  return best;
}

/* ---- rider physics ---- */
let P={x:220,y:0,vx:BASE_VX,vy:0,ang:0,av:0,air:0,spin:0,height:0,maxH:0,flips:0,grade:null,gradeT:0,pts:0,trail:[],spray:[],launched:null,dist:0};
let cam={x:0,y:0,z:1};

function addSpray(n){
  for(let i=0;i<n;i++){
    if(P.spray.length>70) P.spray.shift();
    P.spray.push({x:P.x-6-Math.random()*18,y:P.y+4+Math.random()*5,vx:-50-Math.random()*80,vy:-25-Math.random()*55,r:1.2+Math.random()*2.4,life:0.28+Math.random()*0.4});
  }
}
function gradeFrom(err,impact,stab){
  const e=err/stab;
  if(impact>400||e>0.9) return 'BAIL';
  if(e<LAND_PERF&&impact<LAND_IMPACT_P) return 'PERFECT';
  if(e<LAND_GOOD&&impact<LAND_IMPACT_G) return 'GOOD';
  return 'SKETCHY';
}
function scoreLanding(grade,maxH,flips,vx,tier){
  const mult=grade==='PERFECT'?1.35:grade==='GOOD'?1.1:grade==='SKETCHY'?0.7:0.12;
  const tb=tier==='XL'?1.25:tier==='TABLE'?1.15:tier==='L'?1.05:1;
  let pts=Math.round((maxH*0.85+flips*170+Math.min(50,vx*0.07))*mult*tb);
  if(eventId==='long') pts=Math.round((P.dist*0.35+maxH*0.3)*mult);
  return pts;
}

function resetRun(){
  const B=board();
  P.x=220; P.vx=BASE_VX; P.vy=0; P.air=0; P.spin=0; P.av=0;
  P.y=terrainY(P.x)-14; P.ang=terrainAngle(P.x);
  P.height=0; P.maxH=0; P.flips=0; P.grade=null; P.gradeT=0; P.pts=0;
  P.trail=[]; P.spray=[]; P.launched=null; P.dist=0;
  holding=false; runPts=0; runFlips=0; runMaxH=0; runGrade=null; slopeSum=0; slopeN=0;
  cam.x=P.x; cam.y=P.y; cam.z=1;
}
function seedAI(){
  const names=RIDERS.filter(r=>r.id!==PR.rider).slice(0,4);
  aiField=names.map((r,i)=>({
    id:r.id,name:r.name,look:r,
    pts:0,best:'—',
    // latent skill for canned attempts
    skill:0.72+i*0.06+Math.random()*0.08
  }));
}
function aiAttemptScores(){
  // fill AI attempt results relative to player run
  aiField.forEach(a=>{
    if(a.doneAttempt===attempt) return;
    const base=eventId==='long'?500:eventId==='slope'?700:650;
    const jitter=(Math.random()-0.4)*220;
    const pts=Math.max(0,Math.round(base*a.skill+jitter));
    const grades=['BAIL','SKETCHY','GOOD','PERFECT','GOOD'];
    const g=grades[Math.min(4,Math.floor(a.skill*4+Math.random()))];
    if(pts>a.pts){a.pts=pts; a.best=g;}
    a.doneAttempt=attempt;
  });
}

function endAttempt(){
  aiAttemptScores();
  const youPts=runPts;
  PR.pts=(PR.pts|0)+youPts;
  if(runGrade==='PERFECT') PR.stars=(PR.stars|0)+1;
  else if(runGrade==='GOOD') PR.stars=(PR.stars|0)+(Math.random()>0.5?1:0);
  const key=eventId;
  PR.best[key]=Math.max(PR.best[key]|0, youPts);
  tryUnlockBoards(); saveP();
  state=ST.BOARD_END;
  announce('Attempt '+attempt+' · '+runGrade+' · '+youPts+' pts');
}

function step(dt){
  if(state!==ST.RUN||freezeShot) return;
  dt=Math.min(dt,DT_CAP);
  const B=board();

  if(P.air){
    P.vy+=G*dt; P.vx*=(1-0.05*dt);
    P.x+=P.vx*dt; P.y+=P.vy*dt;
    if(holding){ P.av=SPIN_RATE*B.spin; P.spin+=P.av*dt; }
    else P.av*=Math.max(0,1-3.2*dt);
    P.ang+=P.av*dt;
    const ty=terrainY(P.x);
    P.height=Math.max(0,ty-14-P.y);
    if(P.height>P.maxH) P.maxH=P.height;
    P.flips=Math.floor(Math.abs(P.spin)/(Math.PI*2));
    if(eventId==='long'&&P.launched) P.dist=Math.max(P.dist, P.x-(jumpsForEvent()[0].x));

    if(P.y>=ty-14&&P.vy>0){
      const slope=terrainAngle(P.x);
      let boardA=P.ang;
      while(boardA-slope>Math.PI) boardA-=Math.PI*2;
      while(boardA-slope<-Math.PI) boardA+=Math.PI*2;
      const err=Math.abs(boardA-slope);
      const grade=gradeFrom(err,P.vy,B.stab);
      const pts=scoreLanding(grade,P.maxH,P.flips,P.vx,P.launched);
      P.grade=grade; P.gradeT=2.2; P.pts=pts;
      runGrade=grade; runPts+=pts; runFlips+=P.flips; runMaxH=Math.max(runMaxH,P.maxH);
      if(eventId==='slope'){slopeSum+=pts; slopeN++;}
      P.y=ty-14; P.air=0; P.vy=0; P.ang=slope; P.av=0; holding=false;
      P.vx*=grade==='BAIL'?0.15:0.72;
      addSpray(grade==='BAIL'?16:10);
      landSfx(grade);
      // slopestyle continues; big/long end after landing settles
      if(eventId!=='slope'){
        setTimeout(()=>{ if(state===ST.RUN&&!P.air) endAttempt(); }, 1100);
      }
    }
  } else {
    const slope=terrainAngle(P.x);
    P.vx+=G*Math.sin(slope)*0.95*dt;
    if(holding) P.vx=Math.min(MAX_VX,P.vx+48*dt); // tuck
    P.vx=Math.max(50,Math.min(MAX_VX,P.vx*(1-0.055*dt)));
    P.x+=P.vx*dt;
    P.y=terrainY(P.x)-14;
    P.ang+=(slope-P.ang)*Math.min(1,dt*14);
    P.height=0;
    if(P.vx>100) addSpray(P.vx>240?2:1);

    const lip=nearLip(P.x);
    if(lip&&P.vx>LAUNCH_MIN_VX){
      const T=TIER[lip.tier];
      if(P.x>lip.x-8&&P.x<lip.x+12){
        P.air=1; P.launched=lip.tier;
        const boost=Math.min(280,P.vx*0.5*B.pop+T.h*1.15);
        P.vy=-boost; P.vx+=20+T.h*0.15;
        P.spin=0; P.av=0; P.maxH=0; P.flips=0; P.grade=null;
        if(eventId==='long') P.dist=0;
        addSpray(14); whoosh();
      }
    }
  }

  if(!P.trail.length||Math.hypot(P.x-P.trail.at(-1).x,P.y-P.trail.at(-1).y)>11){
    P.trail.push({x:P.x,y:P.y,air:P.air}); if(P.trail.length>48) P.trail.shift();
  }
  for(let i=P.spray.length-1;i>=0;i--){
    const s=P.spray[i]; s.life-=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=200*dt;
    if(s.life<=0) P.spray.splice(i,1);
  }
  if(P.gradeT>0) P.gradeT-=dt;

  const targetZ=P.air?Math.max(CAM_AIR_ZOOM,1-P.height/480):Math.min(1,0.84+P.vx/3000);
  cam.z+=(targetZ-cam.z)*Math.min(1,dt*2.2);
  cam.x+=(P.x+130-cam.x)*Math.min(1,dt*3);
  cam.y+=(P.y-50-cam.y)*Math.min(1,dt*2.4);

  // course end
  if(P.x>WORLD-160){ if(eventId==='slope'&&slopeN){runPts=slopeSum;} endAttempt(); }
  // slope: after last jump + travel
  if(eventId==='slope'&&slopeN>=3&&!P.air&&P.x>jumpsForEvent()[2].x+280&&P.gradeT<=0) endAttempt();
}

/* ---- draw helpers ---- */
function rr(x,y,w,h,r){const R=Math.min(r,w/2,h/2);cx.beginPath();cx.moveTo(x+R,y);cx.arcTo(x+w,y,x+w,y+h,R);cx.arcTo(x+w,y+h,x,y+h,R);cx.arcTo(x,y+h,x,y,R);cx.arcTo(x,y,x+w,y,R);cx.closePath();}
function panel(x,y,w,h,a){cx.fillStyle=a||C.panel;rr(x,y,w,h,14);cx.fill();}
function btn(x,y,w,h,label,fill,ink,key){
  cx.fillStyle=fill;rr(x,y,w,h,14);cx.fill();
  cx.fillStyle=ink||C.ink;cx.font='bold '+(h>48?17:14)+'px system-ui,sans-serif';
  cx.textAlign='center';cx.textBaseline='middle';cx.fillText(label,x+w/2,y+h/2+1);
  if(key) hit[key]={x,y,w,h};
}
function w2s(wx,wy){const z=cam.z;return{x:W*0.36+(wx-cam.x)*z,y:H*0.42+(wy-cam.y)*z};}

function drawSky(){
  const g=cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,C.sky0); g.addColorStop(0.35,C.sky1); g.addColorStop(0.72,C.sky2); g.addColorStop(1,C.sky3);
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
  const sx=W*0.78,sy=H*0.14;
  const rg=cx.createRadialGradient(sx,sy,2,sx,sy,110);
  rg.addColorStop(0,'rgba(255,200,140,.55)'); rg.addColorStop(1,'rgba(255,200,140,0)');
  cx.fillStyle=rg; cx.beginPath(); cx.arc(sx,sy,110,0,Math.PI*2); cx.fill();
}
function drawParallax(){
  [[C.far,0.12,58,H*0.36,0.2],[C.mid,0.26,78,H*0.44,1.1],[C.near,0.42,98,H*0.52,2.0]].forEach(([col,par,amp,y0,seed])=>{
    cx.fillStyle=col; cx.beginPath(); cx.moveTo(0,H);
    for(let i=0;i<=22;i++){
      const sx=i/22*W, wx=cam.x*par+i*190;
      const yy=y0-Math.abs(Math.sin(wx*0.0035+seed))*amp*cam.z-(1-cam.z)*16;
      cx.lineTo(sx,yy);
    }
    cx.lineTo(W,H); cx.closePath(); cx.fill();
    cx.fillStyle='rgba(255,255,255,.28)';
    for(let i=2;i<22;i+=4){
      const sx=i/22*W, wx=cam.x*par+i*190;
      const yy=y0-Math.abs(Math.sin(wx*0.0035+seed))*amp*cam.z-(1-cam.z)*16;
      cx.beginPath(); cx.moveTo(sx-12,yy+10); cx.lineTo(sx,yy); cx.lineTo(sx+12,yy+10); cx.fill();
    }
  });
}
function drawTerrain(){
  const span=W/cam.z*1.4, x0=cam.x-span*0.4, x1=cam.x+span*0.75, steps=70;
  cx.beginPath();
  for(let i=0;i<=steps;i++){
    const wx=x0+(x1-x0)*i/steps, p=w2s(wx,terrainY(wx));
    if(i===0) cx.moveTo(p.x,p.y); else cx.lineTo(p.x,p.y);
  }
  const e=w2s(x1,terrainY(x1)), s=w2s(x0,terrainY(x0));
  cx.lineTo(e.x,H+50); cx.lineTo(s.x,H+50); cx.closePath();
  const tg=cx.createLinearGradient(0,H*0.35,0,H);
  tg.addColorStop(0,C.snow); tg.addColorStop(0.55,C.shade); tg.addColorStop(1,C.deep);
  cx.fillStyle=tg; cx.fill();
  cx.strokeStyle='rgba(255,255,255,.88)'; cx.lineWidth=3; cx.beginPath();
  for(let i=0;i<=steps;i++){const wx=x0+(x1-x0)*i/steps,p=w2s(wx,terrainY(wx)); if(i===0)cx.moveTo(p.x,p.y); else cx.lineTo(p.x,p.y);}
  cx.stroke();
  jumpsForEvent().forEach(j=>{
    const T=TIER[j.tier], p=w2s(j.x,terrainY(j.x));
    if(p.x<-50||p.x>W+50) return;
    cx.fillStyle='rgba(18,28,38,.8)'; const tw=j.tier==='TABLE'?52:28;
    rr(p.x-tw/2,p.y-38*cam.z,tw,18,6); cx.fill();

    cx.fillText(T.label,p.x,p.y-26*cam.z);
  });
  for(let i=0;i<8;i++){
    const wx=(((x0+i*(span/8))/110)|0)*110+40;
    if(wx<x0||wx>x1) continue;
    const p=w2s(wx,terrainY(wx)), sc=15*cam.z;
    cx.fillStyle=C.tree;
    cx.beginPath(); cx.moveTo(p.x,p.y-sc*2.1); cx.lineTo(p.x-sc*.65,p.y); cx.lineTo(p.x+sc*.65,p.y); cx.fill();
  }
}
function drawTrail(){
  if(P.trail.length<2) return;
  for(let i=1;i<P.trail.length;i++){
    const a=P.trail[i-1],b=P.trail[i],pa=w2s(a.x,a.y),pb=w2s(b.x,b.y),t=i/P.trail.length;
    cx.strokeStyle=a.air?`rgba(255,213,106,${0.12+t*.5})`:`rgba(74,159,216,${0.1+t*.4})`;
    cx.lineWidth=(a.air?5:9)*cam.z*t; cx.lineCap='round';
    cx.beginPath(); cx.moveTo(pa.x,pa.y); cx.lineTo(pb.x,pb.y); cx.stroke();
  }
}
function drawSpray(){

function drawRiderAt(p,ang,look,bd,s,opts){

  cx.beginPath(); cx.moveTo(7,2); cx.lineTo(15,13); cx.lineTo(7,14); cx.lineTo(2,4); cx.fill();

  cx.strokeStyle=look.jacket; cx.lineWidth=5.5; cx.lineCap='round';
  if(opts.grab){cx.beginPath();cx.moveTo(-11,-2);cx.lineTo(-3,13);cx.stroke();cx.beginPath();cx.moveTo(11,-2);cx.lineTo(2,14);cx.stroke();}
  else if(opts.air){cx.beginPath();cx.moveTo(-11,-2);cx.lineTo(-22,-12);cx.stroke();cx.beginPath();cx.moveTo(11,-2);cx.lineTo(22,-5);cx.stroke();}

/* ---- input / flow ---- */
function startRun(resetAttempt){
  if(resetAttempt){attempt=1; seedAI();}
  resetRun(); state=ST.RUN; freezeShot=null;
  announce('Drop in · '+EVENTS.find(e=>e.id===eventId).name);
  uiBeep();
}
function ptr(e){
  // Map client coords → canvas CSS-pixel space (matches draw after dpr transform)
  const t=e.changedTouches?e.changedTouches[0]:e;
  const r=cv.getBoundingClientRect();
  const sx=r.width?W/r.width:1, sy=r.height?H/r.height:1;
  return{x:(t.clientX-r.left)*sx, y:(t.clientY-r.top)*sy};
}
function inRect(p,r){return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}

function onDown(e){
  e.preventDefault(); ensureAC();
  const p=ptr(e);
  if(state===ST.MENU){
    if(inRect(p,hit.play)){startRun(1); return;}
    EVENTS.forEach((ev,i)=>{if(inRect(p,hit['ev'+i])){eventId=ev.id; uiBeep();}});
    if(inRect(p,hit.rider)){state=ST.RIDER; uiBeep(); return;}
    if(inRect(p,hit.boards)){state=ST.BOARD; uiBeep(); return;}
    if(inRect(p,hit.mute)){muted=!muted; try{localStorage.setItem(MUTE_K,muted?'1':'0');}catch(e){} return;}
    return;
  }
  if(state===ST.RIDER){
    RIDERS.forEach((r,i)=>{if(inRect(p,hit['r'+i])){PR.rider=r.id; saveP(); uiBeep();}});
    if(inRect(p,hit.done)){state=ST.MENU; return;}
    return;
  }
  if(state===ST.BOARD){
    BOARDS.forEach((b,i)=>{if(inRect(p,hit['b'+i])&&boardUnlocked(b.id)){PR.board=b.id; saveP(); uiBeep();}});
    if(inRect(p,hit.done)){state=ST.MENU; return;}
    return;
  }
  if(state===ST.BOARD_END){
    if(inRect(p,hit.again)){
      if(attempt<ATTEMPTS){attempt++; startRun(0);}
      else startRun(1);
      return;
    }
    if(inRect(p,hit.menu)){state=ST.MENU; return;}
    return;
  }
  if(state===ST.RUN){
    if(inRect(p,hit.mute)){muted=!muted; try{localStorage.setItem(MUTE_K,muted?'1':'0');}catch(e){} return;}
    if(inRect(p,hit.hold)||inRect(p,hit.tuck)||(p.y>contentBottom()-70&&p.x>W*0.45)) holding=true;
  }
}
function onUp(e){e.preventDefault(); holding=false;}
cv.addEventListener('mousedown',onDown,{passive:false});
cv.addEventListener('mouseup',onUp,{passive:false});
cv.addEventListener('mouseleave',onUp,{passive:false});
cv.addEventListener('touchstart',onDown,{passive:false});
cv.addEventListener('touchend',onUp,{passive:false});
cv.addEventListener('touchcancel',onUp,{passive:false});
addEventListener('keydown',e=>{
  ensureAC();
  if(e.code==='Space') holding=true;
  if(e.key==='m'||e.key==='M'){muted=!muted;}
  if(e.key==='Escape'){if(state===ST.RUN||state===ST.BOARD_END) state=ST.MENU;}
});
addEventListener('keyup',e=>{if(e.code==='Space') holding=false;});

/* ---- screenshot staging ---- */
function applyShot(name){
  freezeShot=name;
  if(name==='menu'){state=ST.MENU; return;}
  if(name==='rider'){state=ST.RIDER; return;}
  if(name==='board'){state=ST.BOARD; return;}
  if(name==='leaderboard'){
    eventId='big'; attempt=2; seedAI();
    runPts=880; runMaxH=160; runFlips=2; runGrade='PERFECT';
    aiField.forEach((a,i)=>{a.pts=[910,680,540,0][i]||400; a.best=['PERFECT','GOOD','SKETCHY','BAIL'][i]; a.doneAttempt=2;});
    resetRun(); P.x=4000; P.y=terrainY(P.x)-14; cam.x=P.x; cam.y=P.y-40; cam.z=0.7;
    state=ST.BOARD_END; return;
  }
  state=ST.RUN; eventId='big'; attempt=2; resetRun();
  if(name==='descent'){
    P.x=1100; P.vx=290; P.air=0; P.y=terrainY(P.x)-14; P.ang=terrainAngle(P.x);
    P.trail=[]; for(let i=0;i<30;i++){const x=P.x-i*16; P.trail.unshift({x,y:terrainY(x)-14,air:0});}
    addSpray(18); cam.x=P.x+100; cam.y=P.y-30; cam.z=0.92; return;
  }
  if(name==='air'){
    const jx=jumpsForEvent()[0].x;
    P.x=jx+50; P.air=1; holding=true; P.launched='XL';
    P.vx=300; P.height=180; P.maxH=180; P.y=terrainY(P.x)-14-P.height;
    P.ang=1.0; P.spin=Math.PI*1.3;
    P.trail=[]; for(let i=0;i<40;i++){const t=i/40,x=jx-600+t*680,h=x>jx-10?Math.sin(Math.min(1,(x-jx+10)/80)*Math.PI)*180:0; P.trail.push({x,y:terrainY(x)-14-h,air:h>0?1:0});}
    cam.x=jx-380; cam.y=terrainY(jx-180); cam.z=0.4; return;
  }
  if(name==='landing'){
    const jx=jumpsForEvent()[0].x;
    P.x=jx+150; P.air=0; P.y=terrainY(P.x)-14; P.ang=terrainAngle(P.x); P.vx=140;
    P.maxH=150; P.flips=2; P.grade='PERFECT'; P.gradeT=2.5; P.pts=920; runGrade='PERFECT'; runPts=920; runMaxH=150; runFlips=2;
    P.trail=[]; for(let i=0;i<40;i++){const t=i/40,x=jx-20+t*190,air=t<0.75,h=air?Math.sin(t/0.75*Math.PI)*150:0; P.trail.push({x,y:terrainY(x)-14-h,air:air?1:0});}
    addSpray(10); cam.x=P.x+40; cam.y=P.y-30; cam.z=0.72;
  }
}

/* ---- loop ---- */
let last=performance.now();
function frame(now){
  const dt=(now-last)/1000; last=now;
  if(!freezeShot) step(dt);
  hit={};
  cx.clearRect(0,0,W,H);
  if(state===ST.MENU) drawMenu();
  else if(state===ST.RIDER) drawRiderSelect();
  else if(state===ST.BOARD) drawBoardSelect();
  else if(state===ST.BOARD_END) drawLeaderboard();
  else { drawWorld(); drawRunHUD(); }
  requestAnimationFrame(frame);
}

tryUnlockBoards();
const q=new URLSearchParams(location.search);
const shot=(q.get('shot')||'').toLowerCase();
if(['menu','rider','board','descent','air','landing','leaderboard'].includes(shot)) applyShot(shot);
else announce('Slopestyle / Big Air');

requestAnimationFrame(frame);
window.__ba={
  ST,state:()=>state,startRun,applyShot,PR,P,EVENTS,RIDERS,BOARDS,
  hit:()=>hit, padB:()=>padB, contentBottom, size:()=>({W,H,dpr,padB}),
  // Layout QA: primary hits above contentBottom; mute may use pad band
  layoutOk(){
    const lim=contentBottom();
    const bad=[];
    Object.keys(hit).forEach(k=>{
      const r=hit[k]; if(!r) return;
      const allow=k==='mute'?lim+48:lim;
      if(r.y+r.h>allow+0.5) bad.push([k, Math.round(r.y+r.h), Math.round(allow)]);
    });
    return {ok:!bad.length, bad, lim, H, padB, W};
  }
};

if('serviceWorker' in navigator){
  addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
}
</script>
