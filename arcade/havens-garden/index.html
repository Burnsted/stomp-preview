<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7ec8ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Haven's Garden</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#7ec8ff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;position:fixed;inset:0}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
#safeProbe{position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden}
</style>
</head>
<body>
<canvas id="c" aria-label="Haven's Garden"></canvas>
<div id="live" aria-live="polite"></div>
<div id="safeProbe" aria-hidden="true"></div>
<script>
'use strict';
/* ============================================================
   Haven's Garden v0.3 — Franz realistic plates 01–07 (geometric)
   pick · greenhouse · plant · pick more · mixed bouquets · no fail
   ============================================================ */
const VER='v0.3';
const BASKET_SLOTS=6,PICK_RADIUS=36,TARGET_SPACING=78,SPAWN_INTERVAL=720,SPAWN_HOLD=9000;
const INTRO_BLOOMS_PERSIST=true,PIP_SPEED=260,WORLD_SPEED=118,SWEEP_RADIUS=34,TRAIL_MAX=14;
const OUTINGS_PER_GARDEN=2,NEW_SPECIES_EVERY=2,MIN_OUTING_TYPES=3;
const MAX_PARTICLES=90,MAX_AUDIO_VOICES=5,MASTER_GAIN=0.2,DPR_CAP=2,DT_CAP=1/20;
const BURST_INTERVAL=7200,BURST_COUNT=6,BURST_SPEED=2.4,BURST_DUR=2.2;
const MAGNET_INTERVAL=11000,MAGNET_DUR=3.2,MAGNET_RADIUS=150;
const COMBO_WINDOW=900,COMBO_COOL=1.6,BLOOM_POP_MS=200,SAFE_UI=90,PATH_LANES=3;
/* Realistic plate colors — readable geometry */
const SKY0='#7ec8ff',SKY1='#c8f0ff',SKY2='#ffe9a0',FAR='#7edc6a',MID='#5ecf5a';
const DIRT0='#d9b99b',DIRT1='#b8956e',RUT='#a68a6d',FRAME='#ffffff',GOLD='#d4a017',RING='#e3d4b6',SOIL='#8B5A2B';
const SPECIES=[
  {id:'daisy',shape:'daisy',c0:'#fff8f0',c1:'#ffd24a',c2:'#ffe9a8'},
  {id:'tulip',shape:'tulip',c0:'#ff7ab0',c1:'#ff3d7a',c2:'#ffb3cc'},
  {id:'bell',shape:'bell',c0:'#c59bff',c1:'#9b6bff',c2:'#e2cfff'},
  {id:'poppy',shape:'daisy',c0:'#ff7a5a',c1:'#e84830',c2:'#ffb0a0'},
  {id:'butter',shape:'daisy',c0:'#ffe566',c1:'#ffc01a',c2:'#fff1a8'},
  {id:'minty',shape:'fan',c0:'#5dffc2',c1:'#1ecf8e',c2:'#b8ffe4'},
  {id:'blush',shape:'tulip',c0:'#ff9ec4',c1:'#ff6aa0',c2:'#ffd0e2'},
  {id:'night',shape:'bell',c0:'#ffd86b',c1:'#ffb000',c2:'#fff0b8'},
  {id:'sky',shape:'daisy',c0:'#8ad4ff',c1:'#3aa8f0',c2:'#c8ebff'},
  {id:'coral',shape:'fan',c0:'#ff9a6b',c1:'#ff6a3a',c2:'#ffd0b8'},
  {id:'lilac',shape:'tulip',c0:'#d4a8ff',c1:'#a86bff',c2:'#ebd4ff'},
  {id:'rainbow',shape:'daisy',c0:'#ff9ad4',c1:'#ffd24a',c2:'#8ad4ff'}
];
const GARDENS=[
  {id:'sunny',name:'Sunny Patch',tint:'#ffd24a',max:5,persist:1,feat:'stable'},
  {id:'puddle',name:'Puddle Meadow',tint:'#5ec8e0',max:5,persist:0,feat:'puddles'},
  {id:'butterfly',name:'Butterfly Bend',tint:'#ff7ab8',max:6,persist:0,feat:'fan'},
  {id:'lantern',name:'Lantern Garden',tint:'#ffc84a',max:5,persist:0,feat:'dusk',dark:1},
  {id:'rainbow',name:'Rainbow Greenhouse',tint:'#ff80c0',max:6,persist:0,feat:'curve'}
];
const DECORS=[{id:'bench'},{id:'arch'}];
/* Interior circular soil beds — two columns × 5 (plate 03) */
const PLANT_SPOTS=[
  {x:0.34,y:0.44},{x:0.66,y:0.44},
  {x:0.34,y:0.52},{x:0.66,y:0.52},
  {x:0.34,y:0.60},{x:0.66,y:0.60},
  {x:0.34,y:0.68},{x:0.66,y:0.68},
  {x:0.34,y:0.76},{x:0.66,y:0.76}
];

const PK='havensGarden.v1',MUTE_K='havensGarden.mute',QUIET_K='havensGarden.quiet';
let SAVE;try{SAVE=JSON.parse(localStorage.getItem(PK)||'null');}catch(e){SAVE=null;}
function freshSave(){return{v:1,unlocked:1,baskets:0,outingDone:0,album:[],pots:[],decors:[],gardenBaskets:[0,0,0,0,0],mute:0,quiet:0,taughtPlant:0,spotOcc:[]};}
if(!SAVE||!SAVE.gardenBaskets)SAVE=freshSave();
if(SAVE.taughtPlant==null)SAVE.taughtPlant=0;
if(!SAVE.spotOcc)SAVE.spotOcc=[];
function save(){try{localStorage.setItem(PK,JSON.stringify(SAVE));}catch(e){}}
let muted=localStorage.getItem(MUTE_K)==='1'||!!SAVE.mute;
let quiet=localStorage.getItem(QUIET_K)==='1'||!!SAVE.quiet||!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

const cv=document.getElementById('c'),cx=cv.getContext('2d');
const live=document.getElementById('live'),safeProbe=document.getElementById('safeProbe');
let W=390,H=844,dpr=1,padB=SAFE_UI,padT=12,hit={};
function safeInsetBottom(){try{return safeProbe.getBoundingClientRect().height||0;}catch(e){return 0;}}
function viewSize(){
  const vv=window.visualViewport;let w=vv&&vv.width?vv.width:innerWidth,h=vv&&vv.height?vv.height:innerHeight;
  const vvh=parseFloat(new URLSearchParams(location.search).get('vvh')||'');if(vvh>200&&vvh<h)h=vvh;
  return{w:Math.max(280,Math.round(w)),h:Math.max(420,Math.round(h)),ox:vv?vv.offsetLeft||0:0,oy:vv?vv.offsetTop||0:0};
}
function resize(){
  dpr=Math.min(devicePixelRatio||1,DPR_CAP);const vv=viewSize();W=vv.w;H=vv.h;
  padB=Math.max(SAFE_UI,SAFE_UI+safeInsetBottom());padT=12;
  cv.style.left=vv.ox+'px';cv.style.top=vv.oy+'px';cv.style.width=W+'px';cv.style.height=H+'px';
  cv.width=(W*dpr)|0;cv.height=(H*dpr)|0;cx.setTransform(dpr,0,0,dpr,0,0);
}
function contentBottom(){return H-padB;}
addEventListener('resize',resize);
if(window.visualViewport){visualViewport.addEventListener('resize',resize);visualViewport.addEventListener('scroll',resize);}
resize();function announce(t){live.textContent=t;}

const ST={MENU:'MENU',PLAY:'PLAY',NURSERY:'NURSERY',PAUSED:'PAUSED'};
let state=ST.MENU,gardenIdx=0,returnGarden=-1;
let flowers=[],particles=[],arcs=[],dust=[];
let basket=[],pendingBasket=[],peekKeep=0,spawnTypeIdx=0;
let combo=0,comboT=0,comboPop=0,flourishT=0;
let worldY=0,worldSp=WORLD_SPEED,burstT=0,burstLeft=0,magnetT=0,magnetLeft=0;
let spawnT=0,showDemo=1,albumOpen=0,basketFull=0,scrollPaused=0,cue='';
let teach=0,teachStep=0,plantAnim=0,plantAnimT=0,plantSpot=-1,celebrateT=0,plantBouquet=[];
let nurseryMode='look',nurseryChoice=-1,nurseryView='inside'; // enter|inside|exit
let door=1,doorDir=0;
let pip={lane:1,x:0,y:0,tx:0,ty:0,phase:0,squash:1,wave:0};
let parade=[],pointerId=null,lastPtr=null,dragging=0,fireflies=[],butterflies=[];
let cloudOff=0,hillOff=0;

function garden(){return GARDENS[Math.min(gardenIdx,GARDENS.length-1)];}
function unlockedCount(){return Math.max(1,Math.min(5,SAVE.unlocked|0));}
function outingTypes(){const n=Math.min(SPECIES.length,Math.max(MIN_OUTING_TYPES,1+Math.floor(SAVE.outingDone/NEW_SPECIES_EVERY)));return SPECIES.slice(0,n);}
function pickSp(){const p=outingTypes(),sp=p[spawnTypeIdx%p.length];spawnTypeIdx++;return sp;}
function pathTop(){return padT+110;} /* leave room for sky + hills parallax */
function pathBot(){return contentBottom()-118;}
function laneX(i){const topW=W*0.34,botW=W*0.78,tcx=W/2,u=0.55;const w=topW+(botW-topW)*u;return tcx-w/2+w*(i/(PATH_LANES-1));}
function playH(){return pathBot()-pathTop();}
function spotXY(i){const s=PLANT_SPOTS[i];return{x:W*s.x,y:H*s.y};}
function freeSpot(){for(let i=0;i<PLANT_SPOTS.length;i++)if(!SAVE.spotOcc[i])return i;return -1;}
function basketIsFull(){return basket.length>=BASKET_SLOTS;}
function spById(id){return SPECIES.find(s=>s.id===id)||SPECIES[0];}

let ac=null,voices=0;
function ensureAC(){try{ac=ac||new (AudioContext||webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}return ac;}
function tone(f,d,type,v,slide){
  if(muted||quiet||!ensureAC()||voices>=MAX_AUDIO_VOICES)return;
  try{voices++;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),t+d);
    const vol=(v||0.1)*MASTER_GAIN/0.18;g.gain.setValueAtTime(0.001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+0.02);setTimeout(()=>{voices=Math.max(0,voices-1);},d*1000+40);
  }catch(e){voices=Math.max(0,voices-1);}
}
function sfxBloom(){tone(560,0.07,'sine',0.07);setTimeout(()=>tone(720,0.08,'sine',0.06),40);}
function sfxPick(n){const f=420+(n%8)*28;tone(f,0.08,'triangle',0.13);tone(f*1.5,0.06,'sine',0.05);}
function sfxCombo(n){tone(520+Math.min(8,n)*40,0.1,'sine',0.1);}
function sfxFull(){tone(392,0.09,'sine',0.1);setTimeout(()=>tone(523,0.1,'sine',0.09),70);setTimeout(()=>tone(659,0.14,'sine',0.1),140);}
function sfxPlant(){tone(330,0.22,'sine',0.1,720);setTimeout(()=>tone(880,0.16,'sine',0.07),150);}
function sfxMagnet(){tone(280,0.2,'sine',0.08,560);}
function sfxBurst(){tone(640,0.08,'triangle',0.1);setTimeout(()=>tone(880,0.12,'sine',0.09),60);}
function sfxRustle(){tone(170,0.05,'triangle',0.025);}
function sfxUi(){tone(500,0.05,'triangle',0.05);}
function sfxDoor(){tone(240,0.12,'triangle',0.06);setTimeout(()=>tone(180,0.1,'triangle',0.04),80);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){try{ac&&ac.suspend();}catch(e){}if(state===ST.PLAY)state=ST.PAUSED;}else{try{ac&&ac.resume();}catch(e){}}});

function addPetals(x,y,col,n){if(quiet)n=Math.min(n,2);for(let i=0;i<n&&particles.length<MAX_PARTICLES;i++){const a=Math.random()*6.28,sp=50+Math.random()*110;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-50,t:0,life:0.45+Math.random()*0.4,col,r:2.5+Math.random()*3,spin:Math.random()*6});}}
function addSpark(x,y){if(quiet||particles.length>MAX_PARTICLES-4)return;for(let i=0;i<4;i++)particles.push({x,y,vx:(Math.random()-0.5)*80,vy:-40-Math.random()*60,t:0,life:0.35,col:'#fff6a0',r:1.5+Math.random()*2,spark:1});}
function addDust(x,y){if(quiet)return;dust.push({x,y:y+(Math.random()*6-3),vx:-20-Math.random()*30,vy:-10-Math.random()*20,t:0,life:0.35+Math.random()*0.25,r:2+Math.random()*3});if(dust.length>40)dust.shift();}
function launchArc(sp,x,y){arcs.push({sp,x,y,x0:x,y0:y,tx:W/2,ty:contentBottom()-78,u:0,spark:0});}

function onBasketFull(){if(basketFull)return;basketFull=1;scrollPaused=1;worldSp=0;burstLeft=0;magnetLeft=0;cue='Go home!';sfxFull();announce('Basket full');if(!SAVE.taughtPlant){teach=1;teachStep=0;}}
function spawnFlower(opts){
  opts=opts||{};if(scrollPaused&&!opts.force)return null;
  const g=garden(),alive=flowers.filter(f=>!f.picked&&f.state!=='gone').length;if(!opts.force&&alive>=g.max)return null;
  const lane=opts.lane!=null?opts.lane:(Math.random()*PATH_LANES)|0;
  const x=laneX(lane)+(Math.random()*24-12),y=opts.y!=null?opts.y:pathTop()-20-Math.random()*120;
  for(const f of flowers){if(!f.picked&&Math.hypot(f.x-x,f.y-y)<TARGET_SPACING*0.85)return null;}
  const sp=opts.sp||pickSp();
  const f={x,y,lane,sp,state:'blooming',age:0,scale:0.75,picked:0,sway:Math.random()*6.28,hold:g.persist||(gardenIdx===0&&INTRO_BLOOMS_PERSIST)?1e9:SPAWN_HOLD,magnet:!!opts.magnet,id:Math.random().toString(36).slice(2)};
  flowers.push(f);if(!quiet)sfxBloom();return f;
}
function spawnBurstRow(){if(scrollPaused)return;burstLeft=BURST_DUR;worldSp=WORLD_SPEED*BURST_SPEED;sfxBurst();const pool=outingTypes();for(let i=0;i<BURST_COUNT;i++)spawnFlower({force:1,lane:i%PATH_LANES,y:pathTop()-40-i*48,sp:pool[i%pool.length]});}
function spawnMagnet(){if(scrollPaused)return;const f=spawnFlower({force:1,lane:1,y:pathTop()-30,magnet:1,sp:SPECIES[5]});if(f){f.magnet=1;sfxMagnet();}}
function nearestFlower(x,y,rad){let best=null,bd=rad;for(const f of flowers){if(f.picked||(f.state!=='open'&&f.state!=='blooming'&&f.state!=='magnet'))continue;const d=Math.hypot(f.x-x,f.y-y);if(d<bd){bd=d;best=f;}}return best;}
function segmentHits(x0,y0,x1,y1){const hitF=[],steps=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)/12));for(let i=0;i<=steps;i++){const t=i/steps,f=nearestFlower(x0+(x1-x0)*t,y0+(y1-y0)*t,SWEEP_RADIUS);if(f&&!hitF.includes(f))hitF.push(f);}return hitF;}
function doPick(f){
  if(!f||f.picked)return;f.picked=1;f.state='pop';f.popT=0;addPetals(f.x,f.y,f.sp.c0,quiet?2:6);addSpark(f.x,f.y);launchArc(f.sp,f.x,f.y);
  combo++;comboT=COMBO_WINDOW/1000;comboPop=0.45;if(combo>=3){flourishT=0.6;if(combo%3===0)sfxCombo(combo);}
  if(basket.length<BASKET_SLOTS){basket.push(f.sp.id);if(basket.length===BASKET_SLOTS)onBasketFull();}
  else{if(parade.length<TRAIL_MAX)parade.push({sp:f.sp});else{parade.shift();parade.push({sp:f.sp});}}
  if(parade.length<TRAIL_MAX)parade.push({sp:f.sp});sfxPick(combo);
  if(SAVE.album.indexOf(f.sp.id)<0){SAVE.album.push(f.sp.id);save();}
  if(f.magnet){magnetLeft=MAGNET_DUR;sfxMagnet();}
  if(garden().feat==='fan'&&Math.random()<0.3){const pool=outingTypes();for(let i=0;i<3;i++)spawnFlower({force:1,lane:(f.lane+i+1)%PATH_LANES,y:f.y-50-i*20,sp:pool[i%pool.length]});}
  pip.squash=0.82;pip.wave=0.5;save();
}

function openDoor(){door=0;doorDir=1;sfxDoor();}
function closeDoor(){doorDir=-1;sfxDoor();}
function startOuting(idx){
  gardenIdx=Math.max(0,Math.min(unlockedCount()-1,idx|0));returnGarden=-1;peekKeep=0;spawnTypeIdx=0;
  flowers=[];particles=[];arcs=[];dust=[];parade=[];
  if(pendingBasket.length){basket=pendingBasket.slice();pendingBasket=[];}else basket=[];
  basketFull=basket.length>=BASKET_SLOTS?1:0;scrollPaused=basketFull?1:0;
  combo=0;comboT=0;comboPop=0;flourishT=0;cue=basketFull?'Go home!':'';
  worldY=0;worldSp=scrollPaused?0:WORLD_SPEED;burstT=BURST_INTERVAL*0.4;burstLeft=0;magnetT=MAGNET_INTERVAL*0.5;magnetLeft=0;spawnT=0;
  showDemo=gardenIdx===0&&SAVE.baskets===0&&!basket.length?1:0;teach=basketFull&&!SAVE.taughtPlant?1:0;teachStep=0;
  pip.lane=1;pip.x=laneX(1);pip.y=pathBot()-36;pip.tx=pip.x;pip.ty=pip.y;pip.phase=0;pip.squash=1;pip.wave=0;
  fireflies=[];butterflies=[];
  if(garden().feat==='dusk')for(let i=0;i<8;i++)fireflies.push({x:Math.random()*W,y:pathTop()+Math.random()*playH(),p:Math.random()*6});
  if(garden().feat==='fan')for(let i=0;i<3;i++)butterflies.push({x:Math.random()*W,y:pathTop()+40+Math.random()*80,p:Math.random()*6});
  if(!scrollPaused){const pool=outingTypes(),n=Math.max(pool.length,gardenIdx===0?4:3);for(let i=0;i<n;i++)spawnFlower({force:1,lane:i%3,y:pathTop()+30+i*55,sp:pool[i%pool.length]});}
  state=ST.PLAY;announce(garden().name);sfxUi();
}
function resumeOuting(){
  nurseryView='exit';closeDoor();
  if(returnGarden>=0)gardenIdx=returnGarden;
  const keep=peekKeep?pendingBasket.slice():[];peekKeep=0;pendingBasket=keep;basketFull=0;scrollPaused=0;cue='Pick more!';teach=0;
  setTimeout(()=>{startOuting(gardenIdx);cue='Pick more!';door=0;doorDir=0;nurseryView='inside';},320);
}
function enterNursery(mode){
  nurseryMode=mode;nurseryView='enter';openDoor();
  plantAnim=0;plantAnimT=0;plantSpot=-1;celebrateT=0;nurseryChoice=-1;plantBouquet=[];
  if(mode==='plant'){cue='Plant!';if(!SAVE.taughtPlant){teach=1;teachStep=1;}else teach=0;}else{cue='';teach=0;}
  state=ST.NURSERY;announce('Greenhouse');
}
function takeHome(){returnGarden=gardenIdx;peekKeep=0;pendingBasket=basket.slice();enterNursery('plant');}
function peekHome(){returnGarden=gardenIdx;peekKeep=1;pendingBasket=basket.slice();enterNursery('look');}
function visitNurseryFromMenu(){returnGarden=-1;peekKeep=0;pendingBasket=[];basket=[];enterNursery('look');door=1;doorDir=0;nurseryView='inside';}
function doPlantAt(spotIdx){if(nurseryMode!=='plant'||!basket.length||SAVE.spotOcc[spotIdx])return;plantSpot=spotIdx;plantAnim=1;plantAnimT=0;teach=0;plantBouquet=basket.slice();sfxPlant();cue='';}
function finishPlant(){
  const bouquet=plantBouquet.length?plantBouquet.slice():basket.slice(),spot=plantSpot>=0?plantSpot:freeSpot();
  if(spot>=0){SAVE.spotOcc[spot]=bouquet.slice();SAVE.pots.push({mix:bouquet.slice(),garden:gardenIdx,spot});}
  else SAVE.pots.push({mix:bouquet.slice(),garden:gardenIdx,x:0.5,y:0.7});
  SAVE.baskets=(SAVE.baskets|0)+1;SAVE.outingDone=(SAVE.outingDone|0)+1;
  SAVE.gardenBaskets[gardenIdx]=(SAVE.gardenBaskets[gardenIdx]|0)+1;
  if(SAVE.gardenBaskets[gardenIdx]>=OUTINGS_PER_GARDEN&&SAVE.unlocked<gardenIdx+2&&SAVE.unlocked<5)SAVE.unlocked=gardenIdx+2;
  bouquet.forEach(id=>{if(SAVE.album.indexOf(id)<0)SAVE.album.push(id);});SAVE.taughtPlant=1;
  basket=[];pendingBasket=[];basketFull=0;scrollPaused=0;peekKeep=0;plantAnim=0;celebrateT=1.2;nurseryMode='deco';cue='Yay!';
  const p=spotXY(spot>=0?spot:0);addPetals(p.x,p.y-10,'#ff9ad0',quiet?3:10);save();
}

/* ===== art helpers ===== */
function rr(x,y,w,h,r){const a=Math.min(r,w/2,h/2);cx.beginPath();cx.moveTo(x+a,y);cx.arcTo(x+w,y,x+w,y+h,a);cx.arcTo(x+w,y+h,x,y+h,a);cx.arcTo(x,y+h,x,y,a);cx.arcTo(x,y,x+w,y,a);cx.closePath();}
function softShadow(x,y,rx,ry,a){cx.fillStyle=`rgba(40,30,20,${a||0.16})`;cx.beginPath();cx.ellipse(x,y,rx,ry,0,0,7);cx.fill();}
function drawFlower(sp,x,y,s,sway){
  cx.save();cx.translate(x,y);cx.rotate(Math.sin(sway||0)*0.12);cx.scale(s,s);
  cx.strokeStyle='#2f9a48';cx.lineWidth=3;cx.lineCap='round';cx.beginPath();cx.moveTo(0,10);cx.quadraticCurveTo(3,18,0,26);cx.stroke();
  cx.fillStyle='#3db858';cx.beginPath();cx.ellipse(-8,16,7,3.5,-0.7,0,7);cx.fill();cx.beginPath();cx.ellipse(8,17,7,3.5,0.7,0,7);cx.fill();
  if(sp.shape==='tulip'){const g=cx.createLinearGradient(0,-16,0,10);g.addColorStop(0,sp.c2);g.addColorStop(1,sp.c0);cx.fillStyle=g;cx.beginPath();cx.moveTo(0,-16);cx.bezierCurveTo(14,-10,13,8,0,12);cx.bezierCurveTo(-13,8,-14,-10,0,-16);cx.fill();}

  const top=pathTop(),bot=pathBot()+20,tcx=W/2;
  const topW=W*0.30,botW=W*0.84,tl=tcx-topW/2,tr=tcx+topW/2,bl=tcx-botW/2,br=tcx+botW/2;
  // grassy shoulders (start at path edge — hills already drawn above)
  cx.fillStyle=garden().dark?'#163028':'#4aaa58';
  cx.beginPath();cx.moveTo(0,top+4);cx.lineTo(tl,top);cx.lineTo(bl,bot);cx.lineTo(0,H);cx.fill();
  cx.beginPath();cx.moveTo(W,top+4);cx.lineTo(tr,top);cx.lineTo(br,bot);cx.lineTo(W,H);cx.fill();
  // packed-dirt trapezoid
  const dirt=cx.createLinearGradient(0,top,0,bot);dirt.addColorStop(0,DIRT0);dirt.addColorStop(1,DIRT1);
  cx.fillStyle=dirt;cx.beginPath();cx.moveTo(tl,top);cx.lineTo(tr,top);cx.lineTo(br,bot);cx.lineTo(bl,bot);cx.closePath();cx.fill();
  // two worn ruts (pebbly dirt dividers) — keep 3 playable lanes
  function rut(frac){
    const x0=tl+(tr-tl)*frac,x1=bl+(br-bl)*frac;
    cx.strokeStyle=RUT;cx.lineWidth=5;cx.lineCap='round';cx.beginPath();cx.moveTo(x0,top);cx.lineTo(x1,bot);cx.stroke();
    for(let i=0;i<14;i++){const u=(i/14+(worldY*0.0006))%1,x=x0+(x1-x0)*u+(i%2?1.5:-1.5),y=top+(bot-top)*u;cx.fillStyle='#9a8570';cx.beginPath();cx.ellipse(x,y,2.4,1.8,0,0,7);cx.fill();}
  }
  rut(1/3);rut(2/3);
  // decorative flowers on grassy shoulders only
  for(let i=0;i<9;i++){
    const u=(i/9+(worldY*0.00035))%1,y=top+24+(bot-top-40)*u,sc=0.32+u*0.48;
    drawFlower(SPECIES[i%5],tl+(bl-tl)*u-20,y,sc*0.62,i);
    drawFlower(SPECIES[(i+2)%5],tr+(br-tr)*u+20,y,sc*0.62,i+1);

  if(burstLeft>0&&!quiet&&!scrollPaused){cx.strokeStyle=`rgba(255,255,255,${0.2*burstLeft/BURST_DUR})`;cx.lineWidth=2;for(let i=0;i<6;i++){const x=60+i*(W/7);cx.beginPath();cx.moveTo(x,top+20+(i*40+worldY)%playH());cx.lineTo(x,top+45+(i*40+worldY)%playH());cx.stroke();}}

}

function update(dt){
  if(doorDir){door=Math.max(0,Math.min(1,door+doorDir*dt*2.4));if(doorDir>0&&door>=1){door=1;doorDir=0;if(nurseryView==='enter')nurseryView='inside';}if(doorDir<0&&door<=0){door=0;doorDir=0;}}
  if(state===ST.PLAY){
    if(!scrollPaused){worldY+=worldSp*dt;pip.phase+=dt*(burstLeft>0?14:10);}else pip.phase+=dt*4;
    pip.squash+=(1-pip.squash)*Math.min(1,dt*8);if(pip.wave>0)pip.wave=Math.max(0,pip.wave-dt);
    const dx=pip.tx-pip.x,dy=pip.ty-pip.y,d=Math.hypot(dx,dy);
    if(d>2){const step=Math.min(d,PIP_SPEED*dt);pip.x+=dx/d*step;pip.y+=dy/d*step;if(!quiet&&!scrollPaused&&Math.random()<0.35)addDust(pip.x,pip.y+26);}
    pip.y=Math.min(pathBot()-20,Math.max(pathTop()+80,pip.y));
    const scroll=scrollPaused?0:worldSp*dt;
    flowers.forEach(f=>{
      if(f.picked&&f.state==='pop'){f.popT=(f.popT||0)+dt;if(f.popT>0.35)f.state='gone';return;}
      f.y+=scroll;f.sway+=dt;f.age+=dt*1000;
      if(f.state==='blooming'){const u=Math.min(1,f.age/BLOOM_POP_MS);f.scale=0.75+0.35*Math.sin(u*1.4);if(u>=1){f.state=f.magnet?'magnet':'open';f.scale=1;}}
      else if((f.state==='open'||f.state==='magnet')&&f.age>f.hold&&gardenIdx>0){f.state='shut';f.shutT=0;}
      else if(f.state==='shut'){f.shutT=(f.shutT||0)+dt;f.scale=0.12;if(f.shutT>2)f.state='gone';}
      if(f.y>pathBot()+50&&!f.picked)f.state='gone';
      if(magnetLeft>0&&!f.picked&&!scrollPaused){const md=Math.hypot(f.x-pip.x,f.y-pip.y);if(md<MAGNET_RADIUS){f.x+=(pip.x-f.x)*dt*3;f.y+=(pip.y-f.y)*dt*3;if(md<PICK_RADIUS)doPick(f);}}
    });
    flowers=flowers.filter(f=>f.state!=='gone');
    if(!scrollPaused){
      spawnT+=dt*1000;const alive=flowers.filter(f=>!f.picked).length;
      if(spawnT>=(burstLeft>0?SPAWN_INTERVAL*0.45:SPAWN_INTERVAL)&&alive<garden().max+(burstLeft>0?3:0)){spawnT=0;spawnFlower({y:pathTop()-30-Math.random()*80});}
      burstT+=dt*1000;if(burstT>=BURST_INTERVAL){burstT=0;spawnBurstRow();}
      if(burstLeft>0){burstLeft-=dt;if(burstLeft<=0)worldSp=WORLD_SPEED;}
      magnetT+=dt*1000;if(magnetT>=MAGNET_INTERVAL){magnetT=0;spawnMagnet();}if(magnetLeft>0)magnetLeft-=dt;
    }
    if(comboT>0){comboT-=dt;if(comboT<=0){combo=Math.max(0,combo-1);if(combo>0)comboT=COMBO_COOL*0.35;}}
    if(comboPop>0)comboPop=Math.max(0,comboPop-dt*2);if(flourishT>0)flourishT=Math.max(0,flourishT-dt);
    fireflies.forEach(ff=>{ff.y+=scroll*0.3;if(ff.y>pathBot())ff.y=pathTop();});
    butterflies.forEach(b=>{b.x+=Math.sin(performance.now()/800+b.p)*40*dt;b.y+=scroll*0.15;if(b.y>pathBot())b.y=pathTop()+20;});
  }
  if(state===ST.NURSERY){if(plantAnim){plantAnimT+=dt;if(plantAnimT>=0.85)finishPlant();}if(celebrateT>0)celebrateT=Math.max(0,celebrateT-dt);}
  arcs.forEach(a=>{a.u=Math.min(1,a.u+dt*2.4);const e=a.u*a.u*(3-2*a.u);a.x=a.x0+(a.tx-a.x0)*e;a.y=a.y0+(a.ty-a.y0)*e-Math.sin(a.u*Math.PI)*70;if(a.u>0.85&&!a.spark){a.spark=1;addSpark(a.x,a.y);}});
  arcs=arcs.filter(a=>a.u<1);particles.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=140*dt;});particles=particles.filter(p=>p.t<p.life);
  dust.forEach(d=>{d.t+=dt;d.x+=d.vx*dt;d.y+=d.vy*dt;});dust=dust.filter(d=>d.t<d.life);
}

function ptr(e){const t=e.changedTouches?e.changedTouches[0]:e;const r=cv.getBoundingClientRect();const sx=r.width?W/r.width:1,sy=r.height?H/r.height:1;return{x:(t.clientX-r.left)*sx,y:(t.clientY-r.top)*sy,id:t.identifier!=null?t.identifier:'m'};}
function inRect(p,r){return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
function toggleMute(){muted=!muted;SAVE.mute=muted?1:0;save();try{localStorage.setItem(MUTE_K,muted?'1':'0');}catch(e){}sfxUi();}
function toggleQuiet(){quiet=!quiet;SAVE.quiet=quiet?1:0;save();try{localStorage.setItem(QUIET_K,quiet?'1':'0');}catch(e){}sfxUi();}

function onDown(e){
  e.preventDefault();ensureAC();const p=ptr(e);if(pointerId!=null&&p.id!==pointerId)return;pointerId=p.id;lastPtr=p;dragging=0;
  if(inRect(p,hit.mute)){toggleMute();return;}if(inRect(p,hit.quiet)){toggleQuiet();return;}
  if(albumOpen){if(inRect(p,hit.albumClose)){albumOpen=0;sfxUi();}return;}
  if(state===ST.MENU){for(let i=0;i<5;i++)if(inRect(p,hit['g'+i])){startOuting(i);return;}if(inRect(p,hit.nursery)){visitNurseryFromMenu();return;}if(inRect(p,hit.album)){albumOpen=1;sfxUi();return;}return;}
  if(state===ST.PAUSED){if(inRect(p,hit.pause)){state=ST.PLAY;sfxUi();}return;}
  if(state===ST.PLAY){
    if(inRect(p,hit.pause)){state=ST.PAUSED;sfxUi();return;}
    if(inRect(p,hit.home)){if(basketFull)takeHome();else peekHome();return;}
    if(basketFull&&(inRect(p,hit.plant)||inRect(p,hit.basket))){takeHome();return;}
    const f=nearestFlower(p.x,p.y,PICK_RADIUS);if(f){showDemo=0;doPick(f);dragging=1;pip.tx=f.x;pip.ty=Math.min(f.y+20,pathBot()-20);return;}
    if(p.y<pathBot()+10&&p.y>pathTop()){pip.tx=p.x;pip.ty=p.y;sfxRustle();dragging=1;}return;
  }
  if(state===ST.NURSERY){
    if(plantAnim){plantAnimT=1;return;}
    if(inRect(p,hit.gate)){if(nurseryMode==='plant'&&basket.length){cue='Plant!';sfxRustle();return;}resumeOuting();return;}
    if(nurseryMode==='deco'){for(let i=0;i<2;i++)if(inRect(p,hit['deco'+i])){nurseryChoice=i;if(SAVE.decors.indexOf(DECORS[i].id)<0)SAVE.decors.push(DECORS[i].id);save();sfxUi();nurseryMode='look';cue='';}}
    if(nurseryMode==='plant'&&nurseryView==='inside'){for(const s of(hit.spots||[])){if(inRect(p,s)&&!SAVE.spotOcc[s.i]){doPlantAt(s.i);return;}}sfxRustle();}
  }
}
function onMove(e){e.preventDefault();const p=ptr(e);if(pointerId==null||p.id!==pointerId||state!==ST.PLAY||!lastPtr)return;const hits=segmentHits(lastPtr.x,lastPtr.y,p.x,p.y);hits.forEach(f=>doPick(f));if(hits.length||dragging){pip.tx=p.x;pip.ty=Math.min(Math.max(p.y,pathTop()+80),pathBot()-20);dragging=1;}lastPtr=p;}
function onUp(e){e.preventDefault();const p=ptr(e);if(p.id!==pointerId)return;pointerId=null;lastPtr=null;dragging=0;}
cv.addEventListener('pointerdown',onDown,{passive:false});cv.addEventListener('pointermove',onMove,{passive:false});cv.addEventListener('pointerup',onUp,{passive:false});cv.addEventListener('pointercancel',onUp,{passive:false});
addEventListener('touchstart',e=>e.preventDefault(),{passive:false});

let last=performance.now();
function frame(now){const dt=Math.min(DT_CAP,(now-last)/1000);last=now;hit={};update(dt);if(state===ST.MENU)drawMenu();else if(state===ST.NURSERY)drawNursery();else drawPlay();drawChrome();if(albumOpen)drawAlbum();requestAnimationFrame(frame);}
requestAnimationFrame(frame);announce("Haven's Garden "+VER);
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
