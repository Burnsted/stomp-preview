<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7ec8ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Haven's Garden</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#7ec8ff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;position:fixed;inset:0}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
#safeProbe{position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden}
</style>
</head>
<body>
<canvas id="c" aria-label="Haven's Garden"></canvas>
<div id="live" aria-live="polite"></div>
<div id="safeProbe" aria-hidden="true"></div>
<script>
'use strict';
/* ============================================================
   Haven's Garden v0.7 — meadow walk · bouquet · greenhouse grow
   blonde girl · pop-up flowers · plant → water → night → morning
   no-fail · no JPEG embeds · no sleep/cot minigame
   ============================================================ */
const VER='v0.7';
const BASKET_SLOTS=6,PICK_RADIUS=42,TARGET_SPACING=70,SPAWN_INTERVAL=1400,SPAWN_HOLD=14000;
const GIRL_SPEED=160,MAX_FIELD=7,MAX_PARTICLES=90,MAX_AUDIO_VOICES=6,MASTER_GAIN=0.22;
const DPR_CAP=2,DT_CAP=1/20,BLOOM_POP_MS=280,SAFE_UI=90,CYCLES_PER_SIZE=2;
const OUTINGS_PER_GARDEN=2,NEW_SPECIES_EVERY=2,MIN_OUTING_TYPES=3;
const GH_SIZES=[
  {id:'S',beds:4,cols:2,rows:2},
  {id:'M',beds:8,cols:2,rows:4},
  {id:'L',beds:12,cols:2,rows:6}
];
const SKY0='#7ec8ff',SKY1='#c8f0ff',SKY2='#ffe9a0',FAR='#7edc6a',MID='#5ecf5a',GRASS='#6db84a';
const FRAME='#ffffff',GOLD='#d4a017',SOIL='#8B5A2B',OL='#2a2418';
const PANE_DAY='#c5e2f8',PANE_NIGHT='#ffd24a',BUSH='#3d7a38',SLAB='#9aa0a6',CREAM='#f3ebd6',BENCH='#a67c37';

const SPECIES=[
  {id:'daisy',shape:'daisy',c0:'#fff8f0',c1:'#ffd24a',c2:'#ffe9a8'},
  {id:'tulip',shape:'tulip',c0:'#ff7ab0',c1:'#ff3d7a',c2:'#ffb3cc'},
  {id:'bell',shape:'bell',c0:'#c59bff',c1:'#9b6bff',c2:'#e2cfff'},
  {id:'poppy',shape:'daisy',c0:'#ff7a5a',c1:'#e84830',c2:'#ffb0a0'},
  {id:'butter',shape:'daisy',c0:'#ffe566',c1:'#ffc01a',c2:'#fff1a8'},
  {id:'minty',shape:'fan',c0:'#5dffc2',c1:'#1ecf8e',c2:'#b8ffe4'},
  {id:'blush',shape:'tulip',c0:'#ff9ec4',c1:'#ff6aa0',c2:'#ffd0e2'},
  {id:'night',shape:'bell',c0:'#ffd86b',c1:'#ffb000',c2:'#fff0b8'},
  {id:'sky',shape:'daisy',c0:'#8ad4ff',c1:'#3aa8f0',c2:'#c8ebff'},
  {id:'coral',shape:'fan',c0:'#ff9a6b',c1:'#ff6a3a',c2:'#ffd0b8'},
  {id:'lilac',shape:'tulip',c0:'#d4a8ff',c1:'#a86bff',c2:'#ebd4ff'},
  {id:'rainbow',shape:'daisy',c0:'#ff9ad4',c1:'#ffd24a',c2:'#8ad4ff'}
];

const PK='havensGarden.v1',MUTE_K='havensGarden.mute',QUIET_K='havensGarden.quiet';
let SAVE;try{SAVE=JSON.parse(localStorage.getItem(PK)||'null');}catch(e){SAVE=null;}
function freshSave(){return{v:3,unlocked:1,baskets:0,outingDone:0,album:[],pots:[],gardenBaskets:[0,0,0,0,0],mute:0,quiet:0,taughtPlant:0,taughtHow:0,ghSize:0,cycles:0,step:'ready',beds:[]};}
if(!SAVE||!SAVE.gardenBaskets)SAVE=freshSave();
if(SAVE.taughtPlant==null)SAVE.taughtPlant=0;
if(SAVE.taughtHow==null)SAVE.taughtHow=0;
if(SAVE.ghSize==null)SAVE.ghSize=0;
if(SAVE.cycles==null)SAVE.cycles=0;
if(!SAVE.step)SAVE.step='ready';
if(!SAVE.beds)SAVE.beds=[];
function save(){try{localStorage.setItem(PK,JSON.stringify(SAVE));}catch(e){}}
let muted=localStorage.getItem(MUTE_K)==='1'||!!SAVE.mute;
let quiet=localStorage.getItem(QUIET_K)==='1'||!!SAVE.quiet||!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

const cv=document.getElementById('c'),cx=cv.getContext('2d');
const live=document.getElementById('live'),safeProbe=document.getElementById('safeProbe');
let W=390,H=844,dpr=1,padB=SAFE_UI,padT=12,hit={};
function safeInsetBottom(){try{return safeProbe.getBoundingClientRect().height||0;}catch(e){return 0;}}
function viewSize(){
  const vv=window.visualViewport;let w=vv&&vv.width?vv.width:innerWidth,h=vv&&vv.height?vv.height:innerHeight;
  const vvh=parseFloat(new URLSearchParams(location.search).get('vvh')||'');if(vvh>200&&vvh<h)h=vvh;
  return{w:Math.max(280,Math.round(w)),h:Math.max(420,Math.round(h)),ox:vv?vv.offsetLeft||0:0,oy:vv?vv.offsetTop||0:0};
}
function resize(){
  dpr=Math.min(devicePixelRatio||1,DPR_CAP);const vv=viewSize();W=vv.w;H=vv.h;
  padB=Math.max(SAFE_UI,SAFE_UI+safeInsetBottom());padT=12;
  cv.style.left=vv.ox+'px';cv.style.top=vv.oy+'px';cv.style.width=W+'px';cv.style.height=H+'px';
  cv.width=(W*dpr)|0;cv.height=(H*dpr)|0;cx.setTransform(dpr,0,0,dpr,0,0);
}
function contentBottom(){return H-padB;}
addEventListener('resize',resize);
if(window.visualViewport){visualViewport.addEventListener('resize',resize);visualViewport.addEventListener('scroll',resize);}
resize();function announce(t){live.textContent=t;}

const ST={MENU:'MENU',PLAY:'PLAY',NURSERY:'NURSERY',PAUSED:'PAUSED',HOWTO:'HOWTO'};
let state=ST.MENU,gardenIdx=0,returnGarden=-1;
let flowers=[],particles=[],arcs=[],dust=[],confetti=[];
let basket=[],pendingBasket=[],spawnTypeIdx=0;
let spawnT=0,showDemo=1,albumOpen=0,basketFull=0,cue='';
let teach=0,teachStep=0,plantAnim=0,plantAnimT=0,plantSpot=-1,plantBouquet=[];
let nurseryMode='look',nurseryView='inside';
let door=0,doorDir=0,dayNight=0,dayNightT=0,nightAnim=0,nightT=0,growFlash=0;
let party={t:0,kind:''},upgradeAnim=0,upgradeT=0,howtoPage=0;
let girl={x:0,y:0,tx:0,ty:0,phase:0,squash:1,face:1};
let pointerId=null,lastPtr=null,dragging=0,stars=[],cloudOff=0;

function gh(){return GH_SIZES[Math.min(2,SAVE.ghSize|0)];}
function bedCount(){return gh().beds;}
function plantSpots(){
  const g=gh(),spots=[],rows=g.rows,cols=g.cols;
  const y0=g.id==='S'?0.50:0.42,y1=g.id==='S'?0.68:0.78;
  const xL=g.id==='S'?0.36:0.32,xR=g.id==='S'?0.64:0.68;
  for(let r=0;r<rows;r++){const y=rows===1?0.58:y0+(y1-y0)*(r/(rows-1));
    for(let c=0;c<cols;c++)spots.push({x:c?xR:xL,y});}
  return spots;
}
function unlockedCount(){return Math.max(1,Math.min(5,SAVE.unlocked|0));}
function outingTypes(){const n=Math.min(SPECIES.length,Math.max(MIN_OUTING_TYPES,1+Math.floor(SAVE.outingDone/NEW_SPECIES_EVERY)));return SPECIES.slice(0,n);}
function pickSp(){const p=outingTypes(),sp=p[spawnTypeIdx%p.length];spawnTypeIdx++;return sp;}
function fieldTop(){return padT+100;}
function fieldBot(){return contentBottom()-100;}
function spotXY(i){const s=plantSpots()[i];return s?{x:W*s.x,y:H*s.y}:{x:W/2,y:H*0.6};}
function freeSpot(){const n=bedCount();for(let i=0;i<n;i++)if(!SAVE.beds[i])return i;return -1;}
function bedAt(i){return SAVE.beds[i]||null;}
function basketIsFull(){return basket.length>=BASKET_SLOTS;}
function spById(id){return SPECIES.find(s=>s.id===id)||SPECIES[0];}
function allWateredPlanted(){const planted=SAVE.beds.filter(b=>b);return planted.length>0&&planted.every(b=>b.watered);}
function emptyBedsWaiting(){return freeSpot()>=0;}
function nextStepCue(){
  if(SAVE.step==='water')return 'Water!';
  if(SAVE.step==='night')return 'Night…';
  if(SAVE.step==='morning')return 'Yay!';
  if(SAVE.step==='upgrade')return 'Wow!';
  return '';
}

let ac=null,voices=0;
function ensureAC(){try{ac=ac||new (AudioContext||webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}return ac;}
function tone(f,d,type,v,slide){
  if(muted||quiet||!ensureAC()||voices>=MAX_AUDIO_VOICES)return;
  try{voices++;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),t+d);
    const vol=(v||0.1)*MASTER_GAIN/0.18;g.gain.setValueAtTime(0.001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+0.02);setTimeout(()=>{voices=Math.max(0,voices-1);},d*1000+40);
  }catch(e){voices=Math.max(0,voices-1);}
}
function sfxBloom(){tone(560,0.07,'sine',0.07);setTimeout(()=>tone(720,0.08,'sine',0.06),40);}
function sfxPick(n){const f=420+(n%8)*28;tone(f,0.08,'triangle',0.13);tone(f*1.5,0.06,'sine',0.05);}
function sfxFull(){tone(392,0.1,'sine',0.12);setTimeout(()=>tone(523,0.12,'sine',0.11),70);setTimeout(()=>tone(659,0.16,'sine',0.12),140);}
function sfxPlant(){tone(330,0.22,'sine',0.12,720);setTimeout(()=>tone(880,0.18,'sine',0.09),150);}
function sfxWater(){tone(480,0.08,'sine',0.08);setTimeout(()=>tone(620,0.1,'triangle',0.07),40);}
function sfxNight(){tone(260,0.35,'sine',0.07,160);}
function sfxMorning(){tone(523,0.12,'sine',0.12);setTimeout(()=>tone(659,0.14,'sine',0.11),90);setTimeout(()=>tone(784,0.16,'sine',0.1),180);}
function sfxUpgrade(){tone(392,0.12,'sine',0.14);setTimeout(()=>tone(659,0.14,'sine',0.12),120);setTimeout(()=>tone(988,0.22,'sine',0.12),260);}
function sfxRustle(){tone(170,0.05,'triangle',0.025);}
function sfxUi(){tone(500,0.05,'triangle',0.05);}
function sfxDoor(){tone(240,0.12,'triangle',0.07);setTimeout(()=>tone(360,0.14,'sine',0.08),90);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){try{ac&&ac.suspend();}catch(e){}if(state===ST.PLAY)state=ST.PAUSED;}else{try{ac&&ac.resume();}catch(e){}}});

function addPetals(x,y,col,n){if(quiet)n=Math.min(n,2);for(let i=0;i<n&&particles.length<MAX_PARTICLES;i++){const a=Math.random()*6.28,sp=50+Math.random()*110;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-50,t:0,life:0.45+Math.random()*0.4,col,r:2.5+Math.random()*3});}}
function addSpark(x,y){if(quiet||particles.length>MAX_PARTICLES-4)return;for(let i=0;i<5;i++)particles.push({x,y,vx:(Math.random()-0.5)*90,vy:-50-Math.random()*70,t:0,life:0.4,col:'#fff6a0',r:1.5+Math.random()*2.5,spark:1});}
function launchArc(sp,x,y){arcs.push({sp,x,y,x0:x,y0:y,tx:girl.x+18*girl.face,ty:girl.y-28,u:0,spark:0});}
function burstConfetti(n,cx0,cy0){
  if(quiet)n=Math.min(n,8);
  const cols=['#ff7ab0','#ffd24a','#8ad4ff','#5dffc2','#c59bff','#fff'];
  for(let i=0;i<n&&confetti.length<70;i++){const a=-Math.PI/2+(Math.random()-0.5)*2.2,sp=120+Math.random()*200;
    confetti.push({x:cx0+(Math.random()-0.5)*40,y:cy0,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,life:1.0+Math.random()*0.6,col:cols[i%cols.length],r:3+Math.random()*4,rot:Math.random()*6});}
}
function startParty(kind){
  const dur={full:1.8,door:1.4,plant:1.8,water:1.3,night:1.2,morning:2.2,upgrade:2.8}[kind]||1.6;
  party={t:dur,kind};
  burstConfetti(quiet?8:(kind==='upgrade'?40:kind==='morning'?28:18),W/2,H*0.42);
  if(kind==='full')sfxFull();else if(kind==='door')sfxDoor();else if(kind==='plant')sfxPlant();
  else if(kind==='water')sfxWater();else if(kind==='night')sfxNight();else if(kind==='morning')sfxMorning();
  else if(kind==='upgrade')sfxUpgrade();
  announce(kind);
}

function onBasketFull(){if(basketFull)return;basketFull=1;cue='Go home!';startParty('full');}
function spawnFlower(opts){
  opts=opts||{};
  const alive=flowers.filter(f=>!f.picked&&f.state!=='gone').length;if(!opts.force&&alive>=MAX_FIELD)return null;
  const margin=36;
  let x,y,tries=0;
  do{
    x=opts.x!=null?opts.x:margin+Math.random()*(W-margin*2);
    y=opts.y!=null?opts.y:fieldTop()+40+Math.random()*(fieldBot()-fieldTop()-80);
    tries++;
  }while(tries<12&&flowers.some(f=>!f.picked&&Math.hypot(f.x-x,f.y-y)<TARGET_SPACING));
  if(tries>=12&&!opts.force)return null;
  const sp=opts.sp||pickSp();
  const f={x,y,sp,state:'blooming',age:0,scale:0.2,picked:0,sway:Math.random()*6.28,hold:SPAWN_HOLD,id:Math.random().toString(36).slice(2)};
  flowers.push(f);if(!quiet)sfxBloom();return f;
}
function nearestFlower(x,y,rad){let best=null,bd=rad;for(const f of flowers){if(f.picked||(f.state!=='open'&&f.state!=='blooming'))continue;const d=Math.hypot(f.x-x,f.y-y);if(d<bd){bd=d;best=f;}}return best;}
function doPick(f){
  if(!f||f.picked||basketFull)return;
  f.picked=1;f.state='pop';f.popT=0;addPetals(f.x,f.y,f.sp.c0,quiet?2:6);addSpark(f.x,f.y);launchArc(f.sp,f.x,f.y);
  if(basket.length<BASKET_SLOTS){basket.push(f.sp.id);if(basket.length===BASKET_SLOTS)onBasketFull();}
  sfxPick(basket.length);girl.squash=0.88;girl.face=f.x>=girl.x?1:-1;
  if(SAVE.album.indexOf(f.sp.id)<0){SAVE.album.push(f.sp.id);save();}
  save();
}

function openDoor(){door=0;doorDir=1;}
function closeDoor(){doorDir=-1;}
function startOuting(idx){
  gardenIdx=Math.max(0,Math.min(unlockedCount()-1,idx|0));returnGarden=-1;spawnTypeIdx=0;
  flowers=[];particles=[];arcs=[];dust=[];confetti=[];
  if(pendingBasket.length){basket=pendingBasket.slice();pendingBasket=[];}else basket=[];
  basketFull=basket.length>=BASKET_SLOTS?1:0;cue=basketFull?'Go home!':'';dayNight=0;dayNightT=0;nightAnim=0;
  showDemo=!SAVE.taughtHow?1:0;teach=0;teachStep=0;spawnT=0;
  girl.x=W/2;girl.y=(fieldTop()+fieldBot())/2;girl.tx=girl.x;girl.ty=girl.y;girl.phase=0;girl.squash=1;girl.face=1;
  const pool=outingTypes();
  for(let i=0;i<Math.min(5,pool.length+2);i++)spawnFlower({force:1,sp:pool[i%pool.length]});
  state=ST.PLAY;announce('Flower field');sfxUi();
}
function resumeOuting(){
  if(SAVE.step==='water'||SAVE.step==='night'){cue=nextStepCue();sfxRustle();return;}
  nurseryView='exit';closeDoor();
  if(returnGarden>=0)gardenIdx=returnGarden;
  pendingBasket=[];basketFull=0;cue='Pick more!';teach=0;dayNight=0;dayNightT=0;
  setTimeout(()=>{startOuting(gardenIdx);cue=emptyBedsWaiting()?'Fill beds!':'Pick more!';door=0;doorDir=0;nurseryView='inside';},320);
}
function resolveNurseryMode(){
  if(SAVE.step==='water')return 'water';
  if(SAVE.step==='night')return 'night';
  if(SAVE.step==='morning')return 'morning';
  if(SAVE.step==='upgrade')return 'upgrade';
  if(basket.length&&basketIsFull())return 'plant';
  return 'look';
}
function enterNursery(mode){
  nurseryMode=mode||resolveNurseryMode();nurseryView='enter';openDoor();
  plantAnim=0;plantAnimT=0;plantSpot=-1;plantBouquet=[];nightAnim=0;nightT=0;
  if(nurseryMode==='plant'){cue='Plant!';dayNight=0;dayNightT=0;if(!SAVE.taughtPlant){teach=1;teachStep=1;}else teach=0;startParty('door');}
  else if(nurseryMode==='water'){cue='Water!';dayNight=0.2;dayNightT=0.2;teach=0;startParty('door');}
  else if(nurseryMode==='night'){cue='Night…';dayNight=dayNight||0.5;teach=0;}
  else{cue=nextStepCue();teach=0;if(mode!=='look')startParty('door');}
  state=ST.NURSERY;announce('Greenhouse');
}
function takeHome(){returnGarden=gardenIdx;pendingBasket=basket.slice();
  if(SAVE.step==='water'||SAVE.step==='night')enterNursery(SAVE.step);else enterNursery('plant');
}
function peekHome(){returnGarden=gardenIdx;pendingBasket=basket.slice();enterNursery(resolveNurseryMode());}
function visitNurseryFromMenu(){returnGarden=-1;pendingBasket=[];basket=[];enterNursery(resolveNurseryMode());door=1;doorDir=0;nurseryView='inside';}

function doPlantAt(spotIdx){
  if(nurseryMode!=='plant'||!basket.length||bedAt(spotIdx))return;
  plantSpot=spotIdx;plantAnim=1;plantAnimT=0;teach=0;plantBouquet=basket.slice();cue='';
}
function finishPlant(){
  const bouquet=plantBouquet.length?plantBouquet.slice():basket.slice(),spot=plantSpot>=0?plantSpot:freeSpot();
  if(spot>=0){SAVE.beds[spot]={mix:bouquet.slice(),watered:0,grown:0,squash:1};SAVE.pots.push({mix:bouquet.slice(),garden:gardenIdx,spot});}
  SAVE.baskets=(SAVE.baskets|0)+1;SAVE.outingDone=(SAVE.outingDone|0)+1;
  SAVE.gardenBaskets[gardenIdx]=(SAVE.gardenBaskets[gardenIdx]|0)+1;
  if(SAVE.gardenBaskets[gardenIdx]>=OUTINGS_PER_GARDEN&&SAVE.unlocked<gardenIdx+2&&SAVE.unlocked<5)SAVE.unlocked=gardenIdx+2;
  bouquet.forEach(id=>{if(SAVE.album.indexOf(id)<0)SAVE.album.push(id);});SAVE.taughtPlant=1;
  basket=[];pendingBasket=[];basketFull=0;plantAnim=0;
  SAVE.step='water';nurseryMode='water';cue='Water!';dayNightT=0.25;
  const p=spotXY(spot>=0?spot:0);addPetals(p.x,p.y-10,'#ff9ad0',quiet?4:12);startParty('plant');save();
}
function doWaterAt(spotIdx){
  const b=bedAt(spotIdx);if(nurseryMode!=='water'||!b||b.watered)return;
  b.watered=1;b.squash=0.78;addSpark(spotXY(spotIdx).x,spotXY(spotIdx).y-8);addPetals(spotXY(spotIdx).x,spotXY(spotIdx).y,'#8ad4ff',quiet?3:8);
  startParty('water');cue='Water!';
  if(allWateredPlanted()){SAVE.step='night';nurseryMode='night';cue='Night…';beginNight();}
  save();
}
function beginNight(){
  if(nightAnim)return;
  nightAnim=1;nightT=0;dayNightT=1;cue='Night…';sfxNight();startParty('night');
}
function finishNight(){
  nightAnim=0;SAVE.beds.forEach(b=>{if(b&&b.watered){b.grown=Math.min(2,(b.grown|0)+1);b.squash=1.15;}});
  SAVE.cycles=(SAVE.cycles|0)+1;SAVE.step='morning';nurseryMode='morning';cue='Yay!';dayNightT=0;growFlash=1;
  startParty('morning');
  if(SAVE.cycles>=CYCLES_PER_SIZE&&SAVE.ghSize<2){setTimeout(()=>doUpgrade(),900);}
  else{setTimeout(()=>{SAVE.step='ready';nurseryMode='ready';cue='Pick more!';save();},1600);}
  save();
}
function doUpgrade(){
  SAVE.ghSize=Math.min(2,(SAVE.ghSize|0)+1);SAVE.cycles=0;
  SAVE.step='upgrade';nurseryMode='upgrade';upgradeAnim=1;upgradeT=0;cue='Wow!';
  startParty('upgrade');growFlash=1;save();
  setTimeout(()=>{SAVE.step='ready';nurseryMode='ready';cue='Pick more!';upgradeAnim=0;save();},2600);
}

/* ===== art ===== */
function rr(x,y,w,h,r){const a=Math.min(r,w/2,h/2);cx.beginPath();cx.moveTo(x+a,y);cx.arcTo(x+w,y,x+w,y+h,a);cx.arcTo(x+w,y+h,x,y+h,a);cx.arcTo(x,y+h,x,y,a);cx.arcTo(x,y,x+w,y,a);cx.closePath();}
function softShadow(x,y,rx,ry,a){cx.fillStyle=`rgba(40,30,20,${a||0.16})`;cx.beginPath();cx.ellipse(x,y,rx,ry,0,0,7);cx.fill();}
function drawFlower(sp,x,y,s,sway){
  cx.save();cx.translate(x,y);cx.rotate(Math.sin(sway||0)*0.12);cx.scale(s,s);
  cx.strokeStyle='#2f9a48';cx.lineWidth=3;cx.lineCap='round';cx.beginPath();cx.moveTo(0,10);cx.quadraticCurveTo(3,18,0,26);cx.stroke();
  cx.fillStyle='#3db858';cx.beginPath();cx.ellipse(-8,16,7,3.5,-0.7,0,7);cx.fill();cx.beginPath();cx.ellipse(8,17,7,3.5,0.7,0,7);cx.fill();

function drawFlatHouse(sz,doorOpen,night){

  fillStrokeRect(bx-6,by+bodyH,totalW+12,12,SLAB);
  for(let side=-1;side<=1;side+=2){
    if(!wings)break;
    const wx=side<0?bx:bx+centerW+wingW;
    cx.fillStyle='#ffffff';cx.beginPath();
    if(side<0){cx.moveTo(wx,by+4);cx.lineTo(wx+wingW,by-6);cx.lineTo(wx+wingW,by);cx.lineTo(wx,by+8);}
    else{cx.moveTo(wx,by-6);cx.lineTo(wx+wingW,by+4);cx.lineTo(wx+wingW,by+8);cx.lineTo(wx,by);}

  glassPane(cx0+bayW+doorW+1,by+(hasT?tH:0)+2,bayW-3,bodyH-(hasT?tH:0)-4,pc,1);

function update(dt){
  if(doorDir){door=Math.max(0,Math.min(1,door+doorDir*dt*2.2));if(doorDir>0&&door>=1){door=1;doorDir=0;if(nurseryView==='enter')nurseryView='inside';}if(doorDir<0&&door<=0){door=0;doorDir=0;}}
  dayNight+=(dayNightT-dayNight)*Math.min(1,dt*0.9);
  if(party.t>0)party.t=Math.max(0,party.t-dt);
  if(growFlash>0)growFlash=Math.max(0,growFlash-dt*0.8);
  if(upgradeAnim)upgradeT+=dt;
  confetti.forEach(c=>{c.t+=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.vy+=280*dt;c.rot+=dt*3;});confetti=confetti.filter(c=>c.t<c.life);
  if(state===ST.PLAY){
    girl.phase+=dt*(dragging?10:6);girl.squash+=(1-girl.squash)*Math.min(1,dt*8);
    const dx=girl.tx-girl.x,dy=girl.ty-girl.y,d=Math.hypot(dx,dy);
    if(d>3){const step=Math.min(d,GIRL_SPEED*dt);girl.x+=dx/d*step;girl.y+=dy/d*step;girl.face=dx>=0?1:-1;}
    girl.y=Math.min(fieldBot()-10,Math.max(fieldTop()+50,girl.y));
    girl.x=Math.min(W-30,Math.max(30,girl.x));
    flowers.forEach(f=>{
      if(f.picked&&f.state==='pop'){f.popT=(f.popT||0)+dt;if(f.popT>0.35)f.state='gone';return;}
      f.sway+=dt;f.age+=dt*1000;
      if(f.state==='blooming'){const u=Math.min(1,f.age/BLOOM_POP_MS);f.scale=0.2+0.8*u;if(u>=1){f.state='open';f.scale=1;}}
      else if(f.state==='open'&&f.age>f.hold){f.state='shut';f.shutT=0;}
      else if(f.state==='shut'){f.shutT=(f.shutT||0)+dt;f.scale=Math.max(0.05,1-f.shutT);if(f.shutT>1.2)f.state='gone';}
    });
    flowers=flowers.filter(f=>f.state!=='gone');
    if(!basketFull){
      spawnT+=dt*1000;const alive=flowers.filter(f=>!f.picked).length;
      if(spawnT>=SPAWN_INTERVAL&&alive<MAX_FIELD){spawnT=0;spawnFlower({});}
    }
  }
  if(state===ST.NURSERY){
    if(plantAnim){plantAnimT+=dt;if(plantAnimT>=0.85)finishPlant();}
    if(nightAnim){nightT+=dt;dayNightT=1;if(nightT>=2.0)finishNight();}
  }
  arcs.forEach(a=>{a.tx=girl.x+18*girl.face;a.ty=girl.y-28;a.u=Math.min(1,a.u+dt*2.6);const e=a.u*a.u*(3-2*a.u);a.x=a.x0+(a.tx-a.x0)*e;a.y=a.y0+(a.ty-a.y0)*e-Math.sin(a.u*Math.PI)*60;if(a.u>0.85&&!a.spark){a.spark=1;addSpark(a.x,a.y);}});
  arcs=arcs.filter(a=>a.u<1);particles.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=140*dt;});particles=particles.filter(p=>p.t<p.life);
}

function ptr(e){const t=e.changedTouches?e.changedTouches[0]:e;const r=cv.getBoundingClientRect();const sx=r.width?W/r.width:1,sy=r.height?H/r.height:1;return{x:(t.clientX-r.left)*sx,y:(t.clientY-r.top)*sy,id:t.identifier!=null?t.identifier:'m'};}
function inRect(p,r){return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
function toggleMute(){muted=!muted;SAVE.mute=muted?1:0;save();try{localStorage.setItem(MUTE_K,muted?'1':'0');}catch(e){}sfxUi();}
function toggleQuiet(){quiet=!quiet;SAVE.quiet=quiet?1:0;save();try{localStorage.setItem(QUIET_K,quiet?'1':'0');}catch(e){}sfxUi();}

function onDown(e){
  e.preventDefault();ensureAC();const p=ptr(e);if(pointerId!=null&&p.id!==pointerId)return;pointerId=p.id;lastPtr=p;dragging=0;
  if(inRect(p,hit.mute)){toggleMute();return;}if(inRect(p,hit.quiet)){toggleQuiet();return;}
  if(albumOpen){if(inRect(p,hit.albumClose)){albumOpen=0;sfxUi();}return;}
  if(state===ST.HOWTO){if(inRect(p,hit.howto)){howtoPage++;if(howtoPage>=6){SAVE.taughtHow=1;save();howtoPage=0;startOuting(0);}sfxUi();}return;}
  if(state===ST.MENU){
    if(inRect(p,hit.play)){if(!SAVE.taughtHow){state=ST.HOWTO;howtoPage=0;sfxUi();}else startOuting(0);return;}
    if(inRect(p,hit.nursery)){visitNurseryFromMenu();return;}
    if(inRect(p,hit.howtoBtn)){state=ST.HOWTO;howtoPage=0;sfxUi();return;}
    return;
  }
  if(state===ST.PAUSED){if(inRect(p,hit.pause)){state=ST.PLAY;sfxUi();}return;}
  if(state===ST.PLAY){
    if(inRect(p,hit.pause)){state=ST.PAUSED;sfxUi();return;}
    if(inRect(p,hit.home)){if(basketFull)takeHome();else peekHome();return;}
    if(basketFull&&(inRect(p,hit.plant)||inRect(p,hit.basket))){takeHome();return;}
    const f=nearestFlower(p.x,p.y,PICK_RADIUS);if(f){showDemo=0;doPick(f);dragging=1;girl.tx=f.x;girl.ty=Math.min(f.y+10,fieldBot()-10);return;}
    if(p.y<fieldBot()+10&&p.y>fieldTop()){girl.tx=p.x;girl.ty=p.y;sfxRustle();dragging=1;}return;
  }
  if(state===ST.NURSERY){
    if(plantAnim||nightAnim||upgradeAnim)return;
    if(inRect(p,hit.gate)){
      if(nurseryMode==='plant'&&basket.length){cue='Plant!';sfxRustle();return;}
      if(nurseryMode==='water'||nurseryMode==='night'){cue=nextStepCue();sfxRustle();return;}
      resumeOuting();return;
    }
    if(nurseryMode==='water'){for(const s of(hit.spots||[])){if(inRect(p,s)){doWaterAt(s.i);return;}}sfxRustle();return;}
    if(nurseryMode==='plant'&&nurseryView==='inside'){for(const s of(hit.spots||[])){if(inRect(p,s)&&!bedAt(s.i)){doPlantAt(s.i);return;}}sfxRustle();}
  }
}
function onMove(e){
  e.preventDefault();const p=ptr(e);if(pointerId==null||p.id!==pointerId||state!==ST.PLAY||!lastPtr)return;
  /* gentle sweep-pick nearby flowers while dragging */
  const f=nearestFlower(p.x,p.y,PICK_RADIUS*0.9);if(f)doPick(f);
  if(dragging||f){girl.tx=p.x;girl.ty=Math.min(Math.max(p.y,fieldTop()+50),fieldBot()-10);dragging=1;}
  lastPtr=p;
}
function onUp(e){e.preventDefault();const p=ptr(e);if(p.id!==pointerId)return;pointerId=null;lastPtr=null;dragging=0;}
cv.addEventListener('pointerdown',onDown,{passive:false});cv.addEventListener('pointermove',onMove,{passive:false});cv.addEventListener('pointerup',onUp,{passive:false});cv.addEventListener('pointercancel',onUp,{passive:false});
addEventListener('touchstart',e=>e.preventDefault(),{passive:false});

let last=performance.now();
function frame(now){const dt=Math.min(DT_CAP,(now-last)/1000);last=now;hit={};update(dt);cx.fillStyle=SKY0;cx.fillRect(0,0,W,H);if(state===ST.MENU)drawMenu();else if(state===ST.HOWTO)drawHowTo();else if(state===ST.NURSERY)drawNursery();else drawPlay();drawChrome();if(albumOpen)drawAlbum();requestAnimationFrame(frame);}
requestAnimationFrame(frame);announce("Haven's Garden "+VER);
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
