<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7cb87a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Haven's Garden</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#e8f0d8;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;position:fixed;inset:0}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
#safeProbe{position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden}
</style>
</head>
<body>
<canvas id="c" aria-label="Haven's Garden"></canvas>
<div id="live" aria-live="polite"></div>
<div id="safeProbe" aria-hidden="true"></div>
<script>
'use strict';
/* ============================================================
   Haven's Garden v0.1 — pick · parade · plant (no fail)
   Tiny felt-paper garden for Haven (4–5). Original IP only.
   Safe-bottom UI: visualViewport + safe-area-inset + ≥90px pad
   ============================================================ */

/* ---- knobs (tune feel here) ---- */
const VER='v0.1';
const BASKET_SLOTS=6;
const PICK_RADIUS=34;          // ≥64 CSS px diameter
const TARGET_SPACING=80;
const SPAWN_INTERVAL=900;
const SPAWN_HOLD=8000;         // garden>1: sway shut after dwell
const INTRO_BLOOMS_PERSIST=true;
const ACTIVE_FLOWERS=4;
const CART_SPEED=220;
const SWEEP_RADIUS=32;
const TRAIL_MAX=12;
const OUTINGS_PER_GARDEN=2;
const NEW_SPECIES_EVERY=2;
const MAX_PARTICLES=90;
const MAX_AUDIO_VOICES=4;
const MASTER_GAIN=0.18;
const DPR_CAP=2;
const DT_CAP=1/20;
const BURST_INTERVAL=7800;     // speed-burst cadence
const BURST_COUNT=5;           // flowers that pop at once
const BURST_SPREAD=110;
const PARADE_FLOURISH_MS=700;  // 3 quick picks window
const BLOOM_POP_MS=220;
const SAFE_UI=90;

const C={
  cream:'#f7f1e4',ink:'#3a342c',soft:'#6b6258',
  grass0:'#9ecf7a',grass1:'#7cb87a',grass2:'#5a9a62',
  dirt:'#c4a882',pot:'#c47a52',leaf:'#4f8f4a',
  sky0:'#d8ecf8',sky1:'#b8dce8',panel:'rgba(247,241,228,.92)',
  white:'#fff',gold:'#e8b84a',pink:'#e89ab0',coral:'#e87a6a',
  lavender:'#b89ad4',mint:'#7ecfb0',butter:'#f0d878',rose:'#e87898'
};

/* 12 original stickers — distinct silhouettes, not color-only goals */
const SPECIES=[
  {id:'daisy',name:'Sunny Daisy',shape:'daisy',cols:['#fff8e8','#f0d878']},
  {id:'tulip',name:'Cup Tulip',shape:'tulip',cols:['#e87898','#c45a72']},
  {id:'bell',name:'Soft Bell',shape:'bell',cols:['#b89ad4','#8a6ab0']},
  {id:'poppy',name:'Round Poppy',shape:'daisy',cols:['#e87a6a','#c45a4a']},
  {id:'butter',name:'Butter Bloom',shape:'daisy',cols:['#f0d878','#e0b84a']},
  {id:'minty',name:'Mint Fan',shape:'fan',cols:['#7ecfb0','#4a9a82']},
  {id:'blush',name:'Blush Cup',shape:'tulip',cols:['#e89ab0','#d47890']},
  {id:'night',name:'Lantern Bell',shape:'bell',cols:['#f0d878','#e8a030']},
  {id:'sky',name:'Sky Daisy',shape:'daisy',cols:['#a8d4f0','#6a9ec8']},
  {id:'coral',name:'Coral Fan',shape:'fan',cols:['#e89a78','#c46a4a']},
  {id:'lilac',name:'Lilac Cup',shape:'tulip',cols:['#c8a8e0','#9878c0']},
  {id:'rainbow',name:'Rainbow Ring',shape:'daisy',cols:['#e89ab0','#f0d878']}
];

const GARDENS=[
  {id:'sunny',name:'Sunny Patch',sky:['#d8ecf8','#c8e8b8'],grass:['#a8d878','#7cb87a'],tint:'#f0d878',maxBloom:4,persist:true,feat:'stable'},
  {id:'puddle',name:'Puddle Meadow',sky:['#c8e0f0','#a8d0c8'],grass:['#7cbc78','#5a9a62'],tint:'#6ab0c8',maxBloom:4,persist:false,feat:'puddles'},
  {id:'butterfly',name:'Butterfly Bend',sky:['#e0d8f0','#d0e8c8'],grass:['#8cc878','#6aaa62'],tint:'#e89ab0',maxBloom:5,persist:false,feat:'fan'},
  {id:'lantern',name:'Lantern Garden',sky:['#3a4060','#6a5080'],grass:['#3a6048','#2a4838'],tint:'#f0d878',maxBloom:4,persist:false,feat:'dusk',dark:1},
  {id:'rainbow',name:'Rainbow Greenhouse',sky:['#d8f0f8','#f0d8e8'],grass:['#9ecf7a','#7cb87a'],tint:'#e89ab0',maxBloom:5,persist:false,feat:'curve'}
];

const DECORS=[
  {id:'bench',label:'Bench'},{id:'arch',label:'Arch'},
  {id:'can',label:'Water Can'},{id:'shelf',label:'Shelf'}
];

const PK='havensGarden.v1', MUTE_K='havensGarden.mute', QUIET_K='havensGarden.quiet';
let SAVE; try{SAVE=JSON.parse(localStorage.getItem(PK)||'null');}catch(e){SAVE=null;}
function freshSave(){
  return{v:1,unlocked:1,baskets:0,outingDone:0,album:[],pots:[],decors:[],gardenBaskets:[0,0,0,0,0],mute:0,quiet:0};
}
if(!SAVE||SAVE.v!==1) SAVE=freshSave();
function save(){try{localStorage.setItem(PK,JSON.stringify(SAVE));}catch(e){}}
let muted=localStorage.getItem(MUTE_K)==='1'||!!SAVE.mute;
let quiet=localStorage.getItem(QUIET_K)==='1'||!!SAVE.quiet||
  !!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

const cv=document.getElementById('c'),cx=cv.getContext('2d');
const live=document.getElementById('live');
const safeProbe=document.getElementById('safeProbe');
let W=390,H=844,dpr=1,padB=SAFE_UI,padT=12,hit={};

function safeInsetBottom(){try{return safeProbe.getBoundingClientRect().height||0;}catch(e){return 0;}}
function viewSize(){
  const vv=window.visualViewport;
  let w=vv&&vv.width?vv.width:innerWidth;
  let h=vv&&vv.height?vv.height:innerHeight;
  const q=new URLSearchParams(location.search);
  const vvh=parseFloat(q.get('vvh')||'');
  if(vvh>200&&vvh<h) h=vvh;
  return{w:Math.max(280,Math.round(w)),h:Math.max(420,Math.round(h)),ox:vv?vv.offsetLeft||0:0,oy:vv?vv.offsetTop||0:0};
}
function resize(){
  dpr=Math.min(devicePixelRatio||1,DPR_CAP);
  const vv=viewSize();
  W=vv.w; H=vv.h;
  padB=Math.max(SAFE_UI,SAFE_UI+safeInsetBottom());
  padT=12;
  cv.style.left=vv.ox+'px'; cv.style.top=vv.oy+'px';
  cv.style.width=W+'px'; cv.style.height=H+'px';
  cv.width=(W*dpr)|0; cv.height=(H*dpr)|0;
  cx.setTransform(dpr,0,0,dpr,0,0);
}
function contentBottom(){return H-padB;}
addEventListener('resize',resize);
if(window.visualViewport){
  visualViewport.addEventListener('resize',resize);
  visualViewport.addEventListener('scroll',resize);
}
resize();
function announce(t){live.textContent=t;}

/* ---- state machine (never GAME_OVER) ---- */
const ST={MENU:'MENU',PLAY:'PLAY',NURSERY:'NURSERY',PAUSED:'PAUSED'};
let state=ST.MENU, gardenIdx=0, prevState=ST.MENU;

/* play field */
let flowers=[], particles=[], cart={x:0,y:0,tx:0,ty:0}, parade=[];
let basket=[], basketPulse=0, plantSkip=0, planting=0, plantT=0;
let spawnT=0, burstT=0, demoT=0, showDemo=1, fingerDemo={x:0,y:0,a:1};
let quickPicks=[], flourishT=0, grassWiggles=[], puddleRings=[];
let butterfly={x:0,y:0,tx:0,ty:0,on:0};
let nurseryChoice=-1, albumOpen=0, menuPage=0;
let pointerId=null, lastPtr=null, dragging=0;
let fireflies=[];

function fieldRect(){
  const top=padT+56, bot=contentBottom()-118;
  return{x:28,y:top,w:W-56,h:Math.max(180,bot-top)};
}
function garden(){return GARDENS[Math.min(gardenIdx,GARDENS.length-1)];}
function unlockedCount(){return Math.max(1,Math.min(5,SAVE.unlocked|0));}
function speciesForOuting(){
  const n=Math.min(SPECIES.length,1+Math.floor(SAVE.outingDone/NEW_SPECIES_EVERY));
  return SPECIES.slice(0,Math.max(1,n));
}
function nextNewSpecies(){
  const n=Math.min(SPECIES.length,1+Math.floor(SAVE.outingDone/NEW_SPECIES_EVERY));
  return n<SPECIES.length?SPECIES[n]:null;
}

/* ---- audio (unlock on first tap) ---- */
let ac=null, voices=0;
function ensureAC(){
  try{ac=ac||new (AudioContext||webkitAudioContext)(); if(ac.state==='suspended')ac.resume();}catch(e){}
  return ac;
}
function tone(f,d,type,v,slide){
  if(muted||quiet||!ensureAC()||voices>=MAX_AUDIO_VOICES)return;
  try{
    voices++;
    const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),t+d);
    const vol=(v||0.1)*MASTER_GAIN/0.18;
    g.gain.setValueAtTime(0.001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d+0.02);
    setTimeout(()=>{voices=Math.max(0,voices-1);},d*1000+40);
  }catch(e){voices=Math.max(0,voices-1);}
}
function sfxBloom(){tone(520,0.08,'sine',0.08); setTimeout(()=>tone(660,0.1,'sine',0.07),50);}
function sfxPick(i){const base=380+((i*37)%90); tone(base,0.09,'triangle',0.14); tone(base*1.5,0.07,'sine',0.06);}
function sfxSweep(n){const notes=[392,440,494]; tone(notes[n%3],0.07,'triangle',0.1);}
function sfxSlot(){tone(280,0.05,'square',0.05);}
function sfxFull(){tone(392,0.1,'sine',0.1); setTimeout(()=>tone(494,0.1,'sine',0.09),80); setTimeout(()=>tone(587,0.14,'sine',0.1),160);}
function sfxPlant(){tone(330,0.2,'sine',0.1,660); setTimeout(()=>tone(880,0.18,'sine',0.08),160);}
function sfxRustle(){tone(180,0.06,'triangle',0.03);}
function sfxFlourish(){tone(523,0.08,'sine',0.1); setTimeout(()=>tone(659,0.08,'sine',0.09),70); setTimeout(()=>tone(784,0.12,'sine',0.1),140);}
function sfxUi(){tone(480,0.06,'triangle',0.06);}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){try{ac&&ac.suspend();}catch(e){} if(state===ST.PLAY){prevState=state; state=ST.PAUSED;}}
  else{try{ac&&ac.resume();}catch(e){}}
});

/* ---- particles ---- */
function addPetals(x,y,col,n){
  if(quiet) n=Math.min(n,2);
  for(let i=0;i<n&&particles.length<MAX_PARTICLES;i++){
    const a=Math.random()*Math.PI*2, sp=40+Math.random()*90;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,life:0.5+Math.random()*0.4,t:0,col,r:3+Math.random()*3});
  }
}
function addWiggle(x,y){grassWiggles.push({x,y,t:0}); if(grassWiggles.length>12)grassWiggles.shift();}
function addRing(x,y){puddleRings.push({x,y,t:0,r:8}); if(puddleRings.length>8)puddleRings.shift();}

/* ---- flowers ---- */
function dist(a,b){const dx=a.x-b.x,dy=a.y-b.y; return Math.hypot(dx,dy);}
function canPlace(x,y,list){
  const fr=fieldRect();
  if(x<fr.x+30||x>fr.x+fr.w-30||y<fr.y+36||y>fr.y+fr.h-30) return false;
  for(const f of list) if(dist({x,y},f)<TARGET_SPACING) return false;
  // keep clear of bottom UI / cart start
  if(y>contentBottom()-140) return false;
  return true;
}
function pickSpecies(){
  const pool=speciesForOuting();
  return pool[(Math.random()*pool.length)|0];
}
function spawnOne(forced, burst){
  const g=garden();
  const alive=flowers.filter(f=>f.state==='open'||f.state==='blooming');
  if(!forced&&alive.length>=(burst?g.maxBloom+2:g.maxBloom)) return null;
  const fr=fieldRect();
  let x,y,ok=0;
  for(let tries=0;tries<24;tries++){
    x=fr.x+40+Math.random()*(fr.w-80);
    y=fr.y+50+Math.random()*(fr.h-90);
    if(canPlace(x,y,flowers)){ok=1; break;}
  }
  if(!ok&&!forced) return null;
  if(!ok){x=fr.x+fr.w*0.5; y=fr.y+fr.h*0.45;}
  const sp=pickSpecies();
  const f={
    x,y,sp,state:'blooming',age:0,scale:0.8,picked:0,
    sway:Math.random()*Math.PI*2, hold:g.persist||(gardenIdx===0&&INTRO_BLOOMS_PERSIST)?1e9:SPAWN_HOLD,
    id:Math.random().toString(36).slice(2)
  };
  flowers.push(f);
  if(!quiet) sfxBloom();
  return f;
}
function spawnBurst(){
  const fr=fieldRect();
  const cx0=fr.x+60+Math.random()*(fr.w-120);
  const cy0=fr.y+60+Math.random()*(fr.h-120);
  let n=0;
  for(let i=0;i<BURST_COUNT;i++){
    const a=(i/BURST_COUNT)*Math.PI*2+Math.random()*0.3;
    const r=30+Math.random()*BURST_SPREAD*0.35;
    const x=cx0+Math.cos(a)*r, y=cy0+Math.sin(a)*r;
    if(!canPlace(x,y,flowers)) continue;
    const sp=pickSpecies();
    flowers.push({
      x,y,sp,state:'blooming',age:0,scale:0.75,picked:0,
      sway:Math.random()*Math.PI*2,
      hold:garden().persist||gardenIdx===0?1e9:SPAWN_HOLD*0.7,
      id:Math.random().toString(36).slice(2),burst:1
    });
    n++;
  }
  if(n) sfxFlourish();
}
function nearestFlower(x,y,rad){
  let best=null,bd=rad;
  for(const f of flowers){
    if(f.state!=='open'&&f.state!=='blooming') continue;
    if(f.picked) continue;
    const d=Math.hypot(f.x-x,f.y-y);
    if(d<bd){bd=d; best=f;}
  }
  return best;
}
function segmentHits(x0,y0,x1,y1){
  const hitF=[];
  const steps=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)/12));
  for(let i=0;i<=steps;i++){
    const t=i/steps, x=x0+(x1-x0)*t, y=y0+(y1-y0)*t;
    const f=nearestFlower(x,y,SWEEP_RADIUS);
    if(f&&!hitF.includes(f)) hitF.push(f);
  }
  return hitF;
}

function doPick(f,sweepIdx){
  if(!f||f.picked) return;
  f.picked=1; f.state='pop'; f.popT=0;
  addPetals(f.x,f.y,f.sp.cols[0],quiet?2:5);
  const now=performance.now();
  quickPicks.push(now);
  quickPicks=quickPicks.filter(t=>now-t<PARADE_FLOURISH_MS);
  if(quickPicks.length>=3){flourishT=0.55; sfxFlourish(); quickPicks=[];}

  if(basket.length<BASKET_SLOTS){
    basket.push(f.sp.id);
    sfxSlot();
    if(basket.length===BASKET_SLOTS){basketPulse=1; sfxFull(); announce('Basket full — tap to plant');}
  } else {
    // extra → decorative parade petal, no fail / no block
    parade.push({sp:f.sp,life:1,ornament:1});
  }
  // parade trail flower
  if(parade.length<TRAIL_MAX) parade.push({sp:f.sp,life:1});
  else{parade.shift(); parade.push({sp:f.sp,life:1});}

  cart.tx=f.x; cart.ty=f.y;
  if(sweepIdx!=null) sfxSweep(sweepIdx); else sfxPick(basket.length);
  // album stamp
  if(SAVE.album.indexOf(f.sp.id)<0){SAVE.album.push(f.sp.id); save();}
  // butterfly garden: fan of three nearby
  if(garden().feat==='fan'&&Math.random()<0.35){
    for(let i=0;i<3;i++){
      const a=i*2.1, x=f.x+Math.cos(a)*72, y=f.y+Math.sin(a)*56;
      if(canPlace(x,y,flowers)){
        const sp=pickSpecies();
        flowers.push({x,y,sp,state:'blooming',age:0,scale:0.7,picked:0,sway:0,hold:SPAWN_HOLD,id:Math.random().toString(36).slice(2)});
      }
    }
  }
  save();
}

/* ---- outing lifecycle ---- */
function startOuting(idx){
  gardenIdx=Math.max(0,Math.min(unlockedCount()-1,idx|0));
  flowers=[]; particles=[]; parade=[]; basket=[]; basketPulse=0;
  planting=0; plantT=0; plantSkip=0;
  spawnT=0; burstT=BURST_INTERVAL*0.35; demoT=0; showDemo=gardenIdx===0&&SAVE.baskets===0?1:0;
  quickPicks=[]; flourishT=0; grassWiggles=[]; puddleRings=[];
  const fr=fieldRect();
  cart.x=fr.x+50; cart.y=fr.y+fr.h-40; cart.tx=cart.x; cart.ty=cart.y;
  butterfly={x:fr.x+fr.w*0.7,y:fr.y+40,tx:fr.x+fr.w*0.5,ty:fr.y+fr.h*0.4,on:garden().feat==='fan'?1:0};
  fireflies=[];
  if(garden().feat==='dusk'){
    for(let i=0;i<8;i++) fireflies.push({x:fr.x+Math.random()*fr.w,y:fr.y+Math.random()*fr.h,p:Math.random()*6});
  }
  // starter blooms
  const n=gardenIdx===0?3:2;
  for(let i=0;i<n;i++) spawnOne(1);
  state=ST.PLAY;
  announce(garden().name);
  sfxUi();
}
function completeOuting(){
  SAVE.baskets=(SAVE.baskets|0)+1;
  SAVE.outingDone=(SAVE.outingDone|0)+1;
  SAVE.gardenBaskets[gardenIdx]=(SAVE.gardenBaskets[gardenIdx]|0)+1;
  // nursery pot from this basket
  const spId=basket[0]||speciesForOuting()[0].id;
  SAVE.pots.push({sp:spId,garden:gardenIdx,x:0.2+Math.random()*0.6,y:0.35+Math.random()*0.4});
  if(SAVE.gardenBaskets[gardenIdx]>=OUTINGS_PER_GARDEN && SAVE.unlocked<gardenIdx+2 && SAVE.unlocked<5){
    SAVE.unlocked=gardenIdx+2;
  }
  // stamp all basket species
  basket.forEach(id=>{if(SAVE.album.indexOf(id)<0) SAVE.album.push(id);});
  save();
}
function goNursery(fromPlant){
  if(fromPlant) completeOuting();
  planting=fromPlant?1:0; plantT=0; plantSkip=0; nurseryChoice=-1;
  state=ST.NURSERY;
  announce("Haven's Nursery");
}

/* ---- drawing helpers ---- */
function roundRect(x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  cx.beginPath();
  cx.moveTo(x+rr,y); cx.arcTo(x+w,y,x+w,y+h,rr); cx.arcTo(x+w,y+h,x,y+h,rr);
  cx.arcTo(x,y+h,x,y,rr); cx.arcTo(x,y,x+w,y,rr); cx.closePath();
}
function creamStroke(){cx.strokeStyle=C.cream; cx.lineWidth=2.2; cx.lineJoin='round'; cx.stroke();}
function drawFlowerHead(sp,x,y,s,outline){
  cx.save(); cx.translate(x,y); cx.scale(s,s);
  // stem
  cx.strokeStyle=C.leaf; cx.lineWidth=3; cx.beginPath(); cx.moveTo(0,8); cx.lineTo(0,22); cx.stroke();
  cx.fillStyle=C.leaf; cx.beginPath(); cx.ellipse(-7,14,6,3, -0.5,0,7); cx.ellipse(7,15,6,3,0.5,0,7); cx.fill();
  const c0=sp.cols[0], c1=sp.cols[1];
  if(sp.shape==='tulip'){
    cx.fillStyle=c0;
    cx.beginPath(); cx.moveTo(0,-14); cx.bezierCurveTo(14,-8,12,8,0,10); cx.bezierCurveTo(-12,8,-14,-8,0,-14); cx.fill();
    if(outline) creamStroke();
    cx.fillStyle=c1; cx.beginPath(); cx.ellipse(0,0,4,6,0,0,7); cx.fill();
  } else if(sp.shape==='bell'){
    cx.fillStyle=c0;
    cx.beginPath(); cx.moveTo(-10,-2); cx.quadraticCurveTo(0,-18,10,-2); cx.quadraticCurveTo(12,8,0,10); cx.quadraticCurveTo(-12,8,-10,-2); cx.fill();
    if(outline) creamStroke();
    cx.fillStyle=c1; cx.beginPath(); cx.arc(0,2,3,0,7); cx.fill();
  } else if(sp.shape==='fan'){
    cx.fillStyle=c0;
    for(let i=-2;i<=2;i++){
      cx.beginPath(); cx.ellipse(i*5,-4,5,10,i*0.25,0,7); cx.fill();
    }
    if(outline){cx.beginPath(); cx.ellipse(0,-4,14,11,0,0,7); creamStroke();}
    cx.fillStyle=c1; cx.beginPath(); cx.arc(0,4,4,0,7); cx.fill();
  } else {
    // daisy
    cx.fillStyle=c0;
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4;
      cx.beginPath(); cx.ellipse(Math.cos(a)*8,Math.sin(a)*8,5.5,3.5,a,0,7); cx.fill();
    }
    if(outline){cx.beginPath(); cx.arc(0,0,13,0,7); creamStroke();}
    cx.fillStyle=c1; cx.beginPath(); cx.arc(0,0,5.5,0,7); cx.fill();
  }
  cx.restore();
}
function drawPip(x,y,wave){
  cx.save(); cx.translate(x,y);
  // pot
  cx.fillStyle=C.pot;
  cx.beginPath(); cx.moveTo(-14,6); cx.lineTo(-11,22); cx.lineTo(11,22); cx.lineTo(14,6); cx.closePath(); cx.fill();
  creamStroke();

/* ---- update ---- */
function update(dt){
  if(state===ST.PLAY){
    // cart move
    const dx=cart.tx-cart.x, dy=cart.ty-cart.y, d=Math.hypot(dx,dy);
    if(d>2){
      const step=Math.min(d,CART_SPEED*dt);
      cart.x+=dx/d*step; cart.y+=dy/d*step;
    }
    // flowers
    flowers.forEach(f=>{
      f.age+=dt*1000;
      if(f.state==='blooming'){
        const u=Math.min(1,f.age/BLOOM_POP_MS);
        f.scale=0.8+0.28*Math.sin(u*Math.PI*0.85)+0.0;
        if(u>=1){f.state='open'; f.scale=1;}
      } else if(f.state==='open'){
        f.sway+=dt;
        if(f.age>f.hold){f.state='shut'; f.shutT=0;}
      } else if(f.state==='shut'){
        f.shutT=(f.shutT||0)+dt;
        f.scale=Math.max(0.05,0.15);
        if(f.shutT>2.5){f.state='gone';}
      } else if(f.state==='pop'){
        f.popT=(f.popT||0)+dt;
        // arc toward basket icon
        const bx=W/2, by=contentBottom()-70;
        const u=Math.min(1,f.popT/0.35);
        f.x+=(bx-f.x)*0.15; f.y+=(by-f.y)*0.15;
        if(u>=1) f.state='gone';
      }
    });
    flowers=flowers.filter(f=>f.state!=='gone');
    // spawn
    spawnT+=dt*1000;
    const alive=flowers.filter(f=>f.state==='open'||f.state==='blooming').length;
    if(spawnT>=SPAWN_INTERVAL&&alive<garden().maxBloom){spawnT=0; spawnOne();}
    // speed burst
    burstT+=dt*1000;
    if(burstT>=BURST_INTERVAL){burstT=0; spawnBurst();}
    // butterfly drift
    if(butterfly.on){
      butterfly.x+=(butterfly.tx-butterfly.x)*dt*0.6;
      butterfly.y+=(butterfly.ty-butterfly.y)*dt*0.6;
      if(Math.hypot(butterfly.tx-butterfly.x,butterfly.ty-butterfly.y)<8){
        const fr=fieldRect();
        butterfly.tx=fr.x+40+Math.random()*(fr.w-80);
        butterfly.ty=fr.y+40+Math.random()*(fr.h-80);
      }
    }
    fireflies.forEach(ff=>{ff.x+=Math.sin(performance.now()/800+ff.p)*8*dt; ff.y+=Math.cos(performance.now()/900+ff.p)*6*dt;});
    if(flourishT>0) flourishT-=dt;
    if(basketPulse>0) basketPulse=Math.max(0,basketPulse-dt*0.25);
  }
  if(state===ST.NURSERY&&planting){
    plantT+=dt;
    if(plantT>0.05&&plantT<0.4&&particles.length<40) addPetals(W/2,H*0.7,C.pink,quiet?1:3);
    if(plantT>=1.2) planting=0;
  }
  // particles always
  particles.forEach(p=>{p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=120*dt;});
  particles=particles.filter(p=>p.t<p.life);
  grassWiggles.forEach(w=>w.t+=dt); grassWiggles=grassWiggles.filter(w=>w.t<0.45);
  puddleRings.forEach(r=>{r.t+=dt; r.r+=40*dt;}); puddleRings=puddleRings.filter(r=>r.t<0.7);
}

/* ---- input ---- */
function ptr(e){
  const t=e.changedTouches?e.changedTouches[0]:e;
  const r=cv.getBoundingClientRect();
  const sx=r.width?W/r.width:1, sy=r.height?H/r.height:1;
  return{x:(t.clientX-r.left)*sx,y:(t.clientY-r.top)*sy,id:t.identifier!=null?t.identifier:'m'};
}
function inRect(p,r){return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}

function toggleMute(){
  muted=!muted; SAVE.mute=muted?1:0; save();
  try{localStorage.setItem(MUTE_K,muted?'1':'0');}catch(e){}
  sfxUi();
}
function toggleQuiet(){
  quiet=!quiet; SAVE.quiet=quiet?1:0; save();
  try{localStorage.setItem(QUIET_K,quiet?'1':'0');}catch(e){}
  sfxUi();
}

function onDown(e){
  e.preventDefault(); ensureAC();
  const p=ptr(e);
  if(pointerId!=null&&p.id!==pointerId) return; // ignore extra fingers
  pointerId=p.id; lastPtr=p; dragging=0;

  if(inRect(p,hit.mute)){toggleMute(); return;}
  if(inRect(p,hit.quiet)){toggleQuiet(); return;}

  if(albumOpen){
    if(inRect(p,hit.albumClose)){albumOpen=0; sfxUi();}
    return;
  }

  if(state===ST.MENU){
    for(let i=0;i<5;i++) if(inRect(p,hit['g'+i])){startOuting(i); return;}
    if(inRect(p,hit.nursery)){goNursery(0); sfxUi(); return;}
    if(inRect(p,hit.album)){albumOpen=1; sfxUi(); return;}
    return;
  }
  if(state===ST.PAUSED){
    if(inRect(p,hit.pause)){state=ST.PLAY; sfxUi();}
    return;
  }
  if(state===ST.PLAY){
    if(inRect(p,hit.pause)){state=ST.PAUSED; sfxUi(); return;}
    if(basket.length>=BASKET_SLOTS&&inRect(p,hit.plant)){
      sfxPlant(); goNursery(1); return;
    }
    // pick on pointer-down
    const f=nearestFlower(p.x,p.y,PICK_RADIUS);
    if(f){showDemo=0; doPick(f); dragging=1; return;}
    // empty ground — cart goes, grass wiggles, no error
    if(p.y<contentBottom()-100){
      cart.tx=p.x; cart.ty=p.y; addWiggle(p.x,p.y); sfxRustle();
      if(garden().feat==='puddles') addRing(p.x,p.y);
      dragging=1;
    }
    return;
  }
  if(state===ST.NURSERY){
    if(planting){planting=0; plantT=1.2; return;} // skip
    if(inRect(p,hit.gate)){state=ST.MENU; sfxUi(); return;}
    for(let i=0;i<2;i++) if(inRect(p,hit['deco'+i])){
      nurseryChoice=i;
      if(SAVE.decors.indexOf(DECORS[i].id)<0) SAVE.decors.push(DECORS[i].id);
      save(); sfxUi();
    }
  }
}
function onMove(e){
  e.preventDefault();
  const p=ptr(e);
  if(pointerId==null||p.id!==pointerId) return;
  if(state!==ST.PLAY||!lastPtr) return;
  // sweep: test whole motion segment
  const hits=segmentHits(lastPtr.x,lastPtr.y,p.x,p.y);
  hits.forEach((f,i)=>doPick(f,i));
  if(hits.length||dragging){
    cart.tx=p.x; cart.ty=Math.min(p.y,contentBottom()-120);
    dragging=1;
  }
  lastPtr=p;
}
function onUp(e){
  e.preventDefault();
  const p=ptr(e);
  if(p.id!==pointerId) return;
  pointerId=null; lastPtr=null; dragging=0;
}

cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',onUp,{passive:false});
cv.addEventListener('pointercancel',onUp,{passive:false});
addEventListener('touchstart',e=>e.preventDefault(),{passive:false});

/* ---- loop ---- */
let last=performance.now();
function frame(now){
  let dt=Math.min(DT_CAP,(now-last)/1000); last=now;
  hit={}; // rebuilt each draw
  // preserve mute/quiet hits via drawChrome
  update(dt);
  if(state===ST.MENU) drawMenu();
  else if(state===ST.NURSERY) drawNursery();
  else drawPlay();
  drawChrome();
  if(albumOpen) drawAlbumOverlay();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
announce("Haven's Garden "+VER);

/* service worker — network-first tip cache */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
