<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5ecf7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Haven's Garden</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#6fd48a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;position:fixed;inset:0}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
#safeProbe{position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden}
</style>
</head>
<body>
<canvas id="c" aria-label="Haven's Garden"></canvas>
<div id="live" aria-live="polite"></div>
<div id="safeProbe" aria-hidden="true"></div>
<script>
'use strict';
/* ============================================================
   Haven's Garden v0.2 — pick · parade · plant (no fail)
   Subway-Surfers FEEL (motion, arcs, combo, bursts) — original
   garden IP only. Smooth organic vector art, not blocky stamps.
   Safe-bottom: visualViewport + safe-area + ≥90px pad
   ============================================================ */

/* ---- knobs ---- */
const VER='v0.2';
const BASKET_SLOTS=6;
const PICK_RADIUS=36;
const TARGET_SPACING=78;
const SPAWN_INTERVAL=720;
const SPAWN_HOLD=9000;
const INTRO_BLOOMS_PERSIST=true;
const ACTIVE_FLOWERS=5;
const PIP_SPEED=260;
const WORLD_SPEED=118;
const SWEEP_RADIUS=34;
const TRAIL_MAX=14;
const OUTINGS_PER_GARDEN=2;
const NEW_SPECIES_EVERY=2;
const MAX_PARTICLES=110;
const MAX_AUDIO_VOICES=5;
const MASTER_GAIN=0.2;
const DPR_CAP=2;
const DT_CAP=1/20;
const BURST_INTERVAL=7200;
const BURST_COUNT=6;
const BURST_SPEED=2.4;
const BURST_DUR=2.2;
const MAGNET_INTERVAL=11000;
const MAGNET_DUR=3.2;
const MAGNET_RADIUS=150;
const COMBO_WINDOW=900;
const COMBO_COOL=1.6;
const BLOOM_POP_MS=200;
const SAFE_UI=90;
const PATH_LANES=3;

const SPECIES=[
  {id:'daisy',shape:'daisy',c0:'#fff6ea',c1:'#ffd24a',c2:'#ffe9a8'},
  {id:'tulip',shape:'tulip',c0:'#ff6b9d',c1:'#ff3d7a',c2:'#ffb3cc'},
  {id:'bell',shape:'bell',c0:'#c59bff',c1:'#9b6bff',c2:'#e2cfff'},
  {id:'poppy',shape:'daisy',c0:'#ff6b5a',c1:'#ff3b2f',c2:'#ffb0a6'},
  {id:'butter',shape:'daisy',c0:'#ffe566',c1:'#ffc01a',c2:'#fff1a8'},
  {id:'minty',shape:'fan',c0:'#5dffc2',c1:'#1ecf8e',c2:'#b8ffe4'},
  {id:'blush',shape:'tulip',c0:'#ff9ec4',c1:'#ff6aa0',c2:'#ffd0e2'},
  {id:'night',shape:'bell',c0:'#ffd86b',c1:'#ffb000',c2:'#fff0b8'},
  {id:'sky',shape:'daisy',c0:'#8ad4ff',c1:'#3aa8f0',c2:'#c8ebff'},
  {id:'coral',shape:'fan',c0:'#ff9a6b',c1:'#ff6a3a',c2:'#ffd0b8'},
  {id:'lilac',shape:'tulip',c0:'#d4a8ff',c1:'#a86bff',c2:'#ebd4ff'},
  {id:'rainbow',shape:'daisy',c0:'#ff9ad4',c1:'#ffd24a',c2:'#8ad4ff'}
];

const GARDENS=[
  {id:'sunny',name:'Sunny Patch',sky:['#7ec8ff','#c8f0ff','#ffe9a0'],far:'#7edc6a',mid:'#5ecf5a',near:'#3db848',path:['#f0d090','#e0b868'],accent:'#ffd24a',cloud:'#fff',max:5,persist:1,feat:'stable'},
  {id:'puddle',name:'Puddle Meadow',sky:['#6ab8e8','#a8e0d8','#b8f0c8'],far:'#5cbc7a',mid:'#3eaa68',near:'#2e8e58',path:['#c8b888','#b09a68'],accent:'#5ec8e0',cloud:'#e8f8ff',max:5,persist:0,feat:'puddles'},
  {id:'butterfly',name:'Butterfly Bend',sky:['#c8a8f0','#f0c8e0','#d8f0b0'],far:'#7ad868',mid:'#58c050',near:'#3ea840',path:['#e8c8a0','#d4a878'],accent:'#ff7ab8',cloud:'#fff0f8',max:6,persist:0,feat:'fan'},
  {id:'lantern',name:'Lantern Garden',sky:['#1a2048','#4a3080','#c86840'],far:'#2a5840',mid:'#1e4030',near:'#163028',path:['#5a4838','#3e3024'],accent:'#ffc84a',cloud:'#ffd080',max:5,persist:0,feat:'dusk',dark:1},
  {id:'rainbow',name:'Rainbow Greenhouse',sky:['#88d8ff','#ffc0e0','#c8ffb0'],far:'#6ee07a',mid:'#48c868',near:'#30a850',path:['#f0d8a8','#e0c080'],accent:'#ff80c0',cloud:'#fff',max:6,persist:0,feat:'curve'}
];

const DECORS=[{id:'bench',label:'Bench'},{id:'arch',label:'Arch'}];
const PK='havensGarden.v1', MUTE_K='havensGarden.mute', QUIET_K='havensGarden.quiet';
let SAVE; try{SAVE=JSON.parse(localStorage.getItem(PK)||'null');}catch(e){SAVE=null;}
function freshSave(){return{v:1,unlocked:1,baskets:0,outingDone:0,album:[],pots:[],decors:[],gardenBaskets:[0,0,0,0,0],mute:0,quiet:0};}
if(!SAVE||!SAVE.gardenBaskets) SAVE=freshSave();
function save(){try{localStorage.setItem(PK,JSON.stringify(SAVE));}catch(e){}}
let muted=localStorage.getItem(MUTE_K)==='1'||!!SAVE.mute;
let quiet=localStorage.getItem(QUIET_K)==='1'||!!SAVE.quiet||!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

const cv=document.getElementById('c'),cx=cv.getContext('2d');
const live=document.getElementById('live'), safeProbe=document.getElementById('safeProbe');
let W=390,H=844,dpr=1,padB=SAFE_UI,padT=12,hit={};

function safeInsetBottom(){try{return safeProbe.getBoundingClientRect().height||0;}catch(e){return 0;}}
function viewSize(){
  const vv=window.visualViewport;
  let w=vv&&vv.width?vv.width:innerWidth, h=vv&&vv.height?vv.height:innerHeight;
  const vvh=parseFloat(new URLSearchParams(location.search).get('vvh')||'');
  if(vvh>200&&vvh<h) h=vvh;
  return{w:Math.max(280,Math.round(w)),h:Math.max(420,Math.round(h)),ox:vv?vv.offsetLeft||0:0,oy:vv?vv.offsetTop||0:0};
}
function resize(){
  dpr=Math.min(devicePixelRatio||1,DPR_CAP);
  const vv=viewSize(); W=vv.w; H=vv.h;
  padB=Math.max(SAFE_UI,SAFE_UI+safeInsetBottom()); padT=12;
  cv.style.left=vv.ox+'px'; cv.style.top=vv.oy+'px';
  cv.style.width=W+'px'; cv.style.height=H+'px';
  cv.width=(W*dpr)|0; cv.height=(H*dpr)|0;
  cx.setTransform(dpr,0,0,dpr,0,0);
}
function contentBottom(){return H-padB;}
addEventListener('resize',resize);
if(window.visualViewport){visualViewport.addEventListener('resize',resize);visualViewport.addEventListener('scroll',resize);}
resize();
function announce(t){live.textContent=t;}

const ST={MENU:'MENU',PLAY:'PLAY',NURSERY:'NURSERY',PAUSED:'PAUSED'};
let state=ST.MENU, gardenIdx=0;

/* play */
let flowers=[], particles=[], arcs=[], dust=[], stars=[];
let basket=[], combo=0, comboT=0, comboPop=0, flourishT=0;
let worldY=0, worldSp=WORLD_SPEED, burstT=0, burstLeft=0, magnetT=0, magnetLeft=0;
let spawnT=0, magnetSpawnT=0, showDemo=1, plantT=0, planting=0, nurseryChoice=-1, albumOpen=0;
let pip={lane:1,x:0,y:0,tx:0,ty:0,phase:0,squash:1,run:1,wave:0};
let parade=[], pointerId=null, lastPtr=null, dragging=0, fireflies=[], butterflies=[];
let cloudOff=0, hillOff=0, puddleRings=[], grassWiggles=[];

function garden(){return GARDENS[Math.min(gardenIdx,GARDENS.length-1)];}
function unlockedCount(){return Math.max(1,Math.min(5,SAVE.unlocked|0));}
function speciesPool(){
  const n=Math.min(SPECIES.length,1+Math.floor(SAVE.outingDone/NEW_SPECIES_EVERY));
  return SPECIES.slice(0,Math.max(1,n));
}
function pickSp(){const p=speciesPool(); return p[(Math.random()*p.length)|0];}
function nextNew(){const n=Math.min(SPECIES.length,1+Math.floor(SAVE.outingDone/NEW_SPECIES_EVERY)); return n<SPECIES.length?SPECIES[n]:null;}
function pathTop(){return padT+58;}
function pathBot(){return contentBottom()-112;}
function laneX(i){const L=PATH_LANES, m=W*0.16, span=W-m*2; return m+(span/(L-1))*i;}
function playH(){return pathBot()-pathTop();}

/* audio */
let ac=null,voices=0;
function ensureAC(){try{ac=ac||new (AudioContext||webkitAudioContext)(); if(ac.state==='suspended')ac.resume();}catch(e){} return ac;}
function tone(f,d,type,v,slide){
  if(muted||quiet||!ensureAC()||voices>=MAX_AUDIO_VOICES)return;
  try{
    voices++; const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),t+d);
    const vol=(v||0.1)*MASTER_GAIN/0.18;
    g.gain.setValueAtTime(0.001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d+0.02);
    setTimeout(()=>{voices=Math.max(0,voices-1);},d*1000+40);
  }catch(e){voices=Math.max(0,voices-1);}
}
function sfxBloom(){tone(560,0.07,'sine',0.07); setTimeout(()=>tone(720,0.08,'sine',0.06),40);}
function sfxPick(n){const f=420+(n%8)*28; tone(f,0.08,'triangle',0.13); tone(f*1.5,0.06,'sine',0.05);}
function sfxCombo(n){tone(520+Math.min(8,n)*40,0.1,'sine',0.1);}
function sfxFull(){tone(392,0.09,'sine',0.1);setTimeout(()=>tone(523,0.1,'sine',0.09),70);setTimeout(()=>tone(659,0.14,'sine',0.1),140);}
function sfxPlant(){tone(330,0.22,'sine',0.1,720);setTimeout(()=>tone(880,0.16,'sine',0.07),150);}
function sfxMagnet(){tone(280,0.2,'sine',0.08,560);}
function sfxBurst(){tone(640,0.08,'triangle',0.1);setTimeout(()=>tone(880,0.12,'sine',0.09),60);}
function sfxRustle(){tone(170,0.05,'triangle',0.025);}
function sfxUi(){tone(500,0.05,'triangle',0.05);}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){try{ac&&ac.suspend();}catch(e){} if(state===ST.PLAY) state=ST.PAUSED;}
  else{try{ac&&ac.resume();}catch(e){}}
});

/* particles / arcs */
function addPetals(x,y,col,n){
  if(quiet) n=Math.min(n,2);
  for(let i=0;i<n&&particles.length<MAX_PARTICLES;i++){
    const a=Math.random()*6.28,sp=50+Math.random()*110;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-50,t:0,life:0.45+Math.random()*0.4,col,r:2.5+Math.random()*3,spin:Math.random()*6});
  }
}
function addSpark(x,y){
  if(quiet||particles.length>MAX_PARTICLES-4) return;
  for(let i=0;i<4;i++) particles.push({x,y,vx:(Math.random()-0.5)*80,vy:-40-Math.random()*60,t:0,life:0.35,col:'#fff6a0',r:1.5+Math.random()*2,spark:1});
}
function addDust(x,y){
  if(quiet) return;
  dust.push({x,y:y+(Math.random()*6-3),vx:-20-Math.random()*30,vy:-10-Math.random()*20,t:0,life:0.35+Math.random()*0.25,r:2+Math.random()*3});
  if(dust.length>40) dust.shift();
}
function launchArc(sp,x,y){
  const bx=W/2, by=contentBottom()-78;
  arcs.push({sp,x,y,x0:x,y0:y,tx:bx,ty:by,u:0,spark:0});
}

/* flowers in world — scroll toward player (down screen) */
function spawnFlower(opts){
  opts=opts||{};
  const g=garden();
  const alive=flowers.filter(f=>!f.picked&&f.state!=='gone').length;
  if(!opts.force&&alive>=(opts.burst?g.max+3:g.max)) return null;
  const lane=opts.lane!=null?opts.lane:(Math.random()*PATH_LANES)|0;
  const x=laneX(lane)+(Math.random()*24-12);
  const y=opts.y!=null?opts.y:pathTop()-20-Math.random()*120;
  // spacing
  for(const f of flowers){ if(!f.picked&&Math.hypot(f.x-x,f.y-y)<TARGET_SPACING*0.85) return null; }
  const sp=opts.sp||pickSp();
  const f={x,y,lane,sp,state:'blooming',age:0,scale:0.75,picked:0,sway:Math.random()*6.28,
    hold:g.persist||(gardenIdx===0&&INTRO_BLOOMS_PERSIST)?1e9:SPAWN_HOLD,
    magnet:!!opts.magnet, id:Math.random().toString(36).slice(2)};
  flowers.push(f); if(!quiet) sfxBloom(); return f;
}
function spawnBurstRow(){
  burstLeft=BURST_DUR; worldSp=WORLD_SPEED*BURST_SPEED; sfxBurst();
  for(let i=0;i<BURST_COUNT;i++){
    const lane=i%PATH_LANES;
    spawnFlower({force:1,lane,y:pathTop()-40-i*48,burst:1});
  }
}
function spawnMagnet(){
  const f=spawnFlower({force:1,lane:1,y:pathTop()-30,magnet:1,sp:SPECIES[5]});
  if(f){f.magnet=1; sfxMagnet();}
}
function nearestFlower(x,y,rad){
  let best=null,bd=rad;
  for(const f of flowers){
    if(f.picked||(f.state!=='open'&&f.state!=='blooming'&&f.state!=='magnet')) continue;
    const d=Math.hypot(f.x-x,f.y-y); if(d<bd){bd=d;best=f;}
  }
  return best;
}
function segmentHits(x0,y0,x1,y1){
  const hitF=[], steps=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)/12));
  for(let i=0;i<=steps;i++){
    const t=i/steps,f=nearestFlower(x0+(x1-x0)*t,y0+(y1-y0)*t,SWEEP_RADIUS);
    if(f&&!hitF.includes(f)) hitF.push(f);
  }
  return hitF;
}

function doPick(f){
  if(!f||f.picked) return;
  f.picked=1; f.state='pop'; f.popT=0;
  addPetals(f.x,f.y,f.sp.c0,quiet?2:6); addSpark(f.x,f.y);
  launchArc(f.sp,f.x,f.y);
  combo++; comboT=COMBO_WINDOW/1000; comboPop=0.45;
  if(combo>=3){flourishT=0.6; if(combo%3===0) sfxCombo(combo);}
  if(basket.length<BASKET_SLOTS){
    basket.push(f.sp.id);
    if(basket.length===BASKET_SLOTS){sfxFull(); announce('Basket full — tap to plant');}
  } else {
    if(parade.length<TRAIL_MAX) parade.push({sp:f.sp});
    else{parade.shift(); parade.push({sp:f.sp});}
  }
  if(parade.length<TRAIL_MAX) parade.push({sp:f.sp});
  sfxPick(combo);
  if(SAVE.album.indexOf(f.sp.id)<0){SAVE.album.push(f.sp.id); save();}
  // magnet power
  if(f.magnet){magnetLeft=MAGNET_DUR; sfxMagnet(); announce('Magnet bloom!');}
  // butterfly fan
  if(garden().feat==='fan'&&Math.random()<0.3){
    for(let i=0;i<3;i++) spawnFlower({force:1,lane:(f.lane+i+1)%PATH_LANES,y:f.y-50-i*20});
  }
  pip.squash=0.82; pip.wave=0.5;
  save();
}

function startOuting(idx){
  gardenIdx=Math.max(0,Math.min(unlockedCount()-1,idx|0));
  flowers=[]; particles=[]; arcs=[]; dust=[]; stars=[]; parade=[]; basket=[];
  combo=0; comboT=0; comboPop=0; flourishT=0;
  worldY=0; worldSp=WORLD_SPEED; burstT=BURST_INTERVAL*0.4; burstLeft=0;
  magnetT=MAGNET_INTERVAL*0.5; magnetLeft=0; spawnT=0; magnetSpawnT=0;
  showDemo=gardenIdx===0&&SAVE.baskets===0?1:0;
  planting=0; plantT=0; nurseryChoice=-1; puddleRings=[]; grassWiggles=[];
  pip.lane=1; pip.x=laneX(1); pip.y=pathBot()-36; pip.tx=pip.x; pip.ty=pip.y;
  pip.phase=0; pip.squash=1; pip.run=1; pip.wave=0;
  fireflies=[]; butterflies=[];
  if(garden().feat==='dusk') for(let i=0;i<10;i++) fireflies.push({x:Math.random()*W,y:pathTop()+Math.random()*playH(),p:Math.random()*6});
  if(garden().feat==='fan') for(let i=0;i<3;i++) butterflies.push({x:Math.random()*W,y:pathTop()+40+Math.random()*80,p:Math.random()*6,vx:30});
  for(let i=0;i<(gardenIdx===0?4:3);i++) spawnFlower({force:1,lane:i%3,y:pathTop()+40+i*70});
  state=ST.PLAY; announce(garden().name); sfxUi();
}
function completeOuting(){
  SAVE.baskets=(SAVE.baskets|0)+1; SAVE.outingDone=(SAVE.outingDone|0)+1;
  SAVE.gardenBaskets[gardenIdx]=(SAVE.gardenBaskets[gardenIdx]|0)+1;
  SAVE.pots.push({sp:basket[0]||speciesPool()[0].id,garden:gardenIdx,x:0.2+Math.random()*0.6,y:0.35+Math.random()*0.4});
  if(SAVE.gardenBaskets[gardenIdx]>=OUTINGS_PER_GARDEN&&SAVE.unlocked<gardenIdx+2&&SAVE.unlocked<5) SAVE.unlocked=gardenIdx+2;
  basket.forEach(id=>{if(SAVE.album.indexOf(id)<0) SAVE.album.push(id);});
  save();
}
function goNursery(fromPlant){
  if(fromPlant) completeOuting();
  planting=fromPlant?1:0; plantT=0; nurseryChoice=-1; state=ST.NURSERY; announce("Haven's Nursery");
}

/* ---- draw helpers (smooth organic) ---- */
function rr(x,y,w,h,r){const a=Math.min(r,w/2,h/2); cx.beginPath(); cx.moveTo(x+a,y); cx.arcTo(x+w,y,x+w,y+h,a); cx.arcTo(x+w,y+h,x,y+h,a); cx.arcTo(x,y+h,x,y,a); cx.arcTo(x,y,x+w,y,a); cx.closePath();}
function softShadow(x,y,rx,ry,a){cx.fillStyle=`rgba(40,30,20,${a||0.18})`; cx.beginPath(); cx.ellipse(x,y,rx,ry,0,0,7); cx.fill();}

function drawFlower(sp,x,y,s,sway){
  cx.save(); cx.translate(x,y); cx.rotate(Math.sin(sway||0)*0.12); cx.scale(s,s);
  // stem + leaves
  cx.strokeStyle='#2f9a48'; cx.lineWidth=3.2; cx.lineCap='round';
  cx.beginPath(); cx.moveTo(0,10); cx.quadraticCurveTo(3,18,0,26); cx.stroke();
  cx.fillStyle='#3db858';
  cx.beginPath(); cx.ellipse(-8,16,7,3.5,-0.7,0,7); cx.fill();
  cx.beginPath(); cx.ellipse(8,17,7,3.5,0.7,0,7); cx.fill();
  if(sp.shape==='tulip'){
    softShadow(0,12,10,4,0.12);
    const g=cx.createLinearGradient(0,-16,0,10); g.addColorStop(0,sp.c2); g.addColorStop(1,sp.c0);
    cx.fillStyle=g;
    cx.beginPath(); cx.moveTo(0,-16);
    cx.bezierCurveTo(14,-10,13,8,0,12); cx.bezierCurveTo(-13,8,-14,-10,0,-16); cx.fill();
    cx.fillStyle=sp.c1; cx.globalAlpha=0.55;
    cx.beginPath(); cx.moveTo(0,-14); cx.bezierCurveTo(6,-6,5,4,0,8); cx.bezierCurveTo(-5,4,-6,-6,0,-14); cx.fill();
    cx.globalAlpha=1;
  } else if(sp.shape==='bell'){
    softShadow(0,12,9,3.5,0.12);
    const g=cx.createLinearGradient(0,-18,0,10); g.addColorStop(0,sp.c2); g.addColorStop(1,sp.c0);
    cx.fillStyle=g;
    cx.beginPath(); cx.moveTo(-11,-2); cx.quadraticCurveTo(0,-20,11,-2); cx.quadraticCurveTo(13,8,0,12); cx.quadraticCurveTo(-13,8,-11,-2); cx.fill();
    cx.fillStyle=sp.c1; cx.beginPath(); cx.arc(0,2,3.2,0,7); cx.fill();
  } else if(sp.shape==='fan'){
    softShadow(0,12,12,4,0.12);
    for(let i=-2;i<=2;i++){
      const g=cx.createRadialGradient(i*5,-6,1,i*5,-2,12);
      g.addColorStop(0,sp.c2); g.addColorStop(1,sp.c0);
      cx.fillStyle=g; cx.beginPath(); cx.ellipse(i*5,-4,5.5,11,i*0.22,0,7); cx.fill();
    }
    cx.fillStyle=sp.c1; cx.beginPath(); cx.arc(0,5,4.2,0,7); cx.fill();
  } else {
    softShadow(0,12,12,4,0.12);
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4;
      cx.fillStyle=sp.c0;
      cx.beginPath(); cx.ellipse(Math.cos(a)*9,Math.sin(a)*9-1,6.2,3.8,a,0,7); cx.fill();
    }
    const g=cx.createRadialGradient(0,0,1,0,0,7);
    g.addColorStop(0,sp.c2); g.addColorStop(1,sp.c1);
    cx.fillStyle=g; cx.beginPath(); cx.arc(0,0,6.2,0,7); cx.fill();
    cx.fillStyle='rgba(255,255,255,.45)'; cx.beginPath(); cx.arc(-1.5,-1.5,2,0,7); cx.fill();
  }
  // magnet glow
  cx.restore();
}

function drawPip(x,y,ph,sq,wave){
  cx.save(); cx.translate(x,y);
  const bob=Math.sin(ph*2)*3, leg=Math.sin(ph*2);
  cx.translate(0,bob);

function drawStar(x,y,r,a){
  cx.save(); cx.translate(x,y); cx.rotate(a); cx.scale(r/10,r/10);
  cx.fillStyle='#ffe566'; cx.beginPath();
  for(let i=0;i<5;i++){const ang=-Math.PI/2+i*1.2566; const ang2=ang+0.628;
    cx.lineTo(Math.cos(ang)*10,Math.sin(ang)*10); cx.lineTo(Math.cos(ang2)*4,Math.sin(ang2)*4);}

  cx.fillStyle='rgba(255,255,255,.5)'; cx.beginPath(); cx.arc(-2,-2,2,0,7); cx.fill();

function drawParallax(){
  const g=garden(), t=worldY;
  // sky gradient
  const grd=cx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,g.sky[0]); grd.addColorStop(0.45,g.sky[1]); grd.addColorStop(1,g.sky[2]);
  cx.fillStyle=grd; cx.fillRect(0,0,W,H);
  // clouds (far)
  cloudOff=(cloudOff+worldSp*0.015)%(W+120);
  cx.fillStyle=g.dark?'rgba(255,200,120,.25)':'rgba(255,255,255,.55)';
  for(let i=0;i<4;i++){
    const cx0=((i*170-cloudOff)%(W+140))-40, cy=padT+30+i*28;
    cx.beginPath(); cx.ellipse(cx0,cy,36,14,0,0,7); cx.ellipse(cx0+22,cy-6,24,12,0,0,7); cx.ellipse(cx0-18,cy-2,20,10,0,0,7); cx.fill();
  }
  // far hills
  hillOff=(t*0.12)%W;
  cx.fillStyle=g.far;
  cx.beginPath(); cx.moveTo(-20,H*0.38);
  for(let x=-20;x<=W+40;x+=40){const yy=H*0.36+Math.sin((x+hillOff)*0.02)*18+Math.sin((x+hillOff)*0.05)*8; cx.lineTo(x,yy);}
  cx.lineTo(W+20,H); cx.lineTo(-20,H); cx.fill();
  // mid hills
  cx.fillStyle=g.mid;
  cx.beginPath(); cx.moveTo(-20,H*0.48);
  for(let x=-20;x<=W+40;x+=36){const yy=H*0.46+Math.sin((x+hillOff*1.6)*0.028)*14; cx.lineTo(x,yy);}
  cx.lineTo(W+20,H); cx.lineTo(-20,H); cx.fill();
  // garden beds / near
  cx.fillStyle=g.near;
  cx.beginPath(); cx.moveTo(0,pathTop()-10);
  cx.quadraticCurveTo(W*0.3,pathTop()-30,W*0.5,pathTop()-8);
  cx.quadraticCurveTo(W*0.75,pathTop()-28,W,pathTop()-6);
  cx.lineTo(W,H); cx.lineTo(0,H); cx.fill();
  // path ribbon
  const pathG=cx.createLinearGradient(0,pathTop(),0,pathBot());
  pathG.addColorStop(0,g.path[0]); pathG.addColorStop(1,g.path[1]);
  cx.fillStyle=pathG;
  const pw=W*0.62, px=(W-pw)/2;
  cx.beginPath(); cx.moveTo(px+pw*0.15,pathTop()); cx.lineTo(px+pw*0.85,pathTop());
  cx.lineTo(px+pw,pathBot()+20); cx.lineTo(px,pathBot()+20); cx.closePath(); cx.fill();
  // path dashes scrolling
  cx.strokeStyle='rgba(255,255,255,.28)'; cx.lineWidth=4; cx.setLineDash([16,18]); cx.lineDashOffset=-t*0.45;
  cx.beginPath(); cx.moveTo(W/2,pathTop()+8); cx.lineTo(W/2,pathBot()); cx.stroke();
  cx.setLineDash([]);
  // soft lane glows
  for(let i=0;i<PATH_LANES;i++){
    cx.fillStyle='rgba(255,255,255,.06)';
    cx.beginPath(); cx.ellipse(laneX(i), (pathTop()+pathBot())/2, 28, playH()*0.42, 0,0,7); cx.fill();
  }
  // puddles
  if(g.feat==='puddles'){
    cx.fillStyle='rgba(100,200,230,.35)';
    const py=((t*0.3)%180);
    cx.beginPath(); cx.ellipse(laneX(0)-10,pathTop()+80+py,28,10,0,0,7); cx.fill();
    cx.beginPath(); cx.ellipse(laneX(2)+10,pathTop()+160+(py*1.3)%160,24,9,0,0,7); cx.fill();
  }
  // fireflies / butterflies
  fireflies.forEach(ff=>{
    const a=0.3+0.4*Math.sin(performance.now()/350+ff.p);
    cx.fillStyle=`rgba(255,220,100,${a})`; cx.beginPath(); cx.arc(ff.x,ff.y,2.8,0,7); cx.fill();
  });
  butterflies.forEach(b=>{
    const flap=Math.sin(performance.now()/100+b.p);
    cx.save(); cx.translate(b.x,b.y);
    cx.fillStyle='#ff9ad0'; cx.beginPath(); cx.ellipse(-7,0,8,4.5,flap*0.6,0,7); cx.ellipse(7,0,8,4.5,-flap*0.6,0,7); cx.fill();
    cx.fillStyle='#3a3020'; cx.beginPath(); cx.ellipse(0,0,2,4.5,0,0,7); cx.fill();
    cx.restore();
  });
  // speed-burst speedlines
  if(burstLeft>0&&!quiet){
    cx.strokeStyle=`rgba(255,255,255,${0.25*burstLeft/BURST_DUR})`; cx.lineWidth=2;
    for(let i=0;i<8;i++){const x=40+i*(W/8); cx.beginPath(); cx.moveTo(x,pathTop()+20+(i*37+t)%playH()); cx.lineTo(x,pathTop()+50+(i*37+t)%playH()); cx.stroke();}
  }
  // magnet aura
  if(magnetLeft>0){
    cx.strokeStyle=`rgba(94,255,194,${0.35+0.25*Math.sin(performance.now()/120)})`; cx.lineWidth=3;
    cx.beginPath(); cx.arc(pip.x,pip.y-10,MAGNET_RADIUS*(0.35+0.1*Math.sin(performance.now()/200)),0,7); cx.stroke();
  }
}

  parade.forEach((p,i)=>{
    const ox=pip.x-Math.cos(i*0.35+pip.phase)*10*(i+1)*0.3;
    const oy=pip.y+10+i*7+Math.sin(performance.now()/280+i)*2;
    cx.globalAlpha=0.8; drawFlower(p.sp,ox,oy,0.32,performance.now()/300+i); cx.globalAlpha=1;

  flowers.forEach(f=>{
    if(f.state==='gone') return;
    let sc=f.scale; if(f.state==='pop') sc=Math.max(0,1-(f.popT||0)*2.2);

    if(f.magnet){
      cx.strokeStyle=`rgba(94,255,194,.5)`; cx.lineWidth=2;
      cx.beginPath(); cx.arc(f.x,f.y,22+Math.sin(performance.now()/150)*4,0,7); cx.stroke();
    }
    drawFlower(f.sp,f.x,f.y,sc,f.sway+performance.now()/400);
  });
  drawPip(pip.x,pip.y,pip.phase,pip.squash,pip.wave);
  // flying arcs (coin juice)
  arcs.forEach(a=>{
    drawFlower(a.sp,a.x,a.y,0.4+0.2*(1-a.u),a.u*4);
    if(!quiet){cx.fillStyle='rgba(255,240,120,.8)'; cx.beginPath(); cx.arc(a.x,a.y,2,0,7); cx.fill();}
  });
  particles.forEach(p=>{
    cx.globalAlpha=Math.max(0,1-p.t/p.life);
    cx.fillStyle=p.col; cx.beginPath();
    if(p.spark) cx.arc(p.x,p.y,p.r,0,7); else cx.ellipse(p.x,p.y,p.r,p.r*0.6,p.spin+p.t*4,0,7);
    cx.fill(); cx.globalAlpha=1;
  });
  // demo finger
  if(showDemo){
    const f=flowers.find(x=>!x.picked&&(x.state==='open'||x.state==='blooming'));
    if(f){const t=(performance.now()/900)%1; cx.globalAlpha=0.65*(1-t); cx.fillStyle='rgba(42,36,24,.3)'; cx.beginPath(); cx.ellipse(f.x,f.y+18+t*12,11,15,0.2,0,7); cx.fill(); cx.fillStyle='#fff'; cx.beginPath(); cx.arc(f.x,f.y+8+t*12,7,0,7); cx.fill(); cx.globalAlpha=1;}
  }
  drawBasketUI();
  if(state===ST.PAUSED){
    cx.fillStyle='rgba(30,24,20,.4)'; cx.fillRect(0,0,W,H);
    cx.fillStyle='rgba(255,250,240,.95)'; rr(W/2-96,H*0.4,192,100,20); cx.fill();
    cx.fillStyle='#2a2418'; cx.font='800 18px system-ui'; cx.textAlign='center'; cx.fillText('Paused',W/2,H*0.4+42);
    cx.font='600 13px system-ui'; cx.fillStyle='#6a6258'; cx.fillText('tap ▶ to keep running',W/2,H*0.4+70);
  }
}

/* ---- update ---- */
function update(dt){
  if(state===ST.PLAY){
    worldY+=worldSp*dt; cloudOff+=worldSp*dt*0.2;
    // pip run cycle always
    pip.phase+=dt*(burstLeft>0?14:10);
    pip.run=1; pip.squash+=(1-pip.squash)*Math.min(1,dt*8);
    if(pip.wave>0) pip.wave=Math.max(0,pip.wave-dt);
    // move pip toward target
    const dx=pip.tx-pip.x, dy=pip.ty-pip.y, d=Math.hypot(dx,dy);
    if(d>2){const step=Math.min(d,PIP_SPEED*dt); pip.x+=dx/d*step; pip.y+=dy/d*step; if(!quiet&&Math.random()<0.4) addDust(pip.x,pip.y+26);}
    else if(!quiet&&Math.random()<0.15) addDust(pip.x+(Math.random()*8-4),pip.y+26);
    // keep pip in path band
    pip.y=Math.min(pathBot()-20,Math.max(pathTop()+80,pip.y));
    // scroll flowers toward player
    const scroll=worldSp*dt;
    flowers.forEach(f=>{
      if(f.picked&&f.state==='pop'){
        f.popT=(f.popT||0)+dt; if(f.popT>0.35) f.state='gone'; return;
      }
      f.y+=scroll; f.sway+=dt; f.age+=dt*1000;
      if(f.state==='blooming'){const u=Math.min(1,f.age/BLOOM_POP_MS); f.scale=0.75+0.35*Math.sin(u*1.4); if(u>=1){f.state=f.magnet?'magnet':'open'; f.scale=1;}}
      else if(f.state==='open'||f.state==='magnet'){ if(f.age>f.hold&&gardenIdx>0){f.state='shut'; f.shutT=0;} }
      else if(f.state==='shut'){f.shutT=(f.shutT||0)+dt; f.scale=0.12; if(f.shutT>2) f.state='gone';}
      // recycle off bottom — no fail, just gone
      if(f.y>pathBot()+50&&!f.picked) f.state='gone';
      // magnet pull
      if(magnetLeft>0&&!f.picked){
        const md=Math.hypot(f.x-pip.x,f.y-pip.y);
        if(md<MAGNET_RADIUS){f.x+=(pip.x-f.x)*dt*3; f.y+=(pip.y-f.y)*dt*3; if(md<PICK_RADIUS) doPick(f);}
      }
    });
    flowers=flowers.filter(f=>f.state!=='gone');
    // spawn
    spawnT+=dt*1000;
    const alive=flowers.filter(f=>!f.picked).length;
    if(spawnT>=(burstLeft>0?SPAWN_INTERVAL*0.45:SPAWN_INTERVAL)&&alive<garden().max+(burstLeft>0?3:0)){spawnT=0; spawnFlower({y:pathTop()-30-Math.random()*80});}
    burstT+=dt*1000; if(burstT>=BURST_INTERVAL){burstT=0; spawnBurstRow();}
    if(burstLeft>0){burstLeft-=dt; if(burstLeft<=0) worldSp=WORLD_SPEED;}
    magnetT+=dt*1000; if(magnetT>=MAGNET_INTERVAL){magnetT=0; spawnMagnet();}
    if(magnetLeft>0) magnetLeft-=dt;
    // combo cool-down (never a fail)
    if(comboT>0){comboT-=dt; if(comboT<=0){combo=Math.max(0,combo-1); if(combo>0) comboT=COMBO_COOL*0.35;}}
    if(comboPop>0) comboPop=Math.max(0,comboPop-dt*2);
    if(flourishT>0) flourishT=Math.max(0,flourishT-dt);
    fireflies.forEach(ff=>{ff.x+=Math.sin(performance.now()/700+ff.p)*10*dt; ff.y+=scroll*0.3; if(ff.y>pathBot()) ff.y=pathTop();});
    butterflies.forEach(b=>{b.x+=Math.sin(performance.now()/800+b.p)*40*dt; b.y+=Math.cos(performance.now()/600+b.p)*20*dt+scroll*0.15; if(b.y>pathBot()) b.y=pathTop()+20;});
  }
  if(state===ST.NURSERY&&planting){plantT+=dt; if(plantT>0.05&&plantT<0.45) addPetals(W/2,H*0.7,'#ff9ad0',quiet?1:3); if(plantT>=1.2) planting=0;}
  // arcs fly to basket
  arcs.forEach(a=>{
    a.u=Math.min(1,a.u+dt*2.4);
    const e=a.u*a.u*(3-2*a.u);
    const lift=Math.sin(a.u*Math.PI)*70;
    a.x=a.x0+(a.tx-a.x0)*e; a.y=a.y0+(a.ty-a.y0)*e-lift;
    if(a.u>0.85&&!a.spark){a.spark=1; addSpark(a.x,a.y);}
  });
  arcs=arcs.filter(a=>a.u<1);
  particles.forEach(p=>{p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=140*dt;});
  particles=particles.filter(p=>p.t<p.life);
  dust.forEach(d=>{d.t+=dt; d.x+=d.vx*dt; d.y+=d.vy*dt;}); dust=dust.filter(d=>d.t<d.life);
}

/* ---- input ---- */
function ptr(e){
  const t=e.changedTouches?e.changedTouches[0]:e;
  const r=cv.getBoundingClientRect();
  const sx=r.width?W/r.width:1, sy=r.height?H/r.height:1;
  return{x:(t.clientX-r.left)*sx,y:(t.clientY-r.top)*sy,id:t.identifier!=null?t.identifier:'m'};
}
function inRect(p,r){return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
function toggleMute(){muted=!muted;SAVE.mute=muted?1:0;save();try{localStorage.setItem(MUTE_K,muted?'1':'0');}catch(e){} sfxUi();}
function toggleQuiet(){quiet=!quiet;SAVE.quiet=quiet?1:0;save();try{localStorage.setItem(QUIET_K,quiet?'1':'0');}catch(e){} sfxUi();}

function onDown(e){
  e.preventDefault(); ensureAC();
  const p=ptr(e); if(pointerId!=null&&p.id!==pointerId) return;
  pointerId=p.id; lastPtr=p; dragging=0;
  if(inRect(p,hit.mute)){toggleMute(); return;}
  if(inRect(p,hit.quiet)){toggleQuiet(); return;}
  if(albumOpen){ if(inRect(p,hit.albumClose)){albumOpen=0;sfxUi();} return; }
  if(state===ST.MENU){
    for(let i=0;i<5;i++) if(inRect(p,hit['g'+i])){startOuting(i); return;}
    if(inRect(p,hit.nursery)){goNursery(0);sfxUi(); return;}
    if(inRect(p,hit.album)){albumOpen=1;sfxUi(); return;}
    return;
  }
  if(state===ST.PAUSED){ if(inRect(p,hit.pause)){state=ST.PLAY;sfxUi();} return; }
  if(state===ST.PLAY){
    if(inRect(p,hit.pause)){state=ST.PAUSED;sfxUi(); return;}
    if(basket.length>=BASKET_SLOTS&&inRect(p,hit.plant)){sfxPlant(); goNursery(1); return;}
    const f=nearestFlower(p.x,p.y,PICK_RADIUS);
    if(f){showDemo=0; doPick(f); dragging=1; pip.tx=f.x; pip.ty=Math.min(f.y+20,pathBot()-20); return;}
    // empty ground — safe trot, grass wiggle, no error
    if(p.y<pathBot()+10&&p.y>pathTop()){
      pip.tx=p.x; pip.ty=p.y; sfxRustle(); dragging=1;
      // nearest lane hint
      let best=0,bd=1e9; for(let i=0;i<PATH_LANES;i++){const d=Math.abs(laneX(i)-p.x); if(d<bd){bd=d;best=i;}} pip.lane=best;
    }
    return;
  }
  if(state===ST.NURSERY){
    if(planting){planting=0; plantT=1.2; return;}
    if(inRect(p,hit.gate)){state=ST.MENU;sfxUi(); return;}
    for(let i=0;i<2;i++) if(inRect(p,hit['deco'+i])){nurseryChoice=i; if(SAVE.decors.indexOf(DECORS[i].id)<0) SAVE.decors.push(DECORS[i].id); save(); sfxUi();}
  }
}
function onMove(e){
  e.preventDefault(); const p=ptr(e);
  if(pointerId==null||p.id!==pointerId||state!==ST.PLAY||!lastPtr) return;
  const hits=segmentHits(lastPtr.x,lastPtr.y,p.x,p.y);
  hits.forEach(f=>doPick(f));
  if(hits.length||dragging){pip.tx=p.x; pip.ty=Math.min(Math.max(p.y,pathTop()+80),pathBot()-20); dragging=1;}
  lastPtr=p;
}
function onUp(e){e.preventDefault(); const p=ptr(e); if(p.id!==pointerId) return; pointerId=null; lastPtr=null; dragging=0;}

cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',onUp,{passive:false});
cv.addEventListener('pointercancel',onUp,{passive:false});
addEventListener('touchstart',e=>e.preventDefault(),{passive:false});

let last=performance.now();
function frame(now){
  const dt=Math.min(DT_CAP,(now-last)/1000); last=now; hit={};
  update(dt);
  if(state===ST.MENU) drawMenu();
  else if(state===ST.NURSERY) drawNursery();
  else drawPlay();
  drawChrome();
  if(albumOpen) drawAlbum();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
announce("Haven's Garden "+VER);
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
