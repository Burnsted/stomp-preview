.lv,.bd{min-width:150px;min-height:48px;border-radius:10px;border:2px solid #fff5;background:#1d3b66;color:#fff;font:bold 14px sans-serif;padding:6px 8px}
.lv[disabled],.bd[disabled]{opacity:.4}.lv.done{border-color:#2bd17e}.bd.sel{border-color:#ffd84a;background:#3a3a14}
.lv small,.bd small{display:block;font-weight:normal;font-size:12px;opacity:.9;margin-top:2px}
.lv{text-align:left;display:flex;align-items:center;gap:10px}.lv b.n{flex:none;width:34px;height:34px;border-radius:50%;background:#0b1830;display:flex;align-items:center;justify-content:center;font-size:16px}
.lv.done b.n{background:#2bd17e;color:#0b1830}.lv span.t{flex:1}
.bd{display:flex;align-items:center;gap:10px;text-align:left}.sw{flex:none;width:64px;height:14px;border-radius:7px;border:2px solid #14213d;box-shadow:0 2px 0 #0006}

.boards .bd{min-width:0;min-height:40px;padding:4px 8px;font-size:12px}

@media (max-width:540px){#menu{padding:10px 12px}.grid{flex-direction:column;align-items:stretch}.lv{min-width:0;width:100%;min-height:56px;font-size:16px}#menu h1{font-size:24px;margin-top:10px}#jumpB{width:100px;height:100px;font-size:22px}#jumpB.mode-jump{font-size:24px}}
</style></head><body>

<script>
(function(){

var KINDS={
 boulderS:{w:20,h:16,t:0,wt:3},boulderM:{w:34,h:28,t:0,wt:3},boulderL:{w:48,h:40,t:6,wt:2},

 {n:1,name:'First Tracks',sub:'Small boulders. Learn the jump.',k:{boulderS:1},base:290,ramp:2,max:340,len:4200,pair:0,gapX:1.3,storm:[0,.06],spike:0,pick:.25,doubleJump:false},
 {n:2,name:'Rock Garden',sub:'Bigger boulders + logs',k:{boulderS:2,boulderM:3,boulderL:2,log:2,logLong:1},base:310,ramp:3,max:400,len:6000,pair:.1,gapX:1.1,storm:[.04,.12],spike:0,pick:.3,doubleJump:false},
 {n:3,name:'Wild Tracks',sub:'Coyotes on the run',k:{boulderS:1,boulderM:2,log:1,coyote:4},base:330,ramp:3,max:440,len:7000,pair:.12,gapX:1,storm:[.08,.22],spike:.08,pick:.35,doubleJump:false},
 {n:4,name:'Crowded Slopes',sub:'Skiers + ice',k:{boulderM:1,coyote:1,skier:4,ice:3,log:1},base:350,ramp:4,max:480,len:7500,pair:.15,gapX:.9,storm:[.1,.3],spike:.12,pick:.4,doubleJump:false},
 {n:5,name:'Backwoods',sub:'Polar bears + moose',k:{boulderL:1,log:1,bear:3,moose:3,coyote:1},base:360,ramp:4,max:500,len:8000,pair:.12,gapX:.9,storm:[.15,.4],spike:.15,pick:.4,doubleJump:false},
 {n:6,name:'Mountain Traffic',sub:'Snowmobiles coming uphill!',k:{boulderM:1,skier:1,snowmobile:4,log:1},base:360,ramp:4,max:500,len:8000,pair:.1,gapX:1,storm:[.18,.45],spike:.2,pick:.45,doubleJump:false},
 {n:7,name:'Snowcat Alley',sub:'Jump ON the snowcats · double-jump unlocked',k:{snowcat:4,boulderM:1,boulderS:1,log:1,boulderL:1},base:370,ramp:4,max:520,len:8500,pair:0,gapX:1,storm:[.2,.5],spike:.25,pick:.5,doubleJump:true},
 {n:8,name:'Full Send',sub:'Everything + double-jump recovery',k:{boulderS:1,boulderM:1,boulderL:1.2,log:1,logLong:1,ice:1,coyote:1,skier:1,bear:1.2,moose:1.3,snowmobile:1.5,snowcat:1.5},base:400,ramp:5,max:600,len:10000,pair:.18,gapX:.75,storm:[.25,.55],spike:.3,pick:.55,doubleJump:true}];
var ENDLESS={n:9,name:'Endless',sub:'All hazards · double-jump on',k:LEVELS[7].k,base:330,ramp:8,max:760,len:Infinity,pair:.18,gapX:.75,storm:[.1,.55],spike:.25,pick:.5,endless:true,doubleJump:true};
// Achievements → faster boards (speed variants). Clear map; persisted in PR.ach.
var ACH={
 l3:{name:'Wild Tracks Clear',how:'Clear Level 3'},
 moose:{name:'First Moose',how:'Clear a moose'},
 catride:{name:'Snowcat Ride',how:'Land on a snowcat'},
 dj7:{name:'2× Jump Clear',how:'Clear Level 7'},
 l8:{name:'Full Campaign',how:'Clear Level 8'}
};
// spd = run speed multiplier (1 = stock). Ordered slow→fast for locker.
var BOARDS=[
 {id:'first',name:'First Tracks',c:'#ff6a1a',s:'#ffffff',spd:1,ach:null},
 {id:'ice',name:'Ice Runner',c:'#38b6ff',s:'#d9f3ff',spd:1.06,ach:'l3'},
 {id:'copper',name:'Coyote Copper',c:'#b5824a',s:'#3b2414',spd:1.10,ach:'moose'},
 {id:'timber',name:'Backwoods Timber',c:'#2f6b3a',s:'#c79a5e',spd:1.14,ach:'catride'},
 {id:'cat',name:'Snowcat Orange',c:'#ff9f1a',s:'#14213d',spd:1.18,ach:'dj7'},
 {id:'full',name:'Full Send',c:'#e0245e',s:'#ffd84a',spd:1.24,ach:'l8'}];
var PK='boulderDodge.progress',PR;try{PR=JSON.parse(localStorage.getItem(PK))}catch(e){}
PR=PR||{};PR.done=PR.done||[];PR.board=PR.board||'first';PR.best=PR.best||{};PR.ach=PR.ach||[];PR.diff=PR.diff||'normal';
function saveP(){try{localStorage.setItem(PK,JSON.stringify(PR))}catch(e){}}
function unlocked(n){return n===1||PR.done.indexOf(n-1)>=0||(n===9&&endlessOpen())}
function endlessOpen(){for(var i=1;i<=8;i++)if(PR.done.indexOf(i)<0)return false;return true}
function boardOpen(b){return !b.ach||PR.ach.indexOf(b.ach)>=0}
function board(){var b=BOARDS.filter(function(x){return x.id===PR.board&&boardOpen(x)})[0];return b||BOARDS[0];}
function boardSpd(){return board().spd||1;}
function diffM(){return DIFFS[PR.diff]||DIFFS.normal;}
function levelSpd(){return Math.min(SPD_CAP,SPD_BASE+Math.floor((LV.n-1)/2)*SPD_PER_2LV);}
function runSpd(){return boardSpd()*levelSpd()*diffM().spd*((S&&S.boostT>0)?COMBO_BOOST:1)*((S&&S.landBad>0)?0.92:1);}
function boardForAch(id){for(var i=0;i<BOARDS.length;i++)if(BOARDS[i].ach===id)return BOARDS[i];return null;}
function earnAch(id,silent){if(!ACH[id]||PR.ach.indexOf(id)>=0)return false;PR.ach.push(id);saveP();
 if(!silent){var bb=boardForAch(id);announce((ACH[id].name)+(bb?' → '+bb.name+' +'+Math.round((bb.spd-1)*100)+'%':''));S.flash=0.2;S.achToast=ACH[id].name+(bb?' · '+bb.name:'');S.achT=2.4;}
 return true;}
function syncAchFromDone(){if(PR.done.indexOf(3)>=0)earnAch('l3',true);if(PR.done.indexOf(7)>=0)earnAch('dj7',true);if(PR.done.indexOf(8)>=0)earnAch('l8',true);}
syncAchFromDone();
var LV=LEVELS[0];
var cv=document.getElementById('c'),cx=cv.getContext('2d'),W=640,scale=1,OY=0,worldH=VH;
var LS='boulderDodge.pb', pb=+(localStorage.getItem(LS)||0);
var muted=localStorage.getItem('boulderDodge.mute')==='1';
var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var S;
// RNG: rng=obstacles, rngW=storm, rngP=stars, rngB=bumps (seeded). Cosmetic flakes/particles/shake use Math.random.
function mk(s){return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
var rng,rngW,rngP,rngB,TER;function seed(s){rng=mk(s);rngW=mk((s^0x9e3779b9)>>>0);rngP=mk((s^0x85ebca6b)>>>0);rngB=mk((s^0xc2b2ae35)>>>0);
 var rt=mk((s^0x27d4eb2f)>>>0);TER=[rt()*6.283,rt()*6.283,rt()*6.283];}
// Terrain authority: hills + tabletops share one height fn (draw + physics). Positive = dip (↓Y), negative = raise (↑Y).
var HILL=[0,28,44,56,64,74,74,52,88,88];
// Snowboard TABLETOPS (not twin-mound moguls): amp capped · takeoff / flat deck / landing. L7 tempered.
// Kicker = short deck; Table = long plateau you can ride.
// Steep takeoff + longer flat deck so silhouette reads as tabletop, not twin mounds
var KICK_A=[0,12,14,16,18,20,22,16,24,26],KICK_AP=[0,22,24,26,28,30,32,26,34,36],KICK_DK=[0,20,22,24,26,28,30,24,32,34],KICK_EX=[0,30,32,34,36,38,40,34,42,44];
var TAB_A=[0,16,18,20,22,24,26,20,28,30],TAB_AP=[0,28,30,32,34,36,38,32,40,42],TAB_DK=[0,70,76,82,88,94,100,84,108,114],TAB_EX=[0,36,38,40,42,44,46,40,48,50];
function terr(wx){var A=HILL[LV.n]||12;return A*(0.55*Math.sin(wx/380+TER[0])+0.3*Math.sin(wx/170+TER[1])+0.15*Math.sin(wx/88+TER[2]));}
// Tabletop: absolute-flat deck in gY (compensates terr so plateaus don't undulate into twin mounds).
function bumpH(wx){if(!S||!S.bumps)return 0;var h=0;for(var i=0;i<S.bumps.length;i++){var bm=S.bumps[i],dx=wx-bm.wx,ap=bm.ap,dk=bm.deck,ex=bm.ex,a=bm.amp,L=-(ap+dk),R=dk+ex;
 if(dx<=L||dx>=R)continue;
 // Desired raise so GROUND+terr(wx)+bump = GROUND+terr(center)-amp  ⇒ bump = terr(c)-amp-terr(wx)
 var flat=terr(bm.wx)-a-terr(wx);
 if(dx<-dk){var t=(dx-L)/ap,e=terr(bm.wx)-a-terr(bm.wx-dk);h+=e*t;}
 else if(dx<=dk)h+=flat;
 else{var u=1-(dx-dk)/ex,e2=terr(bm.wx)-a-terr(bm.wx+dk);h+=e2*u;}}
 return h;}
function H(sx){var wx=S.dist+sx-S.p.x;return terr(wx)+bumpH(wx);}
function gY(sx){return GROUND+H(sx);} // absolute snow surface Y at screen x — AUTHORITY for draw + physics
function slopeAt(sx){return Math.atan2(H(sx+6)-H(sx-6),12);}
function airStats(){if(LV.doubleJump)return {air:AIR*1.42,maxh:MAXH*1.55,dj:true};return {air:AIR,maxh:MAXH,dj:false};}
function hillPad(){return (HILL[LV.n]||12)*0.38+(TAB_A[LV.n]||KICK_A[LV.n]||0)*0.28;}
var SPAWN_AHEAD=2000,WARN_T=2.0;
function reset(sd,lv){if(lv)LV=lv;seed(sd==null?(LV.endless?(Date.now()>>>0):1000+LV.n):sd);
 var gy0=GROUND+terr(0),m0=boardSpd()*levelSpd()*diffM().spd;
 S={pops:[],blog:[],bumps:[],bumpN:0,hop:0,climbVy:0,log:[],wlog:[],warnLog:[],arrGapMin:1e9,lastTail:null,lv:LV,seen:{},bonus:0,pick:0,pickups:[],pickT:2,clearPts:0,storm:LV.storm[0]*diffM().storm,stormT:LV.storm[0]*diffM().storm,stormClock:3,parts:[],flash:0,land:0,mode:'ready',t:0,dist:0,cleared:0,spd:LV.base*m0,p:{x:110,y:gy0,vy:0,on:true,airUsed:0},obs:[],nextX:900,flakes:[],shake:0,minGapT:1e9,done:false,newBest:false,playAt:0,achToast:'',achT:0,rodeCat:false,flip:0,holding:false,combo:0,boostT:0,nearPts:0,flipPts:0,landBad:0};
 for(var i=0;i<160;i++)S.flakes.push({x:Math.random()*1000,y:Math.random()*VH,r:1.4+Math.random()*2.8,z:Math.random(),vx:(Math.random()-.5)*18});}
function threatPts(k){var d=KINDS[k];if(!d)return 20;if(d.deck)return 42;if(d.vx)return 48;return 12+Math.round(d.h*0.7)+Math.round(d.w*0.12);}
function score(){return Math.floor(S.dist/10)+S.clearPts+S.bonus+S.pick*30+S.bumpN*10+S.nearPts+S.flipPts}
function clearPx(k,v){var d=KINDS[k],a=airStats();if(d.deck)return 1e9;
 var he=d.h+hillPad();return (v+(d.vx||0))*a.air*Math.sqrt(Math.max(0,1-(he-4)/a.maxh));}
function fits(k,v){var d=KINDS[k];return d.deck||(d.w+14)<=0.85*clearPx(k,v);}
function pickKind(){var tot=0,k,ks=Object.keys(LV.k),cap=LV.max*runSpd();ks.forEach(function(n){tot+=LV.k[n]});
 for(var tries=0;tries<12;tries++){var rr=rng()*tot;k=ks[ks.length-1];for(var i=0;i<ks.length;i++){rr-=LV.k[ks[i]];if(rr<=0){k=ks[i];break;}}
  if(fits(k,S.spd)&&fits(k,cap))return k;}
 return 'boulderS';}
function mkFeat(kind,wx,A,AP,DK,EX){return {wx:wx,hit:false,kind:kind,amp:A*(0.92+rngB()*0.12),ap:AP*(0.94+rngB()*0.1),deck:DK*(0.94+rngB()*0.1),ex:EX*(0.94+rngB()*0.1)};}
function spawn(){
 var p=S.p,ahead=S.nextX-p.x,a=airStats(),m=runSpd(),dg=diffM().gap;
 if(S.dist+ahead>LV.len-250){S.nextX+=1e6;return;}
 var k=pickKind(),d=KINDS[k],cols=Object.keys(BCOL);
 var vArr=Math.min(LV.max*m,S.spd+LV.ramp*m*ahead/Math.max(1,S.spd));
 var lead=d.vx?d.vx*ahead/S.spd*1.1:0;
 var o={k:k,x:S.nextX+lead,w:d.w,h:d.h,vx:d.vx||0,deck:!!d.deck,passed:false,near:false,c:cols[Math.floor(rng()*3)],ph:rng()*6};
 S.obs.push(o);S.log.push(k+'@'+Math.round(S.dist+o.x-S.p.x));var end=o.x+o.w-S.nextX;
 if(!d.vx&&!d.deck&&LV.pair&&rng()<LV.pair){var w2=KINDS.boulderM;
  if(d.w+60+w2.w-8+22<0.8*clearPx('boulderM',vArr)){var o2={k:'boulderM',x:o.x+d.w+60,w:w2.w,h:w2.h,vx:0,passed:false,near:false,pair:true,c:'brown',ph:0};S.obs.push(o2);S.log.push('pair@'+Math.round(S.dist+o2.x-S.p.x));end=o2.x+o2.w-S.nextX;}}
 // Fairness: reaction + air + POST_LIP after any feature lip before next hazard
 var need=vArr*(REACT+a.air+POST_LIP+(d.deck?0.2:0))+40+hillPad()*0.5;
 var g=need+rng()*vArr*LV.gapX*dg;
 S.lastGapT=g/vArr;
 var lipClear=vArr*POST_LIP,ba=S.nextX+end+90,bb=S.nextX+end+g-lipClear-50;
 // ONE feature per gap only (no twin side-by-side mounds). Prefer tabletop on wider gaps.
 if(bb-ba>100){var n=LV.n,wantTab=(bb-ba>TAB_AP[n]+TAB_DK[n]*2+TAB_EX[n]+60)&&rngB()<0.34;
  if(wantTab){var tw=TAB_AP[n]+TAB_DK[n]*2+TAB_EX[n],bx=ba+rngB()*Math.max(10,bb-ba-tw),cx0=bx+TAB_AP[n]+TAB_DK[n];
   var feat=mkFeat('table',Math.round(S.dist+cx0-S.p.x),TAB_A[n]||20,TAB_AP[n]||40,TAB_DK[n]||56,TAB_EX[n]||44);S.bumps.push(feat);S.blog.push(feat.wx);}
  else{var kw=KICK_AP[n]+KICK_DK[n]*2+KICK_EX[n],bx2=ba+rngB()*Math.max(10,bb-ba-kw),cx2=bx2+KICK_AP[n]+KICK_DK[n];
   var kf=mkFeat('kicker',Math.round(S.dist+cx2-S.p.x),KICK_A[n]||16,KICK_AP[n]||32,KICK_DK[n]||14,KICK_EX[n]||36);S.bumps.push(kf);S.blog.push(kf.wx);}}
 S.nextX+=end+g;
