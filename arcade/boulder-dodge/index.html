<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>
html,body{margin:0;height:100%;background:#1b2a44;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh}

#pause{right:10px}#mute{right:62px}#menuB{right:114px}
#jumpB{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:2;width:92px;height:92px;border-radius:50%;border:4px solid #fff;background:#2bd17e;color:#0b1830;font:800 20px/1.05 system-ui,sans-serif;letter-spacing:.04em;box-shadow:0 6px 0 #146b3f,0 10px 24px #0008;display:none;align-items:center;justify-content:center;text-align:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:0;transition:background .12s,color .12s,box-shadow .12s,transform .12s}

#resumeOv{position:fixed;inset:0;z-index:4;background:#0b1830d8;display:none;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}

#resumeB:active{transform:scale(.96)}
#menu{position:fixed;inset:0;z-index:3;background:#0b1830ee;color:#fff;font:15px sans-serif;overflow:auto;display:none;padding:14px;box-sizing:border-box;text-align:center}
#menu h1{margin:4px 0 2px;font-size:26px;letter-spacing:1px}#menu h2{font-size:15px;margin:14px 0 6px;color:#9fd3ff}
.grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:720px;margin:0 auto}
.lv,.bd{min-width:150px;min-height:48px;border-radius:10px;border:2px solid #fff5;background:#1d3b66;color:#fff;font:bold 14px sans-serif;padding:6px 8px}
.lv[disabled],.bd[disabled]{opacity:.4}.lv.done{border-color:#2bd17e}.bd.sel{border-color:#ffd84a;background:#3a3a14}
.lv small,.bd small{display:block;font-weight:normal;font-size:12px;opacity:.9;margin-top:2px}
.lv{text-align:left;display:flex;align-items:center;gap:10px}.lv b.n{flex:none;width:34px;height:34px;border-radius:50%;background:#0b1830;display:flex;align-items:center;justify-content:center;font-size:16px}
.lv.done b.n{background:#2bd17e;color:#0b1830}.lv span.t{flex:1}
.bd{display:flex;align-items:center;gap:10px;text-align:left}.sw{flex:none;width:64px;height:14px;border-radius:7px;border:2px solid #14213d;box-shadow:0 2px 0 #0006}
#close{position:sticky;top:0;float:right;width:44px;height:44px;border-radius:10px;border:2px solid #fff8;background:#0006;color:#fff;font:bold 18px sans-serif}
@media (max-width:540px){#menu{padding:10px 12px}.grid{flex-direction:column;align-items:stretch}.lv,.bd{min-width:0;width:100%;min-height:56px;font-size:16px}#menu h1{font-size:24px;margin-top:10px}#jumpB{width:100px;height:100px;font-size:22px}#jumpB.mode-jump{font-size:24px}}
</style></head><body>
<canvas id="c"></canvas>
<button class="btn" id="pause" aria-label="Pause">II</button>
<button class="btn" id="mute" aria-label="Mute">♪</button>
<button class="btn" id="menuB" aria-label="Levels and Board Locker">☰</button>
<button id="jumpB" type="button" aria-label="Play">PLAY</button>
<div id="hint">Tap PLAY to start — then JUMP</div>
<div id="resumeOv" role="dialog" aria-label="Paused"><button id="resumeB" type="button">RESUME</button></div>
<div id="menu" role="dialog" aria-label="Levels"></div>
<script>
(function(){
"use strict";
var TEST=/[?&]test=1/.test(location.search),GOD=false; // GOD: test-only invulnerability for replay comparisons
// ---- constants (world units: virtual height 360) ----
var VH=360, GROUND=300, G=3600, JV=-950, DT=1/120;
var AIR=2*-JV/G;               // airtime (s) ~0.63
var MAXH=JV*JV/(2*G);          // apex height ~129
var BASE=320, MAXSPD=760, RAMP=9; // px/s, px/s per second
// v0.3 obstacle catalog. Each entry: w,h (hitbox), min unlock time (s), weight.
var BCOL={brown:['#7a4b26','#a06a3c'],grey:['#6e7178','#9a9ea6'],dark:['#2e3036','#4c5058']};
var KINDS={
 boulderS:{w:20,h:16,t:0,wt:3},boulderM:{w:34,h:28,t:0,wt:3},boulderL:{w:48,h:40,t:6,wt:2},
 log:{w:70,h:22,t:0,wt:2},logLong:{w:96,h:18,t:10,wt:1},ice:{w:28,h:46,t:4,wt:1},
 coyote:{w:42,h:26,t:3,wt:2},skier:{w:26,h:52,t:8,wt:2},bear:{w:56,h:46,t:14,wt:1.5},moose:{w:54,h:70,t:20,wt:1},
 snowmobile:{w:54,h:30,t:0,wt:1,vx:110},   // drives uphill toward you: closes at speed+110 px/s
 snowcat:{w:150,h:44,t:0,wt:1,deck:true}}; // big groomer: flat deck you jump ONTO and ride across
var REACT=0.30; // assumed human reaction time (s) added to every gap
// Level configs (data-driven). k: kind->weight. base/ramp/max speed px/s. len px. pair: chance of a one-jump pair.
// gapX: extra random spacing (x speed). storm:[min,max] snowfall 0..1, spike: chance of random storm spike. pick: pickup rate/s.
var LEVELS=[
 {n:1,name:'First Tracks',sub:'Small boulders. Learn the jump.',k:{boulderS:1},base:290,ramp:2,max:340,len:4200,pair:0,gapX:1.3,storm:[0,.08],spike:0,pick:.25,tempo:.9},
 {n:2,name:'Rock Garden',sub:'Bigger boulders + logs',k:{boulderS:2,boulderM:3,boulderL:2,log:2,logLong:1},base:310,ramp:3,max:400,len:6000,pair:.1,gapX:1.1,storm:[.05,.15],spike:0,pick:.3,tempo:.95},
 {n:3,name:'Wild Tracks',sub:'Coyotes on the run',k:{boulderS:1,boulderM:2,log:1,coyote:4},base:330,ramp:3,max:440,len:7000,pair:.12,gapX:1,storm:[.1,.3],spike:.1,pick:.35,tempo:1},
 {n:4,name:'Crowded Slopes',sub:'Skiers + ice',k:{boulderM:1,coyote:1,skier:4,ice:3,log:1},base:350,ramp:4,max:480,len:7500,pair:.15,gapX:.9,storm:[.15,.4],spike:.15,pick:.4,tempo:1.03},
 {n:5,name:'Backwoods',sub:'Polar bears + moose',k:{boulderL:1,log:1,bear:3,moose:3,coyote:1},base:360,ramp:4,max:500,len:8000,pair:.12,gapX:.9,storm:[.2,.5],spike:.2,pick:.4,tempo:1.06},
 {n:6,name:'Mountain Traffic',sub:'Snowmobiles coming uphill!',k:{boulderM:1,skier:1,snowmobile:4,log:1},base:360,ramp:4,max:500,len:8000,pair:.1,gapX:1,storm:[.25,.55],spike:.25,pick:.45,tempo:1.1},
 {n:7,name:'Snowcat Alley',sub:'Jump ON the snowcats',k:{snowcat:4,boulderM:1,boulderS:1,log:1},base:370,ramp:4,max:520,len:8500,pair:0,gapX:1,storm:[.3,.6],spike:.3,pick:.5,tempo:1.12},
 {n:8,name:'Full Send',sub:'Everything at once',k:{boulderS:1,boulderM:1,boulderL:1,log:1,logLong:1,ice:1,coyote:1,skier:1,bear:1,moose:1,snowmobile:1.5,snowcat:1.5},base:400,ramp:5,max:600,len:10000,pair:.15,gapX:.8,storm:[.35,.75],spike:.35,pick:.55,tempo:1.18}];
var ENDLESS={n:9,name:'Endless',sub:'All hazards, no finish',k:LEVELS[7].k,base:330,ramp:8,max:760,len:Infinity,pair:.15,gapX:.8,storm:[.1,.8],spike:.3,pick:.5,tempo:1.1,endless:true};
// Board Locker (cosmetic only; identical hitbox). unlock = level number to clear (0 = owned).
var BOARDS=[
 {id:'first',name:'First Tracks',c:'#ff6a1a',s:'#ffffff',unlock:0},
 {id:'ice',name:'Ice Runner',c:'#38b6ff',s:'#d9f3ff',unlock:2},
 {id:'full',name:'Full Send',c:'#e0245e',s:'#ffd84a',unlock:8},
 {id:'copper',name:'Coyote Copper',c:'#b5824a',s:'#3b2414',unlock:3},
 {id:'timber',name:'Backwoods Timber',c:'#2f6b3a',s:'#c79a5e',unlock:5},
 {id:'cat',name:'Snowcat Orange',c:'#ff9f1a',s:'#14213d',unlock:7}];
var PK='boulderDodge.progress',PR;try{PR=JSON.parse(localStorage.getItem(PK))}catch(e){}
PR=PR||{};PR.done=PR.done||[];PR.board=PR.board||'first';PR.best=PR.best||{};
function saveP(){try{localStorage.setItem(PK,JSON.stringify(PR))}catch(e){}}
function unlocked(n){return n===1||PR.done.indexOf(n-1)>=0||(n===9&&endlessOpen())}
function endlessOpen(){for(var i=1;i<=8;i++)if(PR.done.indexOf(i)<0)return false;return true}
function boardOpen(b){return b.unlock===0||PR.done.indexOf(b.unlock)>=0}
function board(){var b=BOARDS.filter(function(x){return x.id===PR.board&&boardOpen(x)})[0];return b||BOARDS[0];}
var LV=LEVELS[0];
var KN=Object.keys(KINDS);
var cv=document.getElementById('c'),cx=cv.getContext('2d'),W=640,scale=1,OY=0;
var LS='boulderDodge.pb', pb=+(localStorage.getItem(LS)||0);
var muted=localStorage.getItem('boulderDodge.mute')==='1';
var S; // state
// RNG policy: rng = obstacle layout (seeded), rngW = storm timeline (seeded), rngP = bonus stars (seeded).
// Cosmetic-only randomness (particles, flake positions, shake, hi-hat noise) uses Math.random and never touches seeded streams.
function mk(s){return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
var rng,rngW,rngP,rngB,TER;function seed(s){rng=mk(s);rngW=mk((s^0x9e3779b9)>>>0);rngP=mk((s^0x85ebca6b)>>>0);rngB=mk((s^0xc2b2ae35)>>>0);
 var rt=mk((s^0x27d4eb2f)>>>0);TER=[rt()*6.283,rt()*6.283,rt()*6.283];}
// v0.6 terrain: seeded rolling hills/dips (visual layer; physics stays on a flat reference line so every fairness window is unchanged)
var HILL=[0,14,24,32,36,44,44,32,50,50]; // v0.6.1: ~1.8x (L1 1.4x readable, L7 1.6x snowcat-friendly)
function terr(wx){var A=HILL[LV.n]||10;return A*(0.55*Math.sin(wx/420+TER[0])+0.3*Math.sin(wx/190+TER[1])+0.15*Math.sin(wx/97+TER[2]));}
function H(sx){return terr(S.dist+sx-S.p.x);} // vertical offset at a screen x (positive = dip)
var SPAWN_AHEAD=2000,WARN_T=2.0; // world px ahead of rider where hazards are generated (viewport independent); warning lead (s)
function reset(sd,lv){if(lv)LV=lv;seed(sd==null?(LV.endless?(Date.now()>>>0):1000+LV.n):sd);
 S={pops:[],blog:[],bumps:[],bumpN:0,hop:0,log:[],wlog:[],warnLog:[],arrGapMin:1e9,lastTail:null,lv:LV,seen:{},bonus:0,pick:0,pickups:[],pickT:2,storm:LV.storm[0],stormT:LV.storm[0],stormClock:3,parts:[],flash:0,land:0,mode:'ready',t:0,dist:0,cleared:0,spd:LV.base,p:{x:110,y:GROUND,vy:0,on:true},obs:[],nextX:900,flakes:[],shake:0,minGapT:1e9,done:false,newBest:false};
 for(var i=0;i<230;i++)S.flakes.push({x:Math.random()*1000,y:Math.random()*VH,r:1+Math.random()*2.5,z:Math.random()});}
function score(){return Math.floor(S.dist/10)+S.cleared*25+S.bonus+S.pick*50+S.bumpN*10}
// ---- fair pattern generator ----
function clearPx(k,v){var d=KINDS[k];if(d.deck)return 1e9;return (v+(d.vx||0))*AIR*Math.sqrt(Math.max(0,1-(d.h-4)/MAXH));}
function fits(k,v){var d=KINDS[k];return d.deck||(d.w+14)<=0.85*clearPx(k,v);}  // jumpable with 15% timing slack
function pickKind(){var tot=0,k,ks=Object.keys(LV.k);ks.forEach(function(n){tot+=LV.k[n]});
 for(var tries=0;tries<12;tries++){var rr=rng()*tot;k=ks[ks.length-1];for(var i=0;i<ks.length;i++){rr-=LV.k[ks[i]];if(rr<=0){k=ks[i];break;}}
  if(fits(k,S.spd)&&fits(k,LV.max))return k;}  // generator filter: reject unjumpable picks
 return 'boulderS';}
function spawn(){
 var p=S.p,ahead=S.nextX-p.x;
 if(S.dist+ahead>LV.len-250){S.nextX+=1e6;return;}           // keep finish line clear
 var k=pickKind(),d=KINDS[k],cols=Object.keys(BCOL);
 var vArr=Math.min(LV.max,S.spd+LV.ramp*ahead/S.spd);           // speed when it reaches the rider
 var vrel=vArr+(d.vx||0);
 // moving hazards close faster: push them back so the gap to the previous hazard is preserved on arrival
 var lead=d.vx?d.vx*ahead/S.spd*1.1:0;
 var o={k:k,x:S.nextX+lead,w:d.w,h:d.h,vx:d.vx||0,deck:!!d.deck,passed:false,c:cols[Math.floor(rng()*3)],ph:rng()*6};
 S.obs.push(o);S.log.push(k+'@'+Math.round(S.dist+o.x-S.p.x));var end=o.x+o.w-S.nextX;
 if(!d.vx&&!d.deck&&LV.pair&&rng()<LV.pair){var w2=KINDS.boulderM;
  if(d.w+60+w2.w-8+22<0.8*vArr*AIR*Math.sqrt(1-(Math.max(d.h,28)-4)/MAXH)){var o2={k:'boulderM',x:o.x+d.w+60,w:w2.w,h:w2.h,vx:0,passed:false,pair:true,c:'brown',ph:0};S.obs.push(o2);S.log.push('pair@'+Math.round(S.dist+o2.x-S.p.x));end=o2.x+o2.w-S.nextX;}}
 // reaction-time gap: time from landing past this hazard to the next one >= REACT + AIR (+ deck drop time)
 var need=vArr*(REACT+AIR+(d.deck?0.2:0))+30;
 var g=need+rng()*vArr*LV.gapX;
 S.lastGapT=g/vArr;
 var ba=S.nextX+end+100,bb=S.nextX+end+g-100;   // small snow bumps: only in the clear middle of a gap (>=100px from any hazard)
 if(bb-ba>40){var nb=Math.floor(rngB()*3);for(var q=0;q<nb;q++){var bx=ba+rngB()*(bb-ba),wx=Math.round(S.dist+bx-S.p.x);S.bumps.push({wx:wx,hit:false});S.blog.push(wx);}}
 S.nextX+=end+g;
}
function jump(){if(S.mode!=='play')return; if(S.p.on){S.p.vy=JV;S.p.on=false;jumpBoing();}}
function puff(x,y,n,c,v){var R=Math.random;for(var i=0;i<n;i++)S.parts.push({x:x,y:y,vx:(R()-.5)*2*v,vy:-R()*v,l:0.4+R()*0.3,c:c,s:2+R()*2});}
function deckUnder(){var p=S.p;for(var i=0;i<S.obs.length;i++){var o=S.obs[i];if(o.deck&&p.x+9>o.x&&p.x-9<o.x+o.w)return o;}return null;}
function step(dt){S.land=Math.max(0,S.land-dt*6);S.flash=Math.max(0,S.flash-dt);
 for(var q=S.parts.length-1;q>=0;q--){var P=S.parts[q];P.x+=P.vx*dt;P.y+=P.vy*dt;P.vy+=600*dt;P.l-=dt;if(P.l<=0)S.parts.splice(q,1);}
 if(S.parts.length>150)S.parts.splice(0,S.parts.length-150);
 S.t+=dt; S.spd=Math.min(LV.max,LV.base+LV.ramp*S.t);
 var dx=S.spd*dt; S.dist+=dx;
 var p=S.p,py0=p.y;
 S.nextX-=dx; while(S.nextX<SPAWN_AHEAD)spawn();
 for(var i=S.obs.length-1;i>=0;i--){var o=S.obs[i];o.x-=dx+o.vx*dt;if(o.x+o.w<-80)S.obs.splice(i,1);}
 var dk=deckUnder(),floor=dk?GROUND-dk.h:GROUND;
 if(p.on&&p.y<floor-0.5)p.on=false;                       // rode off the end of a snowcat deck
 if(!p.on){p.vy+=G*dt;p.y+=p.vy*dt;
  if(p.vy>=0&&p.y>=floor&&py0<=floor+1){p.y=floor;p.vy=0;p.on=true;S.land=1;puff(p.x,floor,8,'#ffffff',120);}
  else if(p.y>=GROUND){p.y=GROUND;p.vy=0;p.on=true;S.land=1;}}
 else if(Math.random()<0.3)S.parts.push({x:p.x-16,y:p.y-2,vx:-60-Math.random()*60,vy:-30*Math.random(),l:0.3,c:'#ffffff',s:2});
 var px1=p.x-11,px2=p.x+11,py1=p.y-30,py2=p.y;
 for(i=0;i<S.obs.length;i++){o=S.obs[i];
  if(px2>o.x+4&&px1<o.x+o.w-4&&py2>GROUND-o.h+(o.deck?6:4)&&py1<GROUND){if(!GOD){crash();return;}}
  if((o.vx||o.deck)&&o.warnT==null&&(o.x-px2)/(S.spd+o.vx)<=WARN_T)o.warnT=S.t;
  if(o.visT==null&&o.x<=W)o.visT=S.t;
  if(o.arrT==null&&o.x<=px2){o.arrT=S.t;if(!o.pair&&S.lastTail!=null)S.arrGapMin=Math.min(S.arrGapMin,o.arrT-S.lastTail);
   if(o.vx||o.deck)S.warnLog.push({k:o.k,spd:Math.round(S.spd),warn:+(o.arrT-(o.warnT==null?o.arrT:o.warnT)).toFixed(3),vis:+(o.arrT-o.visT).toFixed(3)});}
  if(!o.passed&&o.x+o.w<px1){o.passed=true;S.lastTail=S.t;S.cleared++;if(!S.seen[o.k]){S.seen[o.k]=1;S.bonus+=5;}S.flash=0.12;puff(p.x,p.y-20,6,'#ffd84a',160);beep(880,0.05,'triangle',0.08);}}
 if(S.lastGapT<S.minGapT)S.minGapT=S.lastGapT;
 // snowstorm: drifts toward a random target within the level band; occasional spikes (visual only, hazards stay drawn above fog)
 S.stormClock-=dt;if(S.stormClock<=0){var lo=LV.storm[0],hi=LV.storm[1];S.stormT=rngW()<LV.spike?Math.min(0.9,hi+0.15):lo+rngW()*(hi-lo)*Math.min(1,0.4+S.t/40);S.stormClock=3+rngW()*6;S.wlog.push('s'+S.stormT.toFixed(3));}
 S.storm+=(S.stormT-S.storm)*Math.min(1,dt*0.8);
 var nf=Math.floor(30+200*S.storm),wind=40+260*S.storm;
 for(i=0;i<nf;i++){var f=S.flakes[i];f.x-=dx*(0.2+0.4*f.z)+wind*dt*(0.5+f.z);f.y+=(40+80*S.storm)*dt*(0.5+f.z);if(f.y>VH){f.y=-5;f.x=Math.random()*W;}if(f.x<0)f.x+=W;}
 // falling bonus snowflake-stars: spawn so they pass jump height at the rider's x; optional, never harmful
 S.pickT-=dt;if(S.pickT<=0&&S.dist<LV.len-600){S.pickT=1/LV.pick*(0.6+rngP()*0.8);var T=1.1+rngP()*0.6,hy=GROUND-(55+rngP()*60);
  S.pickups.push({x:p.x+S.spd*T,y:hy-50*T,vy:50,a:0});S.wlog.push('p'+Math.round(S.dist)+':'+Math.round(hy));}
 for(i=S.pickups.length-1;i>=0;i--){var u=S.pickups[i];u.x-=dx;u.y+=u.vy*dt;u.a+=dt*5;
  if(Math.abs(u.x-p.x)<20&&u.y>py1-10&&u.y<py2+6){S.pick++;S.pickups.splice(i,1);puff(u.x,u.y,10,'#ffd84a',180);beep(1320,0.07,'square',0.08);S.flash=0.15;continue;}
  if(u.x<-20||u.y>GROUND)S.pickups.splice(i,1);}
 S.hop=Math.max(0,S.hop-dt*4);
 for(i=S.bumps.length-1;i>=0;i--){var bm=S.bumps[i],bxs=bm.wx-S.dist+p.x;
  if(!bm.hit&&Math.abs(bxs-p.x)<14&&p.on&&p.y===GROUND){bm.hit=true;S.bumpN++;S.hop=1;S.pops.push({x:p.x,y:p.y-50,l:0.6});puff(p.x,GROUND-2,6,'#ffffff',90);beep(300+Math.random()*80,0.04,'square',0.06);} // cosmetic hop only: physics untouched
  if(bxs<-40)S.bumps.splice(i,1);}
 for(i=S.pops.length-1;i>=0;i--){S.pops[i].l-=dt;S.pops[i].y-=30*dt;if(S.pops[i].l<=0)S.pops.splice(i,1);}
